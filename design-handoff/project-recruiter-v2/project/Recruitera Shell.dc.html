<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 800},
  &quot;activePage&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;candidates&quot;,&quot;jobs&quot;,&quot;talent-pools&quot;,&quot;calendar&quot;,&quot;analytics&quot;,&quot;settings&quot;,&quot;home&quot;], &quot;default&quot;: &quot;candidates&quot;, &quot;section&quot;: &quot;Navigation&quot;}
}">
class Component extends DCLogic {
  componentDidMount() {
    const nav = this.nav.current;
    if (!nav) return;
    const labels = nav.querySelectorAll('.nav-label');
    const toggle = nav.querySelector('.nav-toggle');
    let collapsed = false;
    const setCollapsed = (c) => {
      collapsed = c;
      nav.style.width = c ? '52px' : '212px';
      nav.style.borderStyle = c ? 'solid' : 'none';
      labels.forEach(l => l.style.display = c ? 'none' : '');
      if (c) nav.classList.add('rail'); else nav.classList.remove('rail');
      if (toggle) { const tl = toggle.querySelector('.nav-label'); if (tl) tl.style.display = c ? 'none' : ''; }
    };
    if (toggle) toggle.addEventListener('click', () => setCollapsed(!collapsed));
    // nav active switching
    const items = nav.querySelectorAll('.nav-item');
    items.forEach(item => {
      item.addEventListener('click', () => {
        items.forEach(i => { i.classList.remove('nav-active'); i.style.background = ''; i.style.color = '#4a5750'; const l = i.querySelector('.nav-label'); if(l) l.style.fontWeight = '600'; });
        item.classList.add('nav-active'); item.style.background = 'rgba(201,253,19,0.38)'; item.style.color = '#3f5600';
        const l = item.querySelector('.nav-label'); if(l) l.style.fontWeight = '700';
      });
    });
    // banner close
    const banner = document.querySelector('.sample-banner');
    const bannerX = document.querySelector('.banner-x');
    if (bannerX && banner) bannerX.addEventListener('click', () => { banner.style.display = 'none'; });
  }
  renderVals() { return { children: this.props.children }; }
}
</script>
