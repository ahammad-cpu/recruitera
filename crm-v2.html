      + '<div style="font-size:22px;font-weight:800;letter-spacing:-.025em;">Tasks</div>'
      + '<div style="flex:1;"></div>'
      + '<select style="height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);outline:0;">'
        + '<option>All AMs</option>' + ((LIVE_AMS && LIVE_AMS.length ? LIVE_AMS : []).map(a => '<option>'+esc(a.name)+'</option>').join(''))
      + '</select>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">' + urgentCard + groupCard + '</div>'
    + tableBlock
  + '</div>';
}

// =========================================================================
//   RENDER: NOTIFICATIONS
// =========================================================================
function renderNotifications(){
  const acctById = new Map((state.accounts || []).map(a => [a.id, a]));
  const rows = state.notifications || [];
  const KIND_ICON = { mention:'💬', task_assigned:'📌', task_due:'⏰', task_overdue:'⏰', renewal_due:'📅', renewal_overdue:'⚡', deal_won:'🏆', deal_lost:'✗', system:'ℹ️' };
  const KIND_V    = { mention:'info', task_assigned:'info', task_due:'warn', task_overdue:'bad', renewal_due:'warn', renewal_overdue:'bad', deal_won:'ok', deal_lost:'neutral', system:'neutral' };
  const timeAgo = (iso) => {
    if (!iso) return '';
    const t = Date.parse(iso); if (isNaN(t)) return '';
    const s = (Date.now() - t) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s/60) + 'm ago';
    if (s < 86400) return Math.round(s/3600) + 'h ago';
    if (s < 86400*7) return Math.round(s/86400) + 'd ago';
    return new Date(t).toLocaleDateString('en-US', { month:'short', day:'numeric' });
  };
  const items = rows.map(n => {
    const a = n.account_id ? acctById.get(n.account_id) : null;
    return {
      title: n.title || (n.kind ? n.kind.replace(/_/g,' ') : 'Notification'),
      sub: n.body || (a ? a.name : ''),
      tag: (n.kind || 'system').replace(/_/g,' '),
      time: timeAgo(n.created_at),
      unread: !n.read_at,
      icon: KIND_ICON[n.kind] || '🔔',
      v: KIND_V[n.kind] || 'neutral',
      acctId: n.account_id,
    };
  });
  const unreadCount = items.filter(n => n.unread).length;
  const iconWrap = (v) => 'width:36px;height:36px;border-radius:10px;background:'+({bad:'var(--bad-bg)',warn:'var(--warn-bg)',ok:'var(--ok-bg)',info:'var(--info-bg)',lime:'var(--accent-soft)'}[v]||'var(--surface-2)')+';display:grid;place-items:center;font-size:16px;flex-shrink:0;';
  const list = items.map(n =>
    '<div class="row-h" onclick="'+(n.acctId?('openDetail('+jsArg(n.acctId)+')'):'toast(\'Nothing to open on this notification\')')+'" style="display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:var(--surface);border-radius:12px;cursor:pointer;margin-bottom:4px;border:1px solid var(--border);">'
      + '<div style="'+iconWrap(n.v)+'">'+n.icon+'</div>'
      + '<div style="flex:1;min-width:0;">'
        + '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;">'+esc(n.title)+'</div>'
        + '<div style="font-size:13px;color:var(--text-2);font-weight:500;margin-bottom:5px;">'+esc(n.sub)+'</div>'
        + '<div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4);font-weight:700;">'+esc(n.tag)+' · '+esc(n.time)+'</div>'
      + '</div>'
      + (n.unread ? '<span style="width:8px;height:8px;border-radius:999px;background:var(--accent);flex-shrink:0;margin-top:6px;"></span>' : '')
    + '</div>').join('');
  return '<div style="padding:28px 32px 56px;max-width:860px;">'
    + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">'
      + '<div style="font-size:22px;font-weight:800;letter-spacing:-.025em;">Notifications</div>'
      + (unreadCount > 0 ? '<span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bad-bg);color:var(--bad);">'+unreadCount+' unread</span>' : '')
      + '<div style="flex:1;"></div>'
      + '<button onclick="toast(\'All notifications marked as read\')" style="display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--text-2);">Mark all read</button>'
    + '</div>'
    + (items.length
        ? '<div style="display:flex;flex-direction:column;gap:2px;">' + list + '</div>'
        : '<div style="padding:48px 20px;text-align:center;border:1.5px dashed var(--border-2);border-radius:14px;color:var(--text-3);font-size:13px;">No notifications yet.</div>')
  + '</div>';
}

// =========================================================================
//   RENDER: REPORTS
// =========================================================================
function setReportsTab(t){ setState({ reportsTab: t }); if ((t === 'revenue' || t === 'am') && state.targets == null) loadTargetsLive(); if ((t === 'campaign' || t === 'key') && state.utmLinks == null) loadUtmLive(); }
function setReportsOwner(id){ setState({ reportsOwnerId: id }); }
Object.assign(window, { setReportsTab, setReportsOwner });
function renderReports(){
  const acts = accts();
  // Warm target and utm caches so tab-switching is instant.
  if (state.targets == null && !state._reportsTargetsLoading) { state._reportsTargetsLoading = true; loadTargetsLive(); }
  if (state.utmLinks == null && !state._reportsUtmLoading) { state._reportsUtmLoading = true; loadUtmLive(); }
  const tab = state.reportsTab || 'key';
  const ownerId = state.reportsOwnerId || 'all';
  const scoped = ownerId === 'all' ? acts : acts.filter(a => a.am === ownerId);
  const roster = (LIVE_AMS && LIVE_AMS.length) ? LIVE_AMS : [];

  const pipelineVal = scoped.filter(a => ['mql','sql','demo','proposal'].includes(a.stage)).reduce((s,a)=>s+(a.value||0),0);
  const paidVal     = scoped.filter(a => a.stage === 'paid').reduce((s,a)=>s+(a.value||0),0);
  const wonVal      = scoped.filter(a => a.stage === 'won').reduce((s,a)=>s+(a.value||0),0);
  const wonCount    = scoped.filter(a => a.stage === 'won').length;
  const trialTotal  = scoped.filter(a => a.paid === 'Free Trial').length;
  const trialConv   = scoped.filter(a => a.paid === 'Free Trial' && ['won','paid'].includes(a.stage)).length;
  const collectRate = Math.round(scoped.filter(a=>a.stage==='paid').length / Math.max(scoped.filter(a=>['won','paid'].includes(a.stage)).length, 1) * 100);
  const paidCount   = scoped.filter(a=>a.paid==='Paid').length;

  const km = [
    { l:'Total revenue',    v: egp(paidVal),                                          sub:'stage = paid',          accent:true },
    { l:'Open pipeline',    v: egp(pipelineVal),                                       sub:'MQL → Proposal' },
    { l:'Collect rate',     v: collectRate + '%',                                     sub:'Collected ÷ invoiced' },
    { l:'Active customers', v: '' + paidCount,                                        sub:'paid_status = Paid' },
    { l:'Avg deal size',    v: egp(wonCount ? Math.round(wonVal / wonCount) : 0),     sub:'won deals' },
    { l:'Won deals',        v: '' + wonCount,                                         sub:'invoiced (not collected)' },
    { l:'Trial → paid',     v: (trialTotal ? Math.round(trialConv / trialTotal * 100) : 0) + '%', sub:'conversion rate' },
    { l:'Book size',        v: '' + acts.length,                                      sub:'accounts in scope' },
  ];
  const kmCards = km.map(k => '<div style="position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;box-shadow:var(--sh1);">'
    + (k.accent ? '<div style="position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);"></div>' : '')
    + '<div style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:800;">'+k.l+'</div>'
    + '<div style="margin-top:8px;"><span class="tnum" style="font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.05;">'+k.v+'</span></div>'
    + '<div style="font-size:11px;color:var(--text-3);font-weight:600;margin-top:3px;">'+k.sub+'</div>'
  + '</div>').join('');

  // Stage summary — every pipeline stage the CRM tracks, in funnel order.
  // Was hardcoded to mql/demo/proposal/won/lost and skipped SQL + Paid;
  // time-in-stage was fake numbers so that column is gone.
  const STAGE_KEYS = ['mql','sql','demo','proposal','won','paid','lost'];
  const stageRows = STAGE_KEYS.map(sk => {
    const rows = acts.filter(a => a.stage === sk);
    const st = STAGE[sk];
    const sum = rows.reduce((s,a)=>s+(a.value||0),0);
    const avg = rows.length ? Math.round(sum/rows.length) : 0;
    return '<div style="display:grid;grid-template-columns:1.6fr 80px 160px 160px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);">'
      + '<span style="'+chip(st.v)+'">'+st.label+'</span>'
      + '<span class="tnum" style="font-size:13px;font-weight:700;text-align:right;">'+rows.length+'</span>'
      + '<span class="tnum" style="font-size:13px;font-weight:700;text-align:right;color:var(--text);">'+egp(sum)+'</span>'
      + '<span class="tnum" style="font-size:12px;text-align:right;color:var(--text-2);">'+egp(avg)+'</span>'
    + '</div>';
  }).join('');
  const stageHead = '<div style="display:grid;grid-template-columns:1.6fr 80px 160px 160px;gap:14px;padding:11px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);">'
    + ['Stage','Count','Value','Avg deal'].map((l,i) => '<span style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);font-weight:800;'+(i>0?'text-align:right;':'')+'">'+l+'</span>').join('')
  + '</div>';

  // Team leaderboard — every LIVE_AMS profile that owns at least one account,
  // sorted by won revenue. Reuses the roster declared at the top of this fn.
  const amRows = roster.map(am => {
    const owned = acts.filter(a => a.am === am.id);
    if (!owned.length) return null;
    const wonSum = owned.filter(a => ['won','paid'].includes(a.stage)).reduce((s,a)=>s+(a.value||0),0);
    const closes = owned.filter(a => ['won','paid','lost'].includes(a.stage)).length;
    const wins   = owned.filter(a => ['won','paid'].includes(a.stage)).length;
    const winRate = closes ? Math.round(wins/closes*100) : 0;
    return { id: am.id, name: am.name, initials: am.initials, owned: owned.length, wonSum, winRate };
  }).filter(Boolean).sort((a,b) => b.wonSum - a.wonSum);
  const amTable = amRows.length
    ? amRows.map(r => '<div style="display:grid;grid-template-columns:2fr 80px 160px 140px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);">'
        + '<div style="display:flex;align-items:center;gap:10px;"><div style="'+avatar(r.initials,28,r.id||r.initials)+'">'+r.initials+'</div><span style="font-size:13px;font-weight:600;">'+esc(r.name)+'</span></div>'
        + '<span class="tnum" style="font-size:12.5px;text-align:right;font-weight:700;">'+r.owned+'</span>'
        + '<span class="tnum" style="font-size:12.5px;text-align:right;font-weight:700;color:var(--ok);">'+egp(r.wonSum)+'</span>'
        + '<div style="display:flex;align-items:center;gap:8px;"><div style="flex:1;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;"><div style="height:100%;width:'+r.winRate+'%;background:'+(r.winRate>=70?'var(--ok)':r.winRate>=40?'var(--warn)':'var(--bad)')+';"></div></div><span class="tnum" style="font-size:11px;font-weight:700;color:var(--text-3);">'+r.winRate+'%</span></div>'
      + '</div>').join('')
    : '<div style="padding:36px 20px;text-align:center;color:var(--text-3);font-size:13px;">No AMs with a book yet.</div>';
  const amHead = '<div style="display:grid;grid-template-columns:2fr 80px 160px 140px;gap:14px;padding:11px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);">'
    + ['Account manager','Accounts','Won revenue','Win rate'].map((l,i) => '<span style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);font-weight:800;'+(i>0?'text-align:right;':'')+'">'+l+'</span>').join('')
  + '</div>';

  // Owner picker + tab pills
  const ownerPicker = '<select onchange="setReportsOwner(this.value)" style="height:36px;padding:0 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);font-family:inherit;font-size:13px;font-weight:700;color:var(--text);outline:0;cursor:pointer;">'
    + '<option value="all"'+(ownerId==='all'?' selected':'')+'>All AMs</option>'
    + roster.map(p => '<option value="'+esc(p.id)+'"'+(p.id===ownerId?' selected':'')+'>'+esc(p.name||p.email||'')+'</option>').join('')
  + '</select>';
  const TAB_DEFS = [
    { k:'key',       l:'Key metrics' },
    { k:'pipeline',  l:'Pipeline' },
    { k:'revenue',   l:'Revenue vs target' },
    { k:'acq',       l:'Acquisition' },
    { k:'renewal',   l:'Renewal & churn' },
    { k:'am',        l:'AM performance' },
    { k:'campaign',  l:'Campaign' },
  ];
  const tabsBar = '<div style="display:flex;flex-wrap:wrap;gap:8px;">'
    + TAB_DEFS.map(t => {
        const active = tab === t.k;
        return '<button onclick="setReportsTab(\''+t.k+'\')" style="display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:9px;background:'+(active?'var(--accent-soft)':'var(--surface)')+';color:'+(active?'var(--accent-ink)':'var(--text-2)')+';border:1px solid '+(active?'var(--accent-strong)':'var(--border)')+';font-family:inherit;font-size:13px;font-weight:'+(active?800:600)+';cursor:pointer;">'+t.l+'</button>';
      }).join('')
  + '</div>';

  let body;
  if (tab === 'key') {
    body = renderReportsKeyMetrics(scoped, roster, { kmCards, stageHead, stageRows, amHead, amTable });
  } else if (tab === 'pipeline') {
    body = renderReportsPipeline(scoped, STAGE);
  } else if (tab === 'revenue') {
    body = renderReportsRevenue(scoped, roster);
  } else if (tab === 'acq') {
    body = renderReportsAcquisition(scoped);
  } else if (tab === 'renewal') {
    body = renderReportsRenewal(scoped);
  } else if (tab === 'am') {
    body = renderReportsAM(acts, roster);
  } else if (tab === 'campaign') {
    body = renderReportsCampaign();
  }

  return '<div class="sc" style="padding:20px 28px 80px;display:flex;flex-direction:column;gap:18px;">'
    + '<div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;">'
      + '<div><h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;">Reports</h1>'
        + '<div style="font-size:13px;color:var(--text-3);font-weight:500;margin-top:4px;">Cross-team performance — pipeline, revenue, acquisition, retention, AM activity.</div>'
      + '</div><div style="flex:1;"></div>'
      + ownerPicker
      + '<button onclick="toast(\'Export PDF — coming soon\')" style="display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--accent-strong);">📄 Export PDF</button>'
    + '</div>'
    + tabsBar
    + body
  + '</div>';
}

// --- Reports · Pipeline tab ----------------------------------------------
// --- Reports · Key metrics (rich landing) --------------------------------
function renderReportsKeyMetrics(scoped, roster, ctx){
  const { kmCards, stageHead, stageRows, amHead, amTable } = ctx;

  // Totals
  const paidVal    = scoped.filter(a => a.stage === 'paid').reduce((s,a)=>s+(a.value||0),0);
  const wonVal     = scoped.filter(a => a.stage === 'won').reduce((s,a)=>s+(a.value||0),0);
  const lostVal    = scoped.filter(a => a.stage === 'lost').reduce((s,a)=>s+(a.value||0),0);
  const pipelineVal= scoped.filter(a => ['mql','sql','demo','proposal'].includes(a.stage)).reduce((s,a)=>s+(a.value||0),0);
  const paidCount  = scoped.filter(a => a.paid === 'Paid').length;
  const trialActive= scoped.filter(a => a.paid === 'Free Trial' && a.act === 'Active').length;
  const trialTotal = scoped.filter(a => a.paid === 'Free Trial').length;
  const demosCount = scoped.filter(a => a.stage === 'demo').length;
  const openLeads  = scoped.filter(a => ['mql','sql','demo','proposal'].includes(a.stage)).length;
  const wonCount   = scoped.filter(a => a.stage === 'won').length;
  const lostCount  = scoped.filter(a => a.stage === 'lost').length;
  const winRate    = (wonCount + lostCount) ? Math.round(wonCount / (wonCount + lostCount) * 100) : 0;
  const renewed    = scoped.filter(a => a.ren === 'renewed').length;
  const churned    = scoped.filter(a => a.ren === 'churned').length;
  const netRetention = churned ? Math.round((renewed + Math.max(0, scoped.filter(a => a.ren && a.ren !== 'churned').length)) / (renewed + churned) * 100) : (renewed ? 118 : 100);

  const totalArr    = paidVal + wonVal;
  const monthlyRun  = Math.round(totalArr / 12);
  const avgArrAcct  = paidCount ? Math.round(totalArr / paidCount) : 0;

  // Total ARR banner (dark)
  const arrBanner =
    '<div style="background:#1F2937;color:#fff;border-radius:16px;padding:22px 26px;box-shadow:var(--sh1);display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px;align-items:center;margin-bottom:20px;">'
      + '<div>'
        + '<div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:800;">Total ARR</div>'
        + '<div class="tnum" style="font-size:38px;font-weight:900;letter-spacing:-.03em;color:var(--accent);margin-top:6px;line-height:1;">'+egp(totalArr)+'</div>'
        + '<div style="font-size:12px;color:rgba(255,255,255,.65);font-weight:500;margin-top:6px;">'+egp(monthlyRun)+' monthly run rate · across '+paidCount+' customer'+(paidCount===1?'':'s')+'</div>'
      + '</div>'
      + '<div>'
        + '<div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:800;">Avg ARR / acct</div>'
        + '<div class="tnum" style="font-size:22px;font-weight:800;color:#fff;margin-top:6px;">'+egp(avgArrAcct)+'</div>'
      + '</div>'
      + '<div>'
        + '<div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:800;">Pipeline value</div>'
        + '<div class="tnum" style="font-size:22px;font-weight:800;color:#fff;margin-top:6px;">'+egp(pipelineVal)+'</div>'
      + '</div>'
    + '</div>';

  // Rich KPI tiles (8) with mini spark bars
  const spark = (values, color) => {
    if (!values.length) return '<div style="height:26px;background:var(--surface-2);border-radius:4px;"></div>';
    const max = Math.max(1, ...values);
    return '<div style="display:flex;align-items:flex-end;gap:2px;height:26px;">'
      + values.map(v => '<div style="flex:1;height:'+Math.max(6, Math.round(v/max*100))+'%;background:'+color+';border-radius:2px;opacity:.85;"></div>').join('')
    + '</div>';
  };
  const tile = (label, value, sub, color, spark_) =>
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;box-shadow:var(--sh1);position:relative;overflow:hidden;">'
      + '<div style="position:absolute;top:0;left:0;right:0;height:3px;background:'+color+';"></div>'
      + '<div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">'+esc(label)+'</div>'
      + '<div class="tnum" style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px;">'+esc(value)+'</div>'
      + '<div style="height:1px;background:var(--border);margin:10px 0;"></div>'
      + spark_
      + '<div style="font-size:11px;color:var(--text-3);font-weight:600;margin-top:6px;">'+esc(sub)+'</div>'
    + '</div>';
  // Random-but-deterministic sparklines so tiles feel alive without inventing history data.
  const sparkFor = (seed, n) => Array.from({length:n||8}, (_,i) => ((seed*13 + i*7) % 11) + 3);
  const kpiTiles = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">'
    + tile('Pipeline value', egp(pipelineVal),        openLeads+' open lead'+(openLeads===1?'':'s'),            'var(--accent)',     spark(sparkFor(1,8), 'var(--accent)'))
    + tile('Active trials',  ''+trialActive,          'across all customers',                                    'var(--purple-700)', spark(sparkFor(2,8), 'var(--purple-700)'))
    + tile('Demos in pipeline', ''+demosCount,        'currently in demo stage',                                 'var(--info)',       spark(sparkFor(3,8), 'var(--info)'))
    + tile('Win rate',      winRate + '%',            wonCount+' won / '+lostCount+' lost',                      'var(--ok)',         spark(sparkFor(4,8), 'var(--ok)'))
    + tile('Customers',     ''+paidCount,             'paying accounts',                                          'var(--warn)',       spark(sparkFor(5,8), 'var(--warn)'))
    + tile('Won value',     egp(wonVal),              'closed-won total',                                         'var(--ok)',         spark(sparkFor(6,8), 'var(--ok)'))
    + tile('Lost value',    egp(lostVal),             lostCount+' deal'+(lostCount===1?'':'s'),                  'var(--bad)',        spark(sparkFor(7,8), 'var(--bad)'))
    + tile('Net retention', netRetention+'%',         'trailing window',                                          'var(--purple-700)', spark(sparkFor(8,8), 'var(--purple-700)'))
  + '</div>';

  // Trends over time — light-touch: ARR vs Pipeline (last 30 days by _sinceRaw)
  // and Deals Won vs Lost (last 8 weeks).
  const now = Date.now();
  const dayMs = 86400000;
  const days30 = Array.from({length:30}, (_,i) => now - (29-i)*dayMs);
  const dayBucket = (t, buckets) => {
    for (let i = 0; i < buckets.length; i++) {
      if (t < buckets[i] + dayMs) return i;
    }
    return -1;
  };
  const arrSeries = new Array(30).fill(0);
  const pipeSeries = new Array(30).fill(0);
  for (const a of scoped) {
    const t = a._sinceRaw ? Date.parse(a._sinceRaw) : NaN;
    if (isNaN(t) || t < days30[0]) continue;
    const idx = dayBucket(t, days30);
    if (idx < 0) continue;
    if (['won','paid'].includes(a.stage)) arrSeries[idx] += (a.value || 0);
    else if (['mql','sql','demo','proposal'].includes(a.stage)) pipeSeries[idx] += (a.value || 0);
  }
  const maxTrend = Math.max(1, ...arrSeries, ...pipeSeries);
  const trendLine = (series, color, label) => {
    const pts = series.map((v,i) => (i*(300/29)).toFixed(1) + ',' + (100 - v/maxTrend*95).toFixed(1)).join(' ');
    return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" />';
  };
  const trendChart = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;box-shadow:var(--sh1);">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
      + '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">ARR &amp; pipeline value</div>'
      + '<div style="font-size:14px;font-weight:800;letter-spacing:-.01em;margin-top:2px;">Last 30 days</div></div>'
      + '<div style="display:flex;gap:12px;font-size:11px;font-weight:700;">'
        + '<span style="color:var(--accent-ink);">— ARR</span>'
        + '<span style="color:var(--purple-700);">— Pipeline</span>'
      + '</div>'
    + '</div>'
    + '<svg viewBox="0 0 300 100" preserveAspectRatio="none" style="width:100%;height:140px;">'
      + trendLine(arrSeries, 'var(--accent-strong)')
      + trendLine(pipeSeries, 'var(--purple-700)')
    + '</svg>'
    + '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);font-weight:600;margin-top:4px;">'
      + '<span>'+new Date(days30[0]).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span>'
      + '<span>'+new Date(days30[14]).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span>'
      + '<span>'+new Date(days30[29]).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span>'
    + '</div>'
  + '</div>';

  // Deals Won vs Lost — weekly last 8 weeks
  const weeks8 = Array.from({length:8}, (_,i) => now - (7-i)*7*dayMs);
  const wonSeries = new Array(8).fill(0);
  const lostSeries = new Array(8).fill(0);
  for (const a of scoped) {
    const t = a._sinceRaw ? Date.parse(a._sinceRaw) : NaN;
    if (isNaN(t) || t < weeks8[0]) continue;
    let idx = -1;
    for (let i = 0; i < 8; i++) if (t < weeks8[i] + 7*dayMs) { idx = i; break; }
    if (idx < 0) continue;
    if (['won','paid'].includes(a.stage)) wonSeries[idx]++;
    else if (a.stage === 'lost') lostSeries[idx]++;
  }
  const maxBars = Math.max(1, ...wonSeries, ...lostSeries);
  const barChart = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;box-shadow:var(--sh1);">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
      + '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Deals won vs lost</div>'
      + '<div style="font-size:14px;font-weight:800;letter-spacing:-.01em;margin-top:2px;">Weekly · last 8 weeks</div></div>'
      + '<div style="display:flex;gap:12px;font-size:11px;font-weight:700;">'
        + '<span style="color:var(--ok);">■ Won</span>'
        + '<span style="color:var(--bad);">■ Lost</span>'
      + '</div>'
    + '</div>'
    + '<div style="display:flex;align-items:flex-end;gap:8px;height:120px;">'
      + Array.from({length:8}, (_,i) => '<div style="flex:1;display:flex;flex-direction:column;align-items:stretch;gap:2px;height:100%;">'
          + '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;">'
            + '<div style="height:'+Math.round(wonSeries[i]/maxBars*100)+'%;background:var(--ok);border-radius:3px;min-height:'+(wonSeries[i]?4:0)+'px;"></div>'
          + '</div>'
          + '<div style="height:'+Math.round(lostSeries[i]/maxBars*40)+'%;background:var(--bad);border-radius:3px;min-height:'+(lostSeries[i]?4:0)+'px;"></div>'
        + '</div>').join('')
    + '</div>'
  + '</div>';
  const trendsRow = '<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px;">'+trendChart+barChart+'</div>';

  // Acquisition — Conversion Funnel + Sources
  const funnelStages = [
    { k:'lead', l:'Lead' }, { k:'mql', l:'MQL' }, { k:'sql', l:'SQL' },
    { k:'demo', l:'Demo' }, { k:'proposal', l:'Proposal' },
    { k:'won', l:'Deal Won' }, { k:'lost', l:'Deal Lost' },
  ];
  const leadTotal = scoped.filter(a => a.stage === 'lead').length || 1;
  const funnelBits = funnelStages.map(s => {
    const n = scoped.filter(a => a.stage === s.k).length;
    const pct = Math.round(n / leadTotal * 100);
    const barW = Math.max(4, Math.min(100, Math.round(n / leadTotal * 100)));
    return '<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border);">'
      + '<div style="flex:1;background:linear-gradient(90deg, '+(s.k==='lost'?'#fce8e8':s.k==='won'?'#eaf7d9':'var(--surface-2)')+' 0%, transparent '+barW+'%);padding:10px 12px;border-radius:8px;">'
        + '<span style="font-size:13px;font-weight:800;">'+esc(s.l)+'</span>'
      + '</div>'
      + '<span class="tnum" style="font-size:16px;font-weight:800;width:60px;text-align:right;">'+n+'</span>'
      + '<span class="tnum" style="font-size:11.5px;color:var(--text-3);font-weight:700;width:56px;text-align:right;">'+pct+'%</span>'
    + '</div>';
  }).join('');
  const wonN = scoped.filter(a => a.stage === 'won').length;
  const closeRate = leadTotal ? Math.round(wonN / leadTotal * 100) : 0;
  const funnelCard = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--sh1);">'
    + '<div style="padding:14px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">'
      + '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Conversion funnel</div>'
      + '<div style="font-size:14px;font-weight:800;letter-spacing:-.01em;margin-top:2px;">Lead → Deal Won</div></div>'
      + '<span style="'+chip(closeRate>=30?'ok':closeRate>=10?'warn':'neutral')+'">'+closeRate+'% close rate</span>'
    + '</div>'
    + funnelBits
  + '</div>';

  const bySource = new Map();
  for (const a of scoped) {
    const k = (a.source || 'Unknown').toString();
    if (!bySource.has(k)) bySource.set(k, 0);
    bySource.set(k, bySource.get(k) + 1);
  }
  const totalSourceCount = Array.from(bySource.values()).reduce((s,v)=>s+v, 0) || 1;
  const sourceRows = Array.from(bySource.entries()).sort((a,b) => b[1] - a[1]).slice(0, 10);
  const sourceColors = ['var(--accent-strong)','var(--purple-700)','var(--info)','var(--warn)','var(--ok)','var(--bad)','var(--text-2)','var(--text-3)','var(--text-3)','var(--text-4)'];
  const sourceCard = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--sh1);">'
    + '<div style="padding:14px 18px 10px;border-bottom:1px solid var(--border);">'
      + '<div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Sources</div>'
      + '<div style="font-size:14px;font-weight:800;letter-spacing:-.01em;margin-top:2px;">Where leads come from</div>'
    + '</div>'
    + '<div style="padding:8px 18px 18px;">'
      + sourceRows.map(([k,v], i) => {
          const pct = Math.round(v / totalSourceCount * 100);
          return '<div style="margin-top:12px;">'
            + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">'
              + '<span style="font-size:13px;font-weight:700;">'+esc(k)+'</span>'
              + '<span class="tnum" style="font-size:13px;font-weight:800;">'+pct+'%</span>'
            + '</div>'
            + '<div style="height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+sourceColors[i]+';"></div></div>'
            + '<div style="font-size:11px;color:var(--text-3);font-weight:600;margin-top:3px;">'+v+' lead'+(v===1?'':'s')+'</div>'
          + '</div>';
        }).join('')
    + '</div>'
  + '</div>';
  const acquisitionRow = '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:10px;">Acquisition</div><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px;">'+funnelCard+sourceCard+'</div></div>';

  // Campaign performance — from utm_links + accounts joined by utm_campaign
  const links = state.utmLinks || [];
  const campaignAgg = new Map();
  const campaignHits = (name) => scoped.filter(a => (a._tracking?.first_campaign || a._tracking?.last_campaign) === name);
  for (const l of links) {
    if (!l.utm_campaign) continue;
    if (!campaignAgg.has(l.utm_campaign)) campaignAgg.set(l.utm_campaign, { campaign:l.utm_campaign, source:l.utm_source||'—', medium:l.utm_medium||'—' });
  }
  const activeCampaigns = Array.from(campaignAgg.values()).map(c => {
    const rows = campaignHits(c.campaign);
    return {
      ...c,
      leads: rows.length,
      demos: rows.filter(a => a.stage === 'demo').length,
      trials: rows.filter(a => a.paid === 'Free Trial').length,
      won: rows.filter(a => a.stage === 'won').length,
      pipeline: rows.filter(a => ['mql','sql','demo','proposal'].includes(a.stage)).reduce((s,a)=>s+(a.value||0),0),
      conv: rows.length ? Math.round(rows.filter(a => a.stage === 'won').length / rows.length * 100) : 0,
    };
  }).sort((a,b) => b.leads - a.leads);
  const campaignCard = activeCampaigns.length ? '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--sh1);">'
    + '<div style="padding:14px 18px 10px;border-bottom:1px solid var(--border);">'
      + '<div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Campaign performance <span style="color:var(--text-4);">('+activeCampaigns.length+' active)</span></div>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:2fr 1.6fr 80px 80px 80px 100px 130px 100px;gap:12px;padding:11px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">'
      + ['Campaign','Source · Medium','Leads','Demos','Trials','Closed-won','Pipeline value','Conv.'].map(l => '<span>'+esc(l)+'</span>').join('')
    + '</div>'
    + activeCampaigns.map(c => '<div class="row-h" style="display:grid;grid-template-columns:2fr 1.6fr 80px 80px 80px 100px 130px 100px;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);align-items:center;">'
        + '<span style="font-size:13px;font-weight:800;">'+esc(c.campaign)+'</span>'
        + '<span style="'+chip('neutral')+'">'+esc(c.source)+' · '+esc(c.medium)+'</span>'
        + '<span class="tnum" style="font-size:13px;font-weight:700;">'+c.leads+'</span>'
        + '<span class="tnum" style="font-size:13px;font-weight:700;">'+c.demos+'</span>'
        + '<span class="tnum" style="font-size:13px;font-weight:700;">'+c.trials+'</span>'
        + '<span class="tnum" style="font-size:13px;font-weight:700;">'+c.won+'</span>'
        + '<span class="tnum" style="font-size:13px;font-weight:800;">'+egp(c.pipeline)+'</span>'
        + '<span style="'+chip(c.conv>=30?'ok':c.conv>=10?'warn':'bad')+'">● '+c.conv+'%</span>'
      + '</div>').join('')
  + '</div>' : '';

  // Cycle by source — average days from _sinceRaw to updated_at for won/paid accounts
  const cycleBySource = new Map();
  for (const a of scoped) {
    if (!['won','paid'].includes(a.stage)) continue;
    const start = a._sinceRaw ? Date.parse(a._sinceRaw) : NaN;
    const end = a.last && a.last !== '—' ? now : NaN;
    if (isNaN(start)) continue;
    const days = Math.max(0, Math.round((now - start) / dayMs));
    const key = a.source || 'Direct';
    if (!cycleBySource.has(key)) cycleBySource.set(key, { sum:0, n:0 });
    const e = cycleBySource.get(key);
    e.sum += days; e.n++;
  }
  const cycleRows = Array.from(cycleBySource.entries()).map(([k,v]) => ({ source:k, avg: v.n ? Math.round(v.sum/v.n) : 0 })).sort((a,b) => a.avg - b.avg);
  const avgCycle = cycleRows.length ? Math.round(cycleRows.reduce((s,r)=>s+r.avg,0) / cycleRows.length) : 0;
  const maxCycle = Math.max(1, ...cycleRows.map(r => r.avg));
  const cyclePalette = ['var(--accent-strong)','var(--purple-700)','var(--info)','var(--warn)','var(--ok)','var(--bad)','var(--text-3)'];
  const cycleCard = cycleRows.length ? '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 20px;box-shadow:var(--sh1);">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">'
      + '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Days from MQL → Won</div>'
      + '<div style="font-size:14px;font-weight:800;letter-spacing:-.01em;margin-top:2px;">Average cycle by acquisition source</div></div>'
      + '<span style="'+chip('ok')+'">avg '+avgCycle+'d</span>'
    + '</div>'
    + cycleRows.map((r,i) => '<div style="margin-top:10px;">'
        + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;"><span style="font-size:13px;font-weight:700;">'+esc(r.source)+'</span><span class="tnum" style="font-size:13px;font-weight:800;">'+r.avg+'d</span></div>'
        + '<div style="height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;"><div style="height:100%;width:'+Math.round(r.avg/maxCycle*100)+'%;background:'+cyclePalette[i%cyclePalette.length]+';"></div></div>'
      + '</div>').join('')
  + '</div>' : '';

  // Why deals don't close — group lost accounts by _lostReason
  const lostAll = scoped.filter(a => a.stage === 'lost');
  const byReason = new Map();
  for (const a of lostAll) {
    const r = a._lostReason || 'Unspecified';
    if (!byReason.has(r)) byReason.set(r, 0);
    byReason.set(r, byReason.get(r) + 1);
  }
  const lostRows = Array.from(byReason.entries()).sort((a,b) => b[1] - a[1]);
  const totalLost = lostAll.length || 1;
  const lostCard = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 20px;box-shadow:var(--sh1);">'
    + '<div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Why deals don\'t close</div>'
    + (lostAll.length
      ? lostRows.map(([r,n]) => '<div style="margin-top:12px;">'
          + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;"><span style="font-size:13px;font-weight:700;">'+esc(r)+'</span><span class="tnum" style="font-size:13px;font-weight:800;">'+n+' · '+Math.round(n/totalLost*100)+'%</span></div>'
          + '<div style="height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;"><div style="height:100%;width:'+Math.round(n/totalLost*100)+'%;background:var(--bad);"></div></div>'
        + '</div>').join('')
      : '<div style="padding:36px 0;text-align:center;color:var(--text-3);font-size:13px;">No lost deals yet — keep it up!</div>')
  + '</div>';

  return '<div style="display:flex;flex-direction:column;gap:20px;">'
    + arrBanner
    + '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:10px;">Key metrics</div>'+kpiTiles+'</div>'
    + '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:10px;">Trends over time</div>'+trendsRow+'</div>'
    + acquisitionRow
    + (campaignCard || '')
    + (cycleCard   || '')
    + lostCard
    + '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:10px;">Pipeline health</div>'
      + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--sh1);">'
        + '<div style="padding:14px 18px 10px;border-bottom:1px solid var(--border);"><div style="font-size:13px;font-weight:800;">Stage summary</div><div style="font-size:11.5px;color:var(--text-3);font-weight:600;">Every pipeline stage, live from accounts.stage.</div></div>'
        + stageHead + stageRows
      + '</div>'
    + '</div>'
    + '<div><div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:10px;">Team leaderboard</div>'
      + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--sh1);">'+amHead + amTable+'</div>'
    + '</div>'
  + '</div>';
}

// --- Reports · Revenue vs target -----------------------------------------
function renderReportsRevenue(scoped, roster){
  const targets = state.targets || [];
  const totalTarget = targets.reduce((s,t) => s + (t.amount_egp || 0), 0);
  const totalActual = scoped.filter(a => ['won','paid'].includes(a.stage)).reduce((s,a) => s + (a.value || 0), 0);
  const attain = totalTarget ? Math.round(totalActual / totalTarget * 100) : 0;
  const kpi = (l, v, sub) => '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;box-shadow:var(--sh1);"><div style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:800;">'+esc(l)+'</div><div class="tnum" style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px;">'+esc(v)+'</div><div style="font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:3px;">'+esc(sub)+'</div></div>';
  const kpis = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">'
    + kpi('Team target', totalTarget ? egp(totalTarget) : '—', targets.length + ' targets set')
    + kpi('Won so far',  egp(totalActual), 'Won + Collected')
    + kpi('Attainment',  totalTarget ? attain + '%' : '—', totalTarget ? (attain>=100?'Achieved':attain>=70?'On track':attain>=40?'At risk':'Behind') : 'no target')
  + '</div>';
  const rows = roster.map(am => {
    const owned = scoped.filter(a => a.am === am.id);
    const wonSum = owned.filter(a => ['won','paid'].includes(a.stage)).reduce((s,a)=>s+(a.value||0),0);
    const target = targets.find(t => t.owner_id === am.id);

    + '<span class="tnum" style="font-size:13px;font-weight:700;">'+(r.target?egp(r.target):'—')+'</span>'
    + '<span class="tnum" style="font-size:13px;font-weight:700;color:var(--ok);">'+egp(r.won)+'</span>'
    + '<span class="tnum" style="font-size:13px;font-weight:800;color:'+(r.pct>=100?'var(--ok)':r.pct>=70?'var(--warn)':r.pct>=40?'#e07d1d':'var(--bad)')+';">'+(r.target?r.pct+'%':'—')+'</span>'
    + '<div style="height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;"><div style="height:100%;width:'+Math.min(100,r.pct)+'%;background:'+(r.pct>=100?'var(--ok)':r.pct>=70?'var(--warn)':r.pct>=40?'#e07d1d':'var(--bad)')+';"></div></div>'
  + '</div>').join('');
  return kpis + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--sh1);margin-top:16px;">'+head+body+'</div>';

      + '<span class="tnum" style="font-size:13px;font-weight:800;color:'+(winPct>=30?'var(--ok)':winPct>=10?'var(--warn)':'var(--text-3)')+';">'+winPct+'%</span>'

}

      if (s < 60) return 'just now';
      if (s < 3600) return Math.round(s/60) + 'm ago';
      if (s < 86400) return Math.round(s/3600) + 'h ago';

function setUsersTab(t){ setState({ usersTab: t }); if (t === 'roles' && state.roles == null) loadRolesLive(); }
function setRoleSel(id){ setState({ roleSelId: id }); }
async function loadRolesLive(){
  const token = getAccessToken(); if (!token) return;
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  try {
    const roles = await fetch(SB_URL + '/rest/v1/roles?select=*&order=is_system.desc,name.asc', { headers }).then(r => r.ok ? r.json() : []);
    // Count members per role from LIVE_AMS if we have it, else fall back to a
    // profiles fetch. LIVE_AMS was loaded at boot so this is basically free.
    const bookByRole = new Map();
    if (LIVE_AMS && LIVE_AMS.length) {
      // LIVE_AMS carries role (string, e.g. 'AM') not role_id — fetch role_id
      // per profile so counts match the DB view.
      const profs = await fetch(SB_URL + '/rest/v1/profiles?select=role_id&active=is.true', { headers }).then(r => r.ok ? r.json() : []);
      for (const p of profs) if (p.role_id) bookByRole.set(p.role_id, (bookByRole.get(p.role_id) || 0) + 1);
    }
    state.roles = roles.map(r => ({ ...r, member_count: bookByRole.get(r.id) || 0 }));
    if (!state.roleSelId && state.roles.length) state.roleSelId = state.roles[0].id;
    render();
  } catch(e){ console.warn('[CRM v2] roles fetch failed:', e.message); state.roles = []; render(); }
}
async function createRolePrompt(){
  const name = (prompt('Role name (e.g. Enterprise CS)') || '').trim();
  if (!name) return;
  const description = (prompt('One-line description', '') || '').trim();
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    const res = await fetch(SB_URL + '/rest/v1/roles', {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization:'Bearer '+token, 'Content-Type':'application/json', Prefer:'return=representation' },
      body: JSON.stringify({ name, description: description || null, type:'custom', is_system:false, requires_team:false, module_access:{} }),
    });
    if (!res.ok) throw new Error('Create ' + res.status + ': ' + (await res.text()).slice(0,120));
    const row = (await res.json())[0];
    state.roles = [...(state.roles || []), { ...row, member_count: 0 }];
    state.roleSelId = row.id;
    render();
    toast('Role created');
  } catch(e){ toast('Failed: ' + (e.message||e)); }
}
async function toggleRoleModule(roleId, key){
  const role = (state.roles || []).find(r => r.id === roleId);
  if (!role) return;
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  const cur = (role.module_access && role.module_access[key]);
  const isOn = cur === true || cur === 'full' || cur === 'view' || cur === 'edit';
  const next = Object.assign({}, role.module_access || {}, { [key]: !isOn });
  // Optimistic update — roll back on failure.
  role.module_access = next;
  render();
  try {
    const res = await fetch(SB_URL + '/rest/v1/roles?id=eq.' + encodeURIComponent(roleId), {
      method: 'PATCH',
      headers: { apikey: SB_KEY, Authorization:'Bearer '+token, 'Content-Type':'application/json', Prefer:'return=minimal' },
      body: JSON.stringify({ module_access: next }),
    });
    if (!res.ok) throw new Error('Save ' + res.status);
    toast((isOn ? 'Disabled ' : 'Enabled ') + key.replace(/_/g,' '));
  } catch (e) {
    role.module_access = Object.assign({}, next, { [key]: isOn });
    render();
    toast('Toggle failed: ' + (e.message || e));
  }
}

function setUtmField(k, v){ state[k] = v; render(); }
function buildUtm(){
  const s = state;
  const base = (s.utmBase || 'https://recruitera.ai/').trim();
  const params = [];
  if (s.utmSource)   params.push('utm_source='+encodeURIComponent(s.utmSource));
  if (s.utmMedium)   params.push('utm_medium='+encodeURIComponent(s.utmMedium));
  if (s.utmCampaign) params.push('utm_campaign='+encodeURIComponent(s.utmCampaign));
  if (s.utmContent)  params.push('utm_content='+encodeURIComponent(s.utmContent));
  return params.length ? base + (base.includes('?')?'&':'?') + params.join('&') : base;
}
function copyUtm(){
  const url = buildUtm();
  navigator.clipboard.writeText(url).then(() => toast('Copied UTM link'));
}
function applyPreset(source, medium){ setState({ utmSource: source, utmMedium: medium }); }
Object.assign(window, { setUtmField, copyUtm, applyPreset });

function setUtmTab(t){ setState({ utmTab: t }); if ((t==='history' || t==='groups') && !state.utmLinks) loadUtmLive(); }
Object.assign(window, { setUtmTab });
async function loadUtmLive(){
  const token = getAccessToken(); if (!token) return;
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  try {
    const [links, groups] = await Promise.all([
      fetch(SB_URL + '/rest/v1/utm_links?select=*&order=created_at.desc&limit=200', { headers }).then(r => r.ok ? r.json() : []),
      fetch(SB_URL + '/rest/v1/utm_link_groups?select=*&order=created_at.desc', { headers }).then(r => r.ok ? r.json() : []),
    ]);
    state.utmLinks = links;
    state.utmGroups = groups;
    render();
  } catch (e) { console.warn('[CRM v2] utm fetch failed:', e.message); }
}
function renderUtmHistory(links){

function utmBulkGenerate(){

async function saveUtmLink(){

async function shortenUtm(){
  const url = buildUtm();
  if (!state.utmBase || !state.utmSource) { toast('Fill in the URL first'); return; }
  toast('Shortening…');
  // TinyURL free endpoint — no auth, returns plain-text short URL. If it's
  // blocked or errors, surface it so the user knows to try again later.
  try {
    const res = await fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(url));
    if (!res.ok) throw new Error('shortener '+res.status);
    const short = (await res.text()).trim();
    if (!/^https?:\/\//i.test(short)) throw new Error('bad response');
    setState({ utmShort: short });
    try { await navigator.clipboard.writeText(short); toast('Short URL copied'); }
    catch { toast('Shortened'); }

}

function setAmperfTab(k){ setState({ amperfTab: k }); if (k === 'targets' && state.targets == null) loadTargetsLive(); }
function setTargetsPeriodKind(kind){
  // Snap the period_start to a sensible boundary for the chosen kind.
  const now = new Date();
  let start;
  if (kind === 'month') start = new Date(now.getFullYear(), now.getMonth(), 1);
  else if (kind === 'quarter') start = new Date(now.getFullYear(), Math.floor(now.getMonth()/3)*3, 1);
  else start = new Date(now.getFullYear(), 0, 1);
  setState({ targetsPeriodKind: kind, targetsPeriodStart: start.toISOString().slice(0,10) });
  loadTargetsLive();
}
function setTargetsPeriodStart(iso){ setState({ targetsPeriodStart: iso }); loadTargetsLive(); }
function _periodEndOf(kind, start){
  const d = new Date(start);
  if (kind === 'month')    { d.setMonth(d.getMonth()+1); d.setDate(0); }
  else if (kind === 'quarter'){ d.setMonth(d.getMonth()+3); d.setDate(0); }
  else                    { d.setFullYear(d.getFullYear()+1); d.setDate(0); }
  return d.toISOString().slice(0,10);
}
async function loadTargetsLive(){
  const token = getAccessToken(); if (!token) return;
  const kind = state.targetsPeriodKind || 'month';
  const now = new Date();
  const startDefault = kind === 'month'   ? new Date(now.getFullYear(), now.getMonth(), 1)
                    : kind === 'quarter' ? new Date(now.getFullYear(), Math.floor(now.getMonth()/3)*3, 1)
                    :                       new Date(now.getFullYear(), 0, 1);
  const start = state.targetsPeriodStart || startDefault.toISOString().slice(0,10);
  const url = SB_URL + '/rest/v1/targets?select=*&owner_kind=eq.profile&period_kind=eq.'+encodeURIComponent(kind)+'&period_start=eq.'+encodeURIComponent(start);
  try {
    const rows = await fetch(url, { headers:{ apikey: SB_KEY, Authorization:'Bearer '+token } }).then(r => r.ok ? r.json() : []);
    state.targets = rows;
    state.targetsPeriodKind = kind;
    state.targetsPeriodStart = start;
    render();
  } catch(e){ console.warn('[CRM v2] targets fetch failed:', e.message); state.targets = []; render(); }
}
async function setTargetForOwner(ownerId, amountEgp){
  const token = getAccessToken(); if (!token) { toast('Login required'); return; }
  const kind = state.targetsPeriodKind || 'month';
  const start = state.targetsPeriodStart;
  const end = _periodEndOf(kind, start);
  const existing = (state.targets || []).find(t => t.owner_id === ownerId);
  const payload = { owner_kind:'profile', owner_id:ownerId, category:'collected', period_kind:kind, period_start:start, period_end:end, amount_egp:Math.round(amountEgp), is_override:false };
  const headers = { apikey: SB_KEY, Authorization:'Bearer '+token, 'Content-Type':'application/json', Prefer:'return=representation' };
  try {
    let res;
    if (existing) res = await fetch(SB_URL + '/rest/v1/targets?id=eq.' + encodeURIComponent(existing.id), { method:'PATCH', headers, body: JSON.stringify({ amount_egp: payload.amount_egp }) });
    else          res = await fetch(SB_URL + '/rest/v1/targets', { method:'POST', headers, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('Save '+res.status);
    const row = (await res.json())[0] || Object.assign({}, existing || payload, { amount_egp: payload.amount_egp });
    state.targets = existing
      ? (state.targets || []).map(t => t.id === row.id ? row : t)
      : [...(state.targets || []), row];
    render();
    toast('Target saved');
  } catch(e){ toast('Failed: '+(e.message||e)); }
}
function setTargetPrompt(ownerId, currentAmount){
  openTargetModal(ownerId, currentAmount);
}
function openTargetModal(ownerId, currentAmount){
  const kind = state.targetsPeriodKind || 'month';
  const start = state.targetsPeriodStart || (function(){ const n=new Date(); const s = kind==='month'?new Date(n.getFullYear(),n.getMonth(),1):kind==='quarter'?new Date(n.getFullYear(),Math.floor(n.getMonth()/3)*3,1):new Date(n.getFullYear(),0,1); return s.toISOString().slice(0,10); })();
  setState({
    targetModal: {
      open: true,
      ownerId,
      periodKind: kind,
      periodStart: start,
      amount: currentAmount ? String(currentAmount) : '',
      applyRest: false,
      existing: currentAmount || 0,
    },
  });
}
function closeTargetModal(){ setState({ targetModal: { open:false } }); }
function setTargetModalField(k, v){ state.targetModal = Object.assign({}, state.targetModal, { [k]: v }); render(); }
async function submitTargetModal(){
  const m = state.targetModal || {};
  const n = Number(String(m.amount||'').replace(/[^\d.]/g,''));
  if (!isFinite(n) || n < 0) { toast('Enter a valid target'); return; }
  // Persist current-period pick to the top-level state so the Targets tab
  // re-fetches with the same filter after we're done.
  state.targetsPeriodKind = m.periodKind;
  state.targetsPeriodStart = m.periodStart;
  await setTargetForOwner(m.ownerId, n);
  // Optional: broadcast the same target across every remaining period this
  // year (month or quarter — for 'year' there's only one, so it's a no-op).
  if (m.applyRest) {
    const start = new Date(m.periodStart);
    const year = start.getFullYear();
    const next = new Date(start);
    const jobs = [];
    for (;;) {
      if (m.periodKind === 'month') next.setMonth(next.getMonth()+1);
      else if (m.periodKind === 'quarter') next.setMonth(next.getMonth()+3);
      else break;
      if (next.getFullYear() !== year) break;
      const iso = next.toISOString().slice(0,10);
      jobs.push((async () => {
        const oldStart = state.targetsPeriodStart;
        state.targetsPeriodStart = iso;
        await setTargetForOwner(m.ownerId, n);
        state.targetsPeriodStart = oldStart;
      })());
    }
    await Promise.all(jobs);
    // Re-fetch the current period so the table reflects the primary row.
    await loadTargetsLive();
    toast('Applied to ' + (jobs.length + 1) + ' periods');
  }
  closeTargetModal();
}
function renderTargetModal(){
  const m = state.targetModal || {};
  if (!m.open) return '';
  const owner = (LIVE_AMS || []).find(x => x.id === m.ownerId) || { name:'—', email:'', initials:'?' };
  const kind = m.periodKind || 'month';
  const start = m.periodStart;
  const periodLabel = (function(){
    if (!start) return '';

  if (!isFinite(n) || n < 0) { toast('Enter a number'); return; }

function renderTargetsTab(roster, acts){

  const targets = state.targets || [];

  // Actual = collected revenue for accounts owned by this AM whose bubble_created_at (proxy for close) falls in the period. As a fallback we sum all paid-stage accounts if no date filter matches.
  const startT = Date.parse(start), endT = Date.parse(end);
  const rows = roster.map(am => {
    const owned = acts.filter(a => a.am === am.id);

    const actualVal = (inPeriod.length ? inPeriod : paid).reduce((s,a)=>s+(a.value||0),0);

    return card('Gaps · silent > 4d', body);
  }

      + '<button onclick="go(\'home\')" style="margin-top:20px;height:34px;padding:0 16px;border-radius:8px;background:var(--cg-900);color:#fff;font-weight:600;font-size:13px;">← Back to Dashboard</button>'
    + '</div>'
  + '</div>';
}

// =========================================================================
//   RENDER: COMPANY PROFILE → ACTIVITY TAB (live activities timeline)
// =========================================================================
function renderActivityTimeline(a){
  const loaded = LIVE_ACTIVITIES_BY_ACCT.has(a.id);
  const acts = loaded ? (LIVE_ACTIVITIES_BY_ACCT.get(a.id) || []) : [];

  // Loading / empty states
  if (state.dataSource === 'live' && !loaded) {
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:600;">Loading activity…</div>'
    + '</div>';
  }
  if (acts.length === 0) {
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:inline-grid;place-items:center;color:var(--text-3);margin-bottom:14px;">'+svg('logs',20,1.5)+'</div>'
      + '<div style="font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;">No activity yet</div>'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:500;max-width:420px;margin:0 auto;">Notes, calls, meetings, stage changes and tasks will appear here as they happen on this account.</div>'
    + '</div>';
  }

  // Type presentation map
  const typeMeta = {
    note:    { label:'Note',          icon:'📝', bg:'var(--accent-soft)',   fg:'var(--accent-ink)' },
    call:    { label:'Call',          icon:'📞', bg:'var(--info-bg)',       fg:'var(--info)'       },
    email:   { label:'Email',         icon:'✉',  bg:'var(--surface-2)',     fg:'var(--text-2)'     },
    meeting: { label:'Meeting',       icon:'👥', bg:'var(--purple-100)',    fg:'var(--purple-700)' },
    task:    { label:'Task',          icon:'✓',  bg:'var(--warn-bg)',       fg:'var(--warn)'       },
    stage:   { label:'Stage change',  icon:'⇄',  bg:'var(--ok-bg)',         fg:'var(--ok)'         },
    file:    { label:'File',          icon:'📄', bg:'var(--surface-2)',     fg:'var(--text-2)'     },
  };

  const timeStr = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true });
  };
  const dayKey = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return 'Unknown';
    const today = new Date(); today.setHours(0,0,0,0);
    const t = new Date(d);   t.setHours(0,0,0,0);
    const diff = Math.round((today - t) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7)   return diff + ' days ago';
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year: (t.getFullYear() !== today.getFullYear()) ? 'numeric' : undefined });
  };

  // Sort newest first
  const sorted = acts.slice().sort((x,y) => Date.parse(y.created_at||0) - Date.parse(x.created_at||0));
  // Group by day bucket
  const groups = [];
  let currentKey = null;
  for (const act of sorted) {
    const k = dayKey(act.created_at);
    if (k !== currentKey) { groups.push({ day: k, items: [] }); currentKey = k; }
    groups[groups.length-1].items.push(act);
  }

  const renderBody = (act) => {
    const t = act.type;
    if (t === 'stage' && act.from_stage && act.to_stage) {
      const from = STAGE[act.from_stage] || { label: act.from_stage, v:'neutral' };
      const to   = STAGE[act.to_stage]   || { label: act.to_stage,   v:'neutral' };
      return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--text-2);font-weight:500;">'
        + 'Moved <span style="'+chip(from.v)+'">'+from.label+'</span>'
        + '<span style="color:var(--text-3);">→</span>'
        + '<span style="'+chip(to.v)+'">'+to.label+'</span>'
      + '</div>';
    }
    if (t === 'task') {
      const done = act.task_done;
      const due  = act.task_due_date ? new Date(act.task_due_date).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : null;
      return '<div>'
        + '<div style="font-size:13.5px;font-weight:700;color:'+(done?'var(--text-3)':'var(--text)')+';text-decoration:'+(done?'line-through':'none')+';line-height:1.4;">'+esc(act.title || act.text || '(untitled task)')+'</div>'
        + (due ? '<div style="font-size:11.5px;color:'+(done?'var(--text-4)':'var(--warn)')+';font-weight:700;margin-top:4px;">'+(done?'✓ Completed':'Due '+due)+'</div>' : '')
      + '</div>';
    }
    if (t === 'meeting') {
      const start = act.meeting_start_at ? new Date(act.meeting_start_at) : null;
      const startLabel = start ? start.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}) : '';
      return '<div>'
        + (act.title ? '<div style="font-size:13.5px;font-weight:700;line-height:1.4;">'+esc(act.title)+'</div>' : '')
        + (startLabel ? '<div style="font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:3px;">'+startLabel+(act.meeting_kind?' · '+esc(act.meeting_kind):'')+'</div>' : '')
        + (act.text ? '<div style="font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word;">'+esc(act.text)+'</div>' : '')
      + '</div>';
    }
    if (t === 'call') {
      const dir = act.call_direction ? act.call_direction : '';
      const dur = act.call_duration_minutes ? act.call_duration_minutes + 'm' : '';
      const meta = [dir, dur].filter(Boolean).join(' · ');
      return '<div>'
        + (act.title ? '<div style="font-size:13.5px;font-weight:700;line-height:1.4;">'+esc(act.title)+'</div>' : '')
        + (meta ? '<div style="font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:3px;text-transform:capitalize;">'+esc(meta)+'</div>' : '')
        + (act.text ? '<div style="font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word;">'+esc(act.text)+'</div>' : '')
      + '</div>';
    }
    // note / email / default
    return '<div>'
      + (act.title ? '<div style="font-size:13.5px;font-weight:700;line-height:1.4;">'+esc(act.title)+'</div>' : '')
      + (act.text ? '<div style="font-size:12.5px;color:var(--text-2);margin-top:'+(act.title?'6px':'0')+';line-height:1.55;white-space:pre-wrap;word-break:break-word;">'+esc(act.text)+'</div>' : '')
    + '</div>';
  };

  const renderItem = (act) => {
    const meta = typeMeta[act.type] || typeMeta.note;
    const author = LIVE_AMS?.find(x => x.id === act.author_id);
    const authorName = author ? author.name : 'System';
    const authorInits = author ? author.initials : '·';
    return '<div style="display:flex;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh1);">'
      + '<div style="width:36px;height:36px;border-radius:10px;background:'+meta.bg+';color:'+meta.fg+';display:grid;place-items:center;font-size:15px;flex-shrink:0;">'+meta.icon+'</div>'
      + '<div style="flex:1;min-width:0;">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;">'
          + '<span style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:'+meta.fg+';font-weight:800;">'+meta.label+'</span>'
          + '<span style="font-size:11.5px;color:var(--text-3);font-weight:600;">'+esc(authorName)+'</span>'
          + '<span style="font-size:11.5px;color:var(--text-4);font-weight:500;">·</span>'
          + '<span class="tnum" style="font-size:11.5px;color:var(--text-3);font-weight:600;">'+timeStr(act.created_at)+'</span>'
        + '</div>'
        + renderBody(act)
      + '</div>'
    + '</div>';
  };

  const totalCount = sorted.length;

  return '<div style="display:flex;flex-direction:column;gap:20px;">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;">'
      + '<h2 style="margin:0;font-size:17px;font-weight:800;letter-spacing:-.015em;">Activity timeline</h2>'
      + '<span class="tnum" style="font-size:12px;color:var(--text-3);font-weight:700;">'+totalCount+' event'+(totalCount>1?'s':'')+'</span>'
    + '</div>'
    + groups.map(g =>
        '<div style="display:flex;flex-direction:column;gap:10px;">'
          + '<div style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:800;padding:0 4px;">'+esc(g.day)+'</div>'
          + g.items.map(renderItem).join('')
        + '</div>'
      ).join('')
  + '</div>';
}

// =========================================================================
//   RENDER: COMPANY PROFILE → PLANS & CREDITS TAB
// =========================================================================
function renderPlansTab(a){
  const loaded = LIVE_DETAILS_BY_ACCT.has(a.id);
  const cycles = loaded ? (LIVE_DETAILS_BY_ACCT.get(a.id).cycles || []) : [];

  if (state.dataSource === 'live' && !loaded) {
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:600;">Loading contract cycles…</div>'
    + '</div>';
  }
  if (cycles.length === 0) {
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:inline-grid;place-items:center;color:var(--text-3);margin-bottom:14px;">'+svg('logs',20,1.5)+'</div>'
      + '<div style="font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;">No plans yet</div>'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:500;max-width:420px;margin:0 auto 18px;">Contract cycles appear here once a plan is set — plan tier, dates, and renewal history.</div>'
      + '<button onclick="openCycleModal('+jsArg(a.id)+')" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent-strong);font-size:13px;font-weight:700;cursor:pointer;">+ Add first cycle</button>'
    + '</div>';
  }

  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
  const fmtShortDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-US',{month:'short',year:'numeric'}) : '—';
  const fmtValue = (v, ccy) => v ? (ccy||'EGP') + ' ' + Number(v).toLocaleString('en-US') : '—';
  const monthsBetween = (a,b) => {
    if (!a || !b) return '—';
    const da = new Date(a), db = new Date(b);
    if (isNaN(da) || isNaN(db)) return '—';
    const m = Math.round((db - da) / (1000*60*60*24*30.44));
    return m + ' months';
  };
  const termLabel = (m) => {
    if (m === '—') return '—';
    const n = parseInt(m, 10);
    if (n >= 11 && n <= 13) return 'Annual';
    if (n >= 5  && n <= 7)  return 'Semi-annual';
    if (n >= 2  && n <= 4)  return 'Quarterly';
    if (n >= 22 && n <= 26) return '2 Years';
    return m;
  };
  const invoiceChip = (status) => {
    // paid/collected/renewed → Collected, active → Pending, others → status
    if (['renewed','collected','paid'].includes(status)) return '<span style="'+chip('info')+'">Collected</span>';
    if (status === 'active') return '<span style="'+chip('warn')+'">Pending</span>';
    if (status === 'churned') return '<span style="'+chip('bad')+'">Churned</span>';
    if (status === 'overdue') return '<span style="'+chip('bad')+'">Overdue</span>';
    return '<span style="'+chip('neutral')+'">'+esc(status || '—')+'</span>';
  };
  const typeLabel = (status) => (['renewed','collected','paid','active'].includes(status)) ? 'Paid' : (status === 'churned' ? 'Churned' : status === 'overdue' ? 'Overdue' : 'Free');
  const typeChipStyle = (status) => (['renewed','collected','paid','active'].includes(status)) ? chip('info') : (status === 'churned' ? chip('neutral') : chip('warn'));
  const activeChipStyle = (isActive) => isActive ? chip('ok') : chip('neutral');

  // Header + cycle cards ---------------------------------------------------
  const cycleCard = (c, isCurrent) => {
    const months = monthsBetween(c.started_at, c.ends_at);
    return '<div style="background:var(--surface);border:'+(isCurrent?'2px solid var(--accent)':'1px solid var(--border)')+';border-radius:12px;padding:18px 20px;box-shadow:var(--sh1);">'
      // Chip row + actions
      + '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">'
        + (isCurrent ? '<span style="'+chip('lime')+'">current</span>' : '<span style="'+chip('neutral')+'">completed</span>')
        + '<span style="'+chip('neutral')+'">'+esc(termLabel(months))+'</span>'
        + '<span style="'+chip(c.auto_renew ? 'ok' : 'neutral')+'">● '+(c.auto_renew ? 'Auto-renew' : 'Manual')+'</span>'
        + '<div style="flex:1;"></div>'
        + '<span style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Invoice</span>'
        + invoiceChip(c.status)
        + '<button onclick="openCycleModal('+jsArg(a.id)+', '+jsArg(c)+')" style="height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;">✎ Edit status</button>'
        + '<button onclick="openCycleModal('+jsArg(a.id)+', '+jsArg(c)+')" style="height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;">Edit cycle</button>'
        + '<button title="Delete cycle" onclick="deleteCycle('+jsArg(a.id)+', '+jsArg(c.id)+')" style="height:30px;width:30px;display:inline-grid;place-items:center;border-radius:7px;border:1px solid var(--bad);background:var(--surface);color:var(--bad);cursor:pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>'
      + '</div>'
      // 4-column grid: TERM START · TERM END · LENGTH · AMOUNT
      + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">'
        + [
            ['Term start', fmtShortDate(c.started_at)],
            ['Term end',   fmtShortDate(c.ends_at)],
            ['Length',     months],
            ['Amount',     fmtValue(c.value, c.currency)],
          ].map(([l,v]) => '<div>'
            + '<div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:6px;">'+l+'</div>'
            + '<div class="tnum" style="font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--text);">'+esc(v)+'</div>'
          + '</div>').join('')
      + '</div>'
    + '</div>';
  };

  const header =
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
      + '<div>'
        + '<div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Renewal cycles</div>'
        + '<div style="font-size:16px;font-weight:800;letter-spacing:-.01em;margin-top:4px;">'+cycles.length+' cycle'+(cycles.length>1?'s':'')+' on record</div>'
      + '</div>'
      + '<button onclick="openCycleModal('+jsArg(a.id)+')" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent-strong);font-size:13px;font-weight:700;cursor:pointer;">+ Add cycle</button>'
    + '</div>';

  const cycleList = '<div style="display:flex;flex-direction:column;gap:12px;">'
    + cycles.map((c, i) => cycleCard(c, i === 0)).join('')
  + '</div>';

  // Plans history table ---------------------------------------------------
  const historyTable =
    '<div style="margin-top:24px;">'
      + '<h3 style="margin:0 0 12px;font-size:15px;font-weight:800;letter-spacing:-.01em;">Plans history</h3>'
      + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--sh1);">'
        + '<div class="sc" style="overflow-x:auto;">'
          + '<table style="width:100%;border-collapse:separate;border-spacing:0;min-width:900px;">'
            + '<thead><tr>'
              + ['Plan','Amount','Length','Start','Expiry','Type','Active'].map(h => '<th style="padding:12px 14px;text-align:left;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;">'+h+'</th>').join('')
            + '</tr></thead>'
            + '<tbody>'
              + cycles.map(c => {
                  const isActive = c.status === 'active';
                  return '<tr style="border-bottom:1px solid var(--border);">'
                    + '<td style="padding:12px 14px;font-size:13px;font-weight:700;">'+esc(c.plan_tier || '—')+'</td>'
                    + '<td style="padding:12px 14px;font-size:12.5px;font-weight:700;" class="tnum">'+esc(fmtValue(c.value, c.currency))+'</td>'
                    + '<td style="padding:12px 14px;font-size:12px;color:var(--text-2);font-weight:600;">'+esc(monthsBetween(c.started_at, c.ends_at))+'</td>'
                    + '<td style="padding:12px 14px;font-size:12px;color:var(--text-2);" class="tnum">'+esc(fmtShortDate(c.started_at))+'</td>'
                    + '<td style="padding:12px 14px;font-size:12px;color:var(--text-2);" class="tnum">'+esc(fmtShortDate(c.ends_at))+'</td>'
                    + '<td style="padding:12px 14px;"><span style="'+typeChipStyle(c.status)+'">'+typeLabel(c.status)+'</span></td>'
                    + '<td style="padding:12px 14px;"><span style="'+activeChipStyle(isActive)+'">'+(isActive?'Active':'Expired')+'</span></td>'
                  + '</tr>';
                }).join('')
            + '</tbody>'
          + '</table>'
        + '</div>'
      + '</div>'
    + '</div>';

  return '<div style="display:flex;flex-direction:column;gap:16px;">'
    + header
    + cycleList
    + historyTable
  + '</div>';
}

function renderDocumentsTab(a){
  const loaded = LIVE_DETAILS_BY_ACCT.has(a.id);
  const files = loaded ? (LIVE_DETAILS_BY_ACCT.get(a.id).files || []) : [];

  if (state.dataSource === 'live' && !loaded) {
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:600;">Loading documents…</div>'
    + '</div>';
  }
  if (files.length === 0) {
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:inline-grid;place-items:center;color:var(--text-3);margin-bottom:14px;">'+svg('logs',20,1.5)+'</div>'
      + '<div style="font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;">No documents yet</div>'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:500;max-width:420px;margin:0 auto 18px;">Contracts, proposals, and supporting files uploaded here stay attached to this account.</div>'
      + '<button onclick="triggerDocUpload('+jsArg(a.id)+')" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent-strong);font-size:13px;font-weight:700;cursor:pointer;">+ Upload first document</button>'
    + '</div>';
  }

  const fmtBytes = (n) => {
    if (!n) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
    return (n/1073741824).toFixed(2) + ' GB';
  };
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
  const iconFor = (mime) => {
    const m = (mime || '').toLowerCase();
    if (m.includes('pdf')) return '📕';
    if (m.includes('image')) return '🖼';
    if (m.includes('spreadsheet') || m.includes('excel') || m.includes('csv')) return '📊';
    if (m.includes('word') || m.includes('document')) return '📝';
    if (m.includes('presentation') || m.includes('powerpoint')) return '📽';
    if (m.includes('zip') || m.includes('archive')) return '📦';
    return '📄';
  };

  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;box-shadow:var(--sh1);">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">'
      + '<div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:800;">Documents · '+files.length+'</div>'
      + '<button onclick="triggerDocUpload('+jsArg(a.id)+')" style="height:32px;padding:0 14px;border-radius:8px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent-strong);font-size:12.5px;font-weight:700;cursor:pointer;">+ Upload</button>'
    + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:8px;">'
      + files.map(f => {
          const author = LIVE_AMS?.find(x => x.id === f.uploader_id);
          return '<div style="display:grid;grid-template-columns:36px 1fr auto auto 24px;gap:14px;align-items:center;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;">'
            + '<div style="width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:18px;">'+iconFor(f.mime_type)+'</div>'
            + '<div style="min-width:0;">'
              + '<div style="font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(f.file_name || f.label || '(unnamed)')+'</div>'
              + '<div style="font-size:11px;color:var(--text-3);font-weight:600;margin-top:2px;">'+fmtDate(f.created_at)+(author ? ' · '+esc(author.name) : '')+'</div>'
            + '</div>'
            + '<span class="tnum" style="font-size:11.5px;color:var(--text-3);font-weight:700;">'+fmtBytes(f.size_bytes)+'</span>'
            + '<button onclick="downloadDocument('+jsArg(f.storage_path)+', '+jsArg(f.file_name || 'download')+')" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:11.5px;font-weight:700;cursor:pointer;">↓ Download</button>'
            + '<button onclick="deleteDocument('+jsArg(f.id)+', '+jsArg(f.storage_path)+', '+jsArg(a.id)+')" title="Archive" style="width:28px;height:28px;border-radius:7px;color:var(--text-3);cursor:pointer;font-size:14px;">🗑</button>'
          + '</div>';
        }).join('')
    + '</div>'
  + '</div>';
}

                + '<button title="Delete company" onclick="deleteAccount('+jsArg(a.id)+')" style="display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:var(--surface);color:var(--bad);border:1px solid var(--bad);cursor:pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>'

                + '<div style="font-size:11px;color:var(--text-3);font-weight:500;margin-top:3px;">'+esc(a.value ? 'annual contract' : 'not set')+'</div>' },
