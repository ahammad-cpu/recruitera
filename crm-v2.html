// FX rates to EGP. Update the USD row when the CBE rate moves — everything else
// (Deal value in header, kanban ACV totals, dashboard KPIs) recomputes from
// contract_cycles.value × this table when the cycle is priced in a non-EGP
// currency. Missing currencies fall through to 1.0 (treated as EGP).
const FX_TO_EGP = { EGP: 1, USD: 49.43, EUR: 53.0, SAR: 13.15 };
function toEgp(value, currency){
  const n = Number(value) || 0;
  if (!n) return 0;
  const rate = FX_TO_EGP[(currency || 'EGP').toUpperCase()] || 1;
  return n * rate;
}
const SB_AUTH_KEY = 'sb-rtdrlpnfqjtwtsrwnifn-auth-token';

function getAccessToken(){
  try{
    const raw = localStorage.getItem(SB_AUTH_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    const session = parsed?.currentSession || parsed;
    const token = session?.access_token;
    if(!token) return null;
    let exp = session?.expires_at;
    if(!exp){ try{ exp = JSON.parse(atob(token.split('.')[1]))?.exp; }catch{} }
    if(!exp) return null;
    if(Date.now()/1000 >= exp - 60){ localStorage.removeItem(SB_AUTH_KEY); return null; }
    return token;
  }catch{ return null; }
}

// Google's favicon service — free, unlimited, never CORS-blocked. Small (max
// 64px) so acceptable for table rows and headers. Falls back to the initials
// text sitting behind the <img> when the domain has no favicon.
const LOGO_DOMAIN_CACHE = new Map();  // name(lower) -> domain string | null
const LOGO_DOMAIN_INFLIGHT = new Set();
function resolveDomainByName(name){
  const key = (name || '').trim().toLowerCase();
  if (!key || key.length < 3) return null;
  if (LOGO_DOMAIN_CACHE.has(key)) return LOGO_DOMAIN_CACHE.get(key);
  if (LOGO_DOMAIN_INFLIGHT.has(key)) return null;
  LOGO_DOMAIN_INFLIGHT.add(key);
  // Clearbit's public autocomplete — no auth, free, returns [{name,domain,logo}].
  fetch('https://autocomplete.clearbit.com/v1/companies/suggest?query=' + encodeURIComponent(name))
    .then(r => r.ok ? r.json() : [])
    .then(list => {
      const d = list && list[0] && list[0].domain ? list[0].domain : null;
      LOGO_DOMAIN_CACHE.set(key, d);
      LOGO_DOMAIN_INFLIGHT.delete(key);
      if (d) render();
    })
    .catch(() => { LOGO_DOMAIN_CACHE.set(key, null); LOGO_DOMAIN_INFLIGHT.delete(key); });
  return null;
}
function logoImg(domain, size){
  if (!domain) return '';
  const s = size || 34;
  const px = Math.max(64, s * 2);
  const src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=' + px;
  return '<img src="'+src+'" alt="" loading="lazy" onerror="this.style.display=\'none\'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:'+Math.round(s*0.12)+'px;background:#fff;">';
}
function logoBadge(name, domain, size, logoUrl){
  const s = size || 34;
  const inner = initialsOf(name)
    + (logoUrl
        ? '<img src="'+esc(logoUrl)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:'+Math.round(s*0.08)+'px;background:#fff;">'
        : (function(){ let d = domain; if (!d && name) d = resolveDomainByName(name); return logoImg(d, s); })());
  return '<div style="'+logoStyle(s)+'">'+inner+'</div>';
}
function initialsOf(n){ return n.split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase(); }
function egp(n){ const v = Number(n) || 0; return v.toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' EGP'; }
function short(n){ const v = Number(n) || 0; return v.toLocaleString('en-US', { maximumFractionDigits: 0 }); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
// HTML-safe wrapper for inline handler arguments. JSON.stringify handles the
// numeric-vs-string distinction (numbers stay bare, strings get quotes), and
// we HTML-escape the resulting quotes so they don't blow up the attribute.
function jsArg(v){ return JSON.stringify(v).replace(/"/g, '&quot;'); }

function setState(patch){ Object.assign(state, patch); render(); }
function go(page){ setState({ page, detailId: null }); }
function toggleSidebar(){ setState({ sidebarCollapsed: !state.sidebarCollapsed }); }
function openDetail(id){
  setState({ detailId: id, detailTab: 'overview' });
  // Lazy fetch activities + per-account details (cycles / all contacts / files)
  // when opened (live only)
  if (state.dataSource === 'live') {
    loadActivitiesForAccount(id);
    loadDetailsForAccount(id);
  }
}

async function loadDetailsForAccount(accountId){
  if (LIVE_DETAILS_BY_ACCT.has(accountId)) return;
  const token = getAccessToken();
  if (!token) return;
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  const qs = (path) => fetch(SB_URL + path, { headers }).then(r => r.ok ? r.json() : []).catch(() => []);
  try {
    const [cycles, contacts, files, tags] = await Promise.all([
      qs('/rest/v1/contract_cycles?select=*&account_id=eq.' + encodeURIComponent(accountId) + '&order=cycle_number.desc'),
      qs('/rest/v1/contacts?select=*&account_id=eq.' + encodeURIComponent(accountId) + '&order=is_primary.desc.nullslast,created_at.asc'),
      qs('/rest/v1/account_documents?select=*&account_id=eq.' + encodeURIComponent(accountId) + '&is_archived=is.false&order=created_at.desc'),
      qs('/rest/v1/account_tags?select=tag_id,added_at,tags(id,label,color)&account_id=eq.' + encodeURIComponent(accountId) + '&order=added_at.asc'),
    ]);
    LIVE_DETAILS_BY_ACCT.set(accountId, { cycles, contacts, files, tags });
    if (state.detailId === accountId) render();
  } catch(e){ console.warn('[CRM v2] loadDetails failed:', e.message); }
}
function closeDetail(){ setState({ detailId: null }); }
function toggleTask(id){
  const t = tasksList();
  const x = t.find(i => i.id === id);
  if (x) x.done = !x.done;
  setState({ tasks: t.slice() });
}
function setRange(r){ setState({ range: r }); }
function setCallsTab(t){ setState({ callsTab: t }); }
function toast(msg){
  state.toast = msg;
  render();
  clearTimeout(window._crmToast);
  window._crmToast = setTimeout(() => { state.toast = null; render(); }, 2600);
}
function setRole(r){ setState({ role: r }); }

// ---------- CYCLE EDITOR MODAL ----------
function openCycleModal(accountId, existingCycle, opts){
  const cy = existingCycle || {};
  const stageAfter = opts && opts.stageAfter ? opts.stageAfter : null;
  setState({
    cycleModalOpen: true,
    cycleModalAccountId: accountId,
    cycleModalMode: existingCycle ? 'edit' : 'add',
    cycleModalStageAfter: stageAfter,
    cycleModalStatus: 'idle',
    cycleModalError: null,
    cycleForm: {
      id:           cy.id || null,
      cycle_number: cy.cycle_number || null,
      plan_tier:    cy.plan_tier    || '',
      value:        cy.value != null ? String(cy.value) : '',
      currency:     cy.currency     || 'EGP',
      started_at:   cy.started_at   || '',
      ends_at:      cy.ends_at      || '',
      status:       cy.status       || 'active',
      auto_renew:   cy.auto_renew === true,
      payment_type: cy.payment_type || '',
      notes:        cy.notes        || '',
      deal_value_egp: '',
    },
  });
}
function closeCycleModal(){ setState({ cycleModalOpen: false, cycleModalStatus: 'idle', cycleModalError: null, cycleModalStageAfter: null }); }
function setCycleField(k, v){ state.cycleForm = Object.assign({}, state.cycleForm, { [k]: v }); render(); }
async function submitCycle(){
  const s = state;
  const f = s.cycleForm || {};
  if (!f.plan_tier || !f.started_at || !f.ends_at) {
    setState({ cycleModalError: 'Plan tier, term start, and term end are required' });
    return;
  }
  const token = getAccessToken();
  if (!token) { toast('Login required to save cycle'); return; }
  state.cycleModalStatus = 'submitting';
  render();
  const headers = {
    apikey: SB_KEY,
    Authorization: 'Bearer ' + token,
    'Content-Type': 'application/json',
    Prefer: 'return=representation',
  };
  const payload = {
    account_id:   s.cycleModalAccountId,
    plan_tier:    f.plan_tier,
    value:        f.value ? Number(f.value) : null,
    currency:     f.currency || 'EGP',
    started_at:   f.started_at,
    ends_at:      f.ends_at,
    status:       f.status,
    auto_renew:   !!f.auto_renew,
    payment_type: f.payment_type || null,
    notes:        f.notes || null,
  };
  try {
    let res;
    if (s.cycleModalMode === 'edit' && f.id) {
      res = await fetch(SB_URL + '/rest/v1/contract_cycles?id=eq.' + encodeURIComponent(f.id), {
        method: 'PATCH', headers, body: JSON.stringify(payload),
      });
    } else {
      // New cycle: pick the next cycle_number for this account
      const existing = LIVE_DETAILS_BY_ACCT.get(s.cycleModalAccountId)?.cycles || [];
      const maxN = existing.reduce((m,c) => Math.max(m, c.cycle_number || 0), 0);
      payload.cycle_number = maxN + 1;
      res = await fetch(SB_URL + '/rest/v1/contract_cycles', {
        method: 'POST', headers, body: JSON.stringify(payload),
      });
    }
    if (!res.ok) {
      const t = await res.text();
      throw new Error('Supabase ' + res.status + ': ' + t.slice(0, 180));
    }
    // If this modal was opened by a stage → won intercept, patch the account
    // stage + deal_value in the same round-trip so the pipeline reflects it.
    if (s.cycleModalStageAfter) {
      const dv = f.deal_value_egp ? Number(f.deal_value_egp) : (payload.value ? toEgp(payload.value, payload.currency) : null);
      const body = { stage: s.cycleModalStageAfter };
      if (dv != null && !isNaN(dv)) body.deal_value = dv;
      const patchRes = await fetch(SB_URL + '/rest/v1/accounts?id=eq.' + encodeURIComponent(s.cycleModalAccountId), {
        method: 'PATCH',
        headers: Object.assign({}, headers, { Prefer:'return=minimal' }),
        body: JSON.stringify(body),
      });
      if (!patchRes.ok) throw new Error('Stage/deal-value save ' + patchRes.status);
    }
    // Refresh cycles for this account so the tab reflects the write
    LIVE_DETAILS_BY_ACCT.delete(s.cycleModalAccountId);
    LIVE_CYCLES_BY_ACCT?.delete?.(s.cycleModalAccountId);
    await loadDetailsForAccount(s.cycleModalAccountId);
    await refreshAccountRow(s.cycleModalAccountId);
    const wasWonFlow = s.cycleModalStageAfter === 'won';
    state.cycleModalOpen = false;
    state.cycleModalStageAfter = null;
    state.cycleModalStatus = 'done';
    render();
    toast(wasWonFlow ? 'Deal won · cycle added' : (s.cycleModalMode === 'edit' ? 'Cycle updated' : 'Cycle added'));
  } catch (e) {
    console.error('[CRM v2] cycle save failed:', e);
    state.cycleModalStatus = 'error';
    state.cycleModalError = String(e.message || e);
    render();
  }
}
Object.assign(window, { openCycleModal, closeCycleModal, setCycleField, submitCycle });

function editPrimaryContact(accountId){
  const entry = LIVE_CONTACTS_BY_ACCT && LIVE_CONTACTS_BY_ACCT.get(accountId);
  if (entry && entry._primary) { openContactModal(accountId, entry._primary); return; }
  const a = (state.accounts || []).find(x => x.id === accountId);
  if (a && a._rawContact) {
    openContactModal(accountId, {
      full_name: a._rawContact.name || '',
      email:     a._rawContact.email || '',
      phone:     a._rawContact.phone || '',
      is_primary: true,
    });
    return;
  }
  openContactModal(accountId);
}
const LOST_REASONS = [
  'Went with competitor',
  'Budget / price',
  'Not the right fit',
  'Timing / no urgency',
  'No response / ghosted',
  'Product gap',
  'Other',
];
async function _writeStage(accountId, newStage, extra){
  const acct = (state.accounts || []).find(x => x.id === accountId);
  if (!acct) return;
  const prev = acct.stage;
  const prevReason = acct._lostReason;
  const prevDetail = acct._lostDetail;
  acct.stage = newStage;
  if (extra && 'lost_reason' in extra) acct._lostReason = extra.lost_reason;
  if (extra && 'lost_detail' in extra) acct._lostDetail = extra.lost_detail;
  render();
  const token = getAccessToken();
  if (!token) { acct.stage = prev; acct._lostReason = prevReason; acct._lostDetail = prevDetail; render(); toast('Login required'); return; }
  try {
    const res = await fetch(SB_URL + '/rest/v1/accounts?id=eq.' + encodeURIComponent(accountId), {
      method: 'PATCH',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type':'application/json', Prefer:'return=minimal' },
      body: JSON.stringify(Object.assign({ stage: newStage }, extra || {})),
    });
    if (!res.ok) throw new Error('Stage ' + res.status);
    toast(newStage === 'lost' ? ('Lost · ' + (extra && extra.lost_reason || 'reason set')) : ('Stage → ' + (STAGE[newStage] && STAGE[newStage].label || newStage)));
  } catch (e) {
    acct.stage = prev; acct._lostReason = prevReason; acct._lostDetail = prevDetail; render();
    toast('Stage change failed: ' + (e.message || e));
  }
}
async function changeAccountStage(accountId, newStage){
  const acct = (state.accounts || []).find(x => x.id === accountId);
  if (!acct || acct.stage === newStage) return;
  if (newStage === 'lost') { openLostModal(accountId); return; }
  if (newStage === 'won') { openCycleModal(accountId, null, { stageAfter: 'won' }); return; }
  return _writeStage(accountId, newStage);
}
function openLostModal(accountId){
  setState({ lostModal: { open:true, accountId, reason: LOST_REASONS[0], custom:'', detail:'' } });
}
function closeLostModal(){ setState({ lostModal: { open:false } }); }
function setLostField(k, v){ state.lostModal = Object.assign({}, state.lostModal, { [k]: v }); render(); }
async function submitLostModal(){
  const m = state.lostModal || {};
  let reason = m.reason || LOST_REASONS[0];
  if (reason === 'Other') {
    const custom = (m.custom || '').trim();
    if (!custom) { toast('Add a custom reason or pick another option'); return; }
    reason = custom;
  }
  const accountId = m.accountId;
  const detail = (m.detail || '').trim() || null;
  closeLostModal();
  await _writeStage(accountId, 'lost', { lost_reason: reason, lost_detail: detail });
}

        + '<button onclick="submitLostModal()" style="height:36px;padding:0 18px;border-radius:8px;border:1px solid var(--bad);background:var(--bad);color:#fff;font-size:13px;font-weight:700;cursor:pointer;">Mark Lost</button>'

async function changeAccountOwner(accountId, newOwnerId){
  const acct = (state.accounts || []).find(x => x.id === accountId);
  if (!acct || acct.am === newOwnerId) return;
  const prev = acct.am;
  const prevMail = acct._amMail;
  const owner = (LIVE_AMS || []).find(x => x.id === newOwnerId);
  acct.am = newOwnerId;
  if (owner && owner.email) acct._amMail = owner.email;
  render();
  const token = getAccessToken();
  if (!token) { acct.am = prev; acct._amMail = prevMail; render(); toast('Login required'); return; }
  const body = { owner_id: newOwnerId };
  if (owner && owner.email) body.am_mail = owner.email;
  try {
    const res = await fetch(SB_URL + '/rest/v1/accounts?id=eq.' + encodeURIComponent(accountId), {
      method: 'PATCH',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type':'application/json', Prefer:'return=minimal' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Owner ' + res.status);
    toast('Owner → ' + (owner ? owner.name : newOwnerId));
  } catch (e) {
    acct.am = prev; acct._amMail = prevMail; render();
    toast('Owner change failed: ' + (e.message || e));
  }
}

// ---------- NOTE / ACTIVITY COMPOSER ----------
function setComposerKind(k){ state.composerKind = k; render(); setTimeout(() => { const t = document.getElementById('composer-textarea'); if (t) t.focus({preventScroll:true}); }, 0); }
function setComposerText(v){
  state.composerText = v;
  const el = document.getElementById('composer-textarea');
  const caret = el ? el.selectionStart : v.length;
  const upTo = v.slice(0, caret);
  const m = upTo.match(/@([A-Za-z0-9_.\-]*)$/);
  if (m) {
    state.composerMention = { open: true, query: m[1].toLowerCase(), anchor: caret - m[1].length - 1 };
  } else if (state.composerMention && state.composerMention.open) {
    state.composerMention = { open: false, query: '', anchor: 0 };
  }
  render();
  setTimeout(() => { const t = document.getElementById('composer-textarea'); if (t) { t.focus(); t.setSelectionRange(caret, caret); } }, 0);
}
function insertMention(name){
  const el = document.getElementById('composer-textarea');
  const v = state.composerText || '';
  const anchor = state.composerMention?.anchor ?? v.length;
  const caret = el ? el.selectionStart : v.length;
  const before = v.slice(0, anchor);
  const after  = v.slice(caret);
  const token = '@' + name.replace(/\s+/g, '') + ' ';
  const next = before + token + after;
  state.composerText = next;
  state.composerMention = { open: false, query: '', anchor: 0 };
  render();
  const newCaret = (before + token).length;
  setTimeout(() => { const t = document.getElementById('composer-textarea'); if (t) { t.focus(); t.setSelectionRange(newCaret, newCaret); } }, 0);
}
async function submitComposerNote(accountId){
  const text = (state.composerText || '').trim();
  if (!text) { toast('Write something first'); return; }
  const kind = state.composerKind || 'call';
  const typeMap = { call:'call', email:'email', whatsapp:'note' };
  const activityType = typeMap[kind] || 'note';
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  const mentions = Array.from(new Set((text.match(/@([A-Za-z0-9_.\-]+)/g) || []).map(x => x.slice(1))));
  const body = {
    account_id: accountId,
    type: activityType,
    text,
    mentions,
  };
  if (kind === 'whatsapp') body.email_subject = 'WhatsApp';
  try {
    const res = await fetch(SB_URL + '/rest/v1/activities', {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type':'application/json', Prefer:'return=representation' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Activity ' + res.status + ': ' + (await res.text()).slice(0,140));
    state.composerText = '';
    state.composerMention = { open: false, query: '', anchor: 0 };
    LIVE_ACTIVITIES_BY_ACCT.delete(accountId);
    await loadDetailsForAccount(accountId);
    render();
    toast('Note added');
  } catch (e) {
    toast('Note failed: ' + (e.message || e));
  }
}
Object.assign(window, { setComposerKind, setComposerText, insertMention, submitComposerNote });

// ---------- TAGS ----------
async function addAccountTag(accountId){
  const label = (prompt('Tag label') || '').trim();
  if (!label) return;
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type':'application/json' };
  try {
    const findRes = await fetch(SB_URL + '/rest/v1/tags?select=id,label,color&label=eq.' + encodeURIComponent(label) + '&limit=1', { headers });
    let tag = findRes.ok ? (await findRes.json())[0] : null;
    if (!tag) {
      const insRes = await fetch(SB_URL + '/rest/v1/tags', {
        method: 'POST',
        headers: Object.assign({}, headers, { Prefer:'return=representation' }),
        body: JSON.stringify({ label, color: '#6b7280', is_preset: false }),
      });
      if (!insRes.ok) throw new Error('Tag ' + insRes.status);
      tag = (await insRes.json())[0];
    }
    const linkRes = await fetch(SB_URL + '/rest/v1/account_tags', {
      method: 'POST',
      headers: Object.assign({}, headers, { Prefer:'resolution=ignore-duplicates' }),
      body: JSON.stringify({ account_id: accountId, tag_id: tag.id }),
    });
    if (!linkRes.ok && linkRes.status !== 409) throw new Error('Link ' + linkRes.status);
    LIVE_DETAILS_BY_ACCT.delete(accountId);
    await loadDetailsForAccount(accountId);
    render();
    toast('Tag added');
  } catch (e) { toast('Tag failed: ' + (e.message || e)); }
}
async function removeAccountTag(accountId, tagId){
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    const res = await fetch(SB_URL + '/rest/v1/account_tags?account_id=eq.' + encodeURIComponent(accountId) + '&tag_id=eq.' + encodeURIComponent(tagId), {
      method: 'DELETE',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token },
    });
    if (!res.ok) throw new Error('Untag ' + res.status);
    LIVE_DETAILS_BY_ACCT.delete(accountId);
    await loadDetailsForAccount(accountId);
    render();
  } catch (e) { toast('Untag failed: ' + (e.message || e)); }
}
Object.assign(window, { addAccountTag, removeAccountTag });

// ---------- DELETE ACCOUNT ----------
async function deleteAccount(accountId){
  const a = (state.accounts || []).find(x => x.id === accountId);
  if (!a) return;
  const label = a.name || 'this account';
  const ok = confirm('Delete "' + label + '"?\n\nThis permanently removes the account plus any linked contacts, activities, cycles, tags and documents. This cannot be undone.');
  if (!ok) return;
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    const res = await fetch(SB_URL + '/rest/v1/accounts?id=eq.' + encodeURIComponent(accountId), {
      method: 'DELETE',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, Prefer:'return=minimal' },
    });
    if (!res.ok) throw new Error('Delete ' + res.status + ': ' + (await res.text()).slice(0,160));
    state.accounts = (state.accounts || []).filter(x => x.id !== accountId);
    LIVE_DETAILS_BY_ACCT.delete(accountId);
    LIVE_ACTIVITIES_BY_ACCT.delete(accountId);
    LIVE_CONTACTS_BY_ACCT?.delete?.(accountId);
    LIVE_CYCLES_BY_ACCT?.delete?.(accountId);
    LIVE_TRACKING_BY_ACCT?.delete?.(accountId);
    if (state.detailId === accountId) state.detailId = null;
    render();
    toast('Deleted ' + label);
  } catch (e) {
    toast('Delete failed: ' + (e.message || e));
  }
}
Object.assign(window, { deleteAccount });

// ---------- ACCOUNT LOGO (upload / remove) ----------
async function uploadAccountLogo(accountId){
  const acct = (state.accounts || []).find(x => x.id === accountId);
  if (!acct) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    document.body.removeChild(input);
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('Pick an image file'); return; }
    if (file.size > 3 * 1024 * 1024) { toast('Image too large — 3 MB max'); return; }
    const token = getAccessToken();
    if (!token) { toast('Login required'); return; }
    const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g,'') || 'png';
    const path = 'accounts/' + accountId + '.' + ext;
    toast('Uploading logo…');
    try {
      const up = await fetch(SB_URL + '/storage/v1/object/avatars/' + encodeURI(path), {
        method: 'POST',
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'true' },
        body: file,
      });
      if (!up.ok) throw new Error('Storage ' + up.status + ': ' + (await up.text()).slice(0,140));
      const publicUrl = SB_URL + '/storage/v1/object/public/avatars/' + encodeURI(path) + '?v=' + Math.floor(Date.now()/1000);
      const pat = await fetch(SB_URL + '/rest/v1/accounts?id=eq.' + encodeURIComponent(accountId), {
        method: 'PATCH',
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type':'application/json', Prefer:'return=minimal' },
        body: JSON.stringify({ logo_url: publicUrl }),
      });
      if (!pat.ok) throw new Error('Save ' + pat.status);
      acct.logo_url = publicUrl;
      render();
      toast('Logo updated');
    } catch (e) { toast('Logo upload failed: ' + (e.message || e)); }
  });
  input.click();
}

async function deleteCycle(accountId, cycleId){
  if (!cycleId) { toast('Cycle id missing'); return; }
  if (!confirm('Delete this contract cycle?\n\nRenewal bucket and deal-value fallbacks recompute from the remaining cycles.')) return;
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    const res = await fetch(SB_URL + '/rest/v1/contract_cycles?id=eq.' + encodeURIComponent(cycleId), {
      method: 'DELETE',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, Prefer:'return=minimal' },
    });
    if (!res.ok) throw new Error('Delete ' + res.status + ': ' + (await res.text()).slice(0,140));
    LIVE_DETAILS_BY_ACCT.delete(accountId);
    LIVE_CYCLES_BY_ACCT?.delete?.(accountId);
    await loadDetailsForAccount(accountId);
    await refreshAccountRow(accountId);
    render();
    toast('Cycle deleted');
  } catch (e) { toast('Delete failed: ' + (e.message || e)); }
}
// Re-fetch a single account row + its cycles, then re-run mapAcctFromSupabase
// so downstream fields (ren bucket, end, value, plan) recompute in place.
// Used after any cycle mutation so the Renewal Pipeline doesn't cling to
// stale bucket assignments.
async function refreshAccountRow(accountId){
  const token = getAccessToken();
  if (!token) return;
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  try {
    const [rawArr, cycArr] = await Promise.all([
      fetch(SB_URL + '/rest/v1/accounts?select=*&id=eq.' + encodeURIComponent(accountId), { headers }).then(r => r.ok ? r.json() : []),
      fetch(SB_URL + '/rest/v1/contract_cycles?select=account_id,status,plan_tier,value,currency,ends_at,cycle_number&account_id=eq.' + encodeURIComponent(accountId) + '&order=cycle_number.desc', { headers }).then(r => r.ok ? r.json() : []),
    ]);
    if (LIVE_CYCLES_BY_ACCT) {
      LIVE_CYCLES_BY_ACCT.delete(accountId);
      const top = cycArr && cycArr[0];
      if (top) LIVE_CYCLES_BY_ACCT.set(accountId, { plan: top.plan_tier, value: top.value, currency: top.currency || 'EGP', ends_at: top.ends_at, status: top.status });
    }
    if (rawArr && rawArr[0]) {
      const list = state.accounts || [];
      const idx = list.findIndex(x => x.id === accountId);
      const mapped = mapAcctFromSupabase(rawArr[0], idx >= 0 ? idx : 0);
      if (idx >= 0) list[idx] = mapped; else list.push(mapped);
    }
  } catch (e) { console.warn('[CRM v2] refreshAccountRow failed:', e.message); }
}
Object.assign(window, { deleteCycle });

// ---------- DOCUMENT UPLOAD / DOWNLOAD / DELETE ----------
async function triggerDocUpload(accountId){
  // Uses a hidden file input approach: create → click → wait for change → upload
  const input = document.createElement('input');
  input.type = 'file';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    document.body.removeChild(input);
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { toast('File too large — 25 MB max'); return; }
    const token = getAccessToken();
    if (!token) { toast('Login required'); return; }
    const safe = file.name.replace(/[^\w.\-]+/g, '_');
    const docId = (crypto.randomUUID && crypto.randomUUID()) || ('d_' + Math.random().toString(36).slice(2));
    const path = accountId + '/' + docId + '-' + safe;
    toast('Uploading ' + file.name + '…');
    try {
      // 1. Upload the file to storage
      const up = await fetch(SB_URL + '/storage/v1/object/account-docs/' + encodeURI(path), {
        method: 'POST',
        headers: {
          apikey: SB_KEY,
          Authorization: 'Bearer ' + token,
          'Content-Type': file.type || 'application/octet-stream',
          'x-upsert': 'false',
        },
        body: file,
      });
      if (!up.ok) throw new Error('Storage ' + up.status + ': ' + (await up.text()).slice(0, 180));
      // 2. Insert metadata row
      const ins = await fetch(SB_URL + '/rest/v1/account_documents', {
        method: 'POST',
        headers: {
          apikey: SB_KEY,
          Authorization: 'Bearer ' + token,
          'Content-Type': 'application/json',
          Prefer: 'return=representation',
        },
        body: JSON.stringify({
          id: docId,
          account_id: accountId,
          storage_path: path,
          file_name: file.name,
          mime_type: file.type || null,
          size_bytes: file.size,
        }),
      });
      if (!ins.ok) {
        // Metadata failed — clean up the orphan storage object
        await fetch(SB_URL + '/storage/v1/object/account-docs/' + encodeURI(path), {
          method: 'DELETE',
          headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token },
        });
        throw new Error('Metadata ' + ins.status + ': ' + (await ins.text()).slice(0, 180));
      }
      LIVE_DETAILS_BY_ACCT.delete(accountId);
      await loadDetailsForAccount(accountId);
      render();
      toast('Uploaded ' + file.name);
    } catch (e) {
      console.error('[CRM v2] upload failed:', e);
      toast('Upload failed: ' + (e.message || e));
    }
  });
  input.click();
}
async function downloadDocument(storagePath, filename){
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    // Sign a short-lived URL then open it
    const sig = await fetch(SB_URL + '/storage/v1/object/sign/account-docs/' + encodeURI(storagePath), {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ expiresIn: 60 }),
    });
    if (!sig.ok) throw new Error('Sign ' + sig.status);
    const { signedURL } = await sig.json();
    const url = signedURL.startsWith('http') ? signedURL : (SB_URL + '/storage/v1' + signedURL);
    // Open in a new tab; the browser downloads based on Content-Disposition
    window.open(url, '_blank');
  } catch (e) {
    toast('Download failed: ' + (e.message || e));
  }
}
async function deleteDocument(docId, storagePath, accountId){
  if (!confirm('Archive this document? It will be hidden from the list.')) return;
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    // Soft-archive (matches how /crm handles it — keeps the file for audit)
    const res = await fetch(SB_URL + '/rest/v1/account_documents?id=eq.' + encodeURIComponent(docId), {
      method: 'PATCH',
      headers: {
        apikey: SB_KEY,
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal',
      },
      body: JSON.stringify({ is_archived: true }),
    });
    if (!res.ok) throw new Error('Supabase ' + res.status);
    LIVE_DETAILS_BY_ACCT.delete(accountId);
    await loadDetailsForAccount(accountId);
    render();
    toast('Document archived');
  } catch (e) {
    toast('Archive failed: ' + (e.message || e));
  }
}
Object.assign(window, { triggerDocUpload, downloadDocument, deleteDocument });

// ---------- MERGE MODAL ----------
function openMergeModal(seedId){
  // Snapshot the current dupe map so the modal stays consistent even if state changes
  const dupeMap = buildDupeMap(accts().filter(a => !isJunkAccount(a)));
  const entry = dupeMap.get(seedId);
  if (!entry) { toast('No duplicates found for this row'); return; }
  const partnerIds = [seedId, ...entry.partners];
  // Default keeper = the account most likely to be canonical:
  //   1. Highest ICP score wins
  //   2. Tiebreak on "furthest along in funnel" (won > proposal > demo > sql > mql > lead > lost)
  const funnelWeight = { paid:7, won:6, proposal:5, demo:4, sql:3, mql:2, lead:1, lost:0 };
  const rows = partnerIds.map(id => accts().find(a => a.id === id)).filter(Boolean);
  rows.sort((a,b) => (b.score||0) - (a.score||0) || (funnelWeight[b.stage]||0) - (funnelWeight[a.stage]||0));
  setState({
    mergeOpen: true,
    mergeIds: partnerIds,
    mergeKeeper: rows[0]?.id || seedId,
    mergeReasons: Array.from(entry.reasons),
    mergeStatus: 'idle',
    mergeError: null,
  });
}
function closeMergeModal(){ setState({ mergeOpen: false, mergeStatus: 'idle', mergeError: null }); }
function setMergeKeeper(id){ setState({ mergeKeeper: id }); }
async function submitMerge(){
  const s = state;
  if (!s.mergeKeeper || !s.mergeIds || s.mergeIds.length < 2) return;
  const token = getAccessToken();
  if (!token) { toast('Login required to merge — no auth token'); return; }
  const loserIds = s.mergeIds.filter(id => id !== s.mergeKeeper);
  state.mergeStatus = 'submitting';
  render();
  // merge_accounts takes ONE loser per call → loop, short-circuit on failure.
  // Prefer merge_accounts over manual_merge_accounts because the latter has a
  // broken k.email reference AND hard-deletes losers instead of soft-merging.
  const headers = {
    apikey: SB_KEY,
    Authorization: 'Bearer ' + token,
    'Content-Type': 'application/json',
  };
  try {
    let done = 0;
    for (const loserId of loserIds) {
      const res = await fetch(SB_URL + '/rest/v1/rpc/merge_accounts', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          _primary_id: s.mergeKeeper,
          _duplicate_id: loserId,
          _reason: 'crm-v2 dupe review',
        }),
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error('Supabase ' + res.status + ' after ' + done + '/' + loserIds.length + ' merged: ' + t.slice(0, 180));
      }
      done++;
    }
    // Refetch accounts + contacts so losers vanish and merged data surfaces
    // on the keeper without a page reload.
    const [accounts] = await Promise.all([
      fetchAccountsLive(token),
      fetchContactsLive(token).catch(() => {}),
    ]);
    state.accounts = accounts;
    state.mergeOpen = false;
    state.mergeStatus = 'done';
    render();
    toast('Merged ' + done + ' duplicate' + (done > 1 ? 's' : '') + ' — reversible via unmerge_account');
  } catch (e) {
    console.error('[CRM v2] merge failed:', e);
    state.mergeStatus = 'error';
    state.mergeError = String(e.message || e);
    render();
  }
}
Object.assign(window, { openMergeModal, closeMergeModal, setMergeKeeper, submitMerge });

// ---------- SPARKLINE ----------
function sparkBars(seed, useAccent){
  const out = []; let s = seed;
  for (let i = 0; i < 11; i++) {
    s = (s * 9301 + 49297) % 233280;
    const v = 30 + (s / 233280) * 65;
    out.push('<div style="width:4px;border-radius:2px;height:'+v.toFixed(0)+'%;background:'+(useAccent ? 'var(--accent)' : 'var(--cg-300)')+';"></div>');
  }
  return '<div style="display:flex;align-items:flex-end;gap:2px;height:28px;">' + out.join('') + '</div>';
}

// ---------- CHART (rolling revenue) ----------
function chartPaths(){
  const pts = [28,32,30,36,40,38,46,44,52,50,58,62];
  const net = pts.map(v => v - 6);
  const W=720,H=220,pl=36,pr=16,pt=16,pb=20;
  const iw=W-pl-pr, ih=H-pt-pb, max=70, min=14;
  const x = i => pl + (i/(pts.length-1))*iw;
  const y = v => pt + ih - ((v-min)/(max-min))*ih;
  const line = arr => arr.map((v,i) => (i?'L':'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const area = line(pts) + ' L ' + x(pts.length-1).toFixed(1) + ',' + (pt+ih).toFixed(1) + ' L ' + pl + ',' + (pt+ih).toFixed(1) + ' Z';
  return { gross: line(pts), net: line(net), area, W, H };
}

// Junk detector — placeholder / dev rows that shouldn't clutter the CRM.
// Currently matches 69 "untitled" rows + a handful of "test" leftovers in prod.
const JUNK_NAMES = new Set(['untitled','test','tests','asdf','none','n/a','na','-','.']);
function isJunkAccount(a){
  const n = String(a.name || '').trim().toLowerCase().replace(/\s+/g,' ');
  if (!n) return true;
  if (JUNK_NAMES.has(n)) return true;
  if (n.length <= 1) return true;
  return false;
}

// Normalize helpers for duplicate matching
function normName(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g,' '); }
function normDomain(s){
  return String(s || '').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');
}
function normPhone(s){
  const digits = String(s || '').replace(/\D+/g,'');
  // Keep last 9-10 digits so "+201001234567" and "01001234567" match
  return digits.length > 10 ? digits.slice(-10) : digits;
}
function emailDomain(s){
  const m = String(s || '').toLowerCase().match(/@([^\s@]+)$/);
  return m ? m[1] : '';
}
// Domains that are junk-signal — matching by them would falsely link
// unrelated accounts. Excluded from the domain + email-domain indexes.
const GENERIC_DOMAINS = new Set([
  'gmail.com','yahoo.com','hotmail.com','outlook.com','icloud.com','live.com','aol.com','mail.com',
  'protonmail.com','yandex.com','msn.com','me.com',
]);

// Build multi-key duplicate detector. Returns:
//   Map<accountId, { reasons: Set<'name'|'domain'|'phone'|'email'>, partners: Set<accountId> }>
// A row is a duplicate if it shares AT LEAST ONE key with another row.
function buildDupeMap(rows){
  const contactOf = (a) => LIVE_CONTACTS_BY_ACCT?.get(a.id) || {};
  const byKey = { name: new Map(), domain: new Map(), phone: new Map(), email: new Map() };
  const add = (bucket, key, id) => {
    if (!key) return;
    if (!byKey[bucket].has(key)) byKey[bucket].set(key, []);
    byKey[bucket].get(key).push(id);
  };
  for (const a of rows) {
    const c = contactOf(a);
    add('name',   normName(a.name), a.id);
    const dom = normDomain(a.domain);
    if (dom && !GENERIC_DOMAINS.has(dom)) add('domain', dom, a.id);
    add('phone',  normPhone(c.phone), a.id);
    const ed = emailDomain(c.email);
    if (ed && !GENERIC_DOMAINS.has(ed)) add('email', ed, a.id);
  }
  const out = new Map();
  for (const [bucket, m] of Object.entries(byKey)) {
    for (const ids of m.values()) {
      if (ids.length < 2) continue;
      for (const id of ids) {
        if (!out.has(id)) out.set(id, { reasons: new Set(), partners: new Set() });
        const entry = out.get(id);
        entry.reasons.add(bucket);
        for (const other of ids) if (other !== id) entry.partners.add(other);
      }
    }
  }
  return out;
}

// Back-compat helper: name-only count for junk detector display
function buildDupeIndex(rows){
  const m = new Map();
  for (const a of rows) {
    const key = normName(a.name);
    if (!key) continue;
    m.set(key, (m.get(key) || 0) + 1);
  }
  return m;
}

function filteredAccounts(){
  const s = state;
  let rows = accts().slice();
  // Hide junk unless the user explicitly opts in via the "Show junk" toggle
  if (!s.acctShowJunk) rows = rows.filter(a => !isJunkAccount(a));
  // Duplicates-only filter (opt-in) — now checks name/domain/phone/email
  if (s.acctDupesOnly) {
    const dm = buildDupeMap(rows);
    rows = rows.filter(a => dm.has(a.id));
  }
  // tab
  if (s.acctTab === 'leads')    rows = rows.filter(a => a.stage === 'lead');
  else if (s.acctTab === 'pipeline') rows = rows.filter(a => ['mql','sql','demo','proposal'].includes(a.stage));
  // Paid = collection happened (stage='paid'). This is what AM Performance targets.
  else if (s.acctTab === 'paid')     rows = rows.filter(a => a.stage === 'paid');
  // Trial = still on an active trial
  else if (s.acctTab === 'trial')    rows = rows.filter(a => a.paid === 'Free Trial' && a.act === 'Active');
  // Expired = trials that ran out without converting
  else if (s.acctTab === 'expired')  rows = rows.filter(a => a.paid === 'Free Trial' && a.act === 'Expired');
  // Churned = collected before, but activation expired (paid stage + expired activation)
  else if (s.acctTab === 'churned')  rows = rows.filter(a => a.stage === 'paid' && a.act === 'Expired');
  // Won = invoiced but not yet collected — the finance team's queue
  else if (s.acctTab === 'won')      rows = rows.filter(a => a.stage === 'won');
  // filters
  if (s.acctStage  !== 'all') rows = rows.filter(a => a.stage === s.acctStage);
  if (s.acctSource !== 'all') rows = rows.filter(a => a.source === s.acctSource);
  if (s.acctStatus !== 'all') rows = rows.filter(a => s.acctStatus === 'Expired' ? a.act === 'Expired' : a.paid === s.acctStatus);
  if (s.acctIcp    !== 'all') rows = rows.filter(a => s.acctIcp === 'hi' ? a.score >= 80 : s.acctIcp === 'mid' ? (a.score >= 60 && a.score < 80) : a.score < 60);
  if (s.acctOwner  !== 'all') rows = rows.filter(a => a.am === s.acctOwner);
  if (s.acctTrial  !== 'all') rows = rows.filter(a => s.acctTrial === 'on' ? (a.paid === 'Free Trial' && a.act === 'Active') : s.acctTrial === 'expired' ? a.act === 'Expired' : !a.act);
  if (s.acctPlan   !== 'all') rows = rows.filter(a => a.plan === s.acctPlan);
  const q = (s.acctSearch || '').trim().toLowerCase();
  if (q) {
    // Multi-field search: company name, domain, contact name, email, phone.
    // Phone normalized to digits only so '+20 100', '01001234567', and
    // '201001234567' all match the same underlying number.
    const qDigits = q.replace(/\D+/g, '');
    rows = rows.filter(a => {
      if (a.name && a.name.toLowerCase().includes(q))     return true;
      if (a.domain && a.domain.toLowerCase().includes(q)) return true;
      const c = synthContact(a);
      if (c.name  && c.name.toLowerCase().includes(q))    return true;
      if (c.email && c.email.toLowerCase().includes(q))   return true;
      if (qDigits && c.phone) {
        const phoneDigits = String(c.phone).replace(/\D+/g, '');
        if (phoneDigits.includes(qDigits)) return true;
      }
      return false;
    });
  }
  // Apply sort last so filters compose predictably
  const sort = s.acctSort || { key: 'created', dir: 'desc' };
  rows.sort((a, b) => compareAccts(a, b, sort.key) * (sort.dir === 'asc' ? 1 : -1));
  return rows;
}

function synthContact(a){
  // Prefer live contact from Supabase if available
  if (LIVE_CONTACTS_BY_ACCT){
    const live = LIVE_CONTACTS_BY_ACCT.get(a.id);
    if (live && (live.name || live.email || live.phone)){
      return { name: live.name || '—', email: live.email || '—', phone: live.phone || '—', title: live.title || '' };
    }
  }
  // Fallback #1 for live accounts: raw_data Bubble-legacy contact fields.
  // Covers accounts created between backfill runs whose contact info is only
  // in accounts.raw_data.
  if (a._rawContact){
    return {
      name:  a._rawContact.name  || '—',
      email: a._rawContact.email || '—',
      phone: a._rawContact.phone || '—',
      title: '',
    };
  }
  // Fallback: deterministic mock. Only meaningful for the 17 numeric-id seed rows.
  if (typeof a.id !== 'number') return { name:'—', email:'—', phone:'—', title:'' };
  const first = ['Ahmed','Mona','Sara','Karim','Nada','Yasmin','Hossam','Tarek','Rania','Omar','Heba','Nour'][a.id % 12];
  const last  = ['Adel','Nabil','Galal','Salem','Farid','Reda','Ali','Hassan','Ibrahim','Kamal','Zaki','Amin'][(a.id * 3) % 12];
  const email = (first + '.' + last).toLowerCase() + '@' + a.domain;
  const phone = '+20 10' + String(1000 + (a.id * 137) % 8999) + ' ' + String(1000 + (a.id * 977) % 8999);
  return { name: first + ' ' + last, email, phone, title:'' };
}

// Actions for Companies view
function setAcctTab(t){ setState({ acctTab: t }); }

function setAcctSel(k, v){ setState({ [k]: v }); }
function setAcctSort(key){
  // Same column → flip direction; new column → default desc for scores/dates, asc otherwise
  const s = state.acctSort || {};
  if (s.key === key) {
    setState({ acctSort: { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } });
  } else {
    const defaultDesc = ['score','created'].includes(key);
    setState({ acctSort: { key, dir: defaultDesc ? 'desc' : 'asc' } });
  }
}

// Header renderer for sortable columns (Companies table)
function sortHead(key, label, baseStyle, extraStyle){
  const s = state.acctSort || { key: 'created', dir: 'desc' };
  const active = s.key === key;
  const arrow = active ? (s.dir === 'asc' ? '↑' : '↓') : '↕';
  const arrowColor = active ? 'var(--text)' : 'var(--text-4)';
  return '<th style="'+baseStyle+(extraStyle||'')+'cursor:pointer;user-select:none;" onclick="setAcctSort(\''+key+'\')">'
    + '<span style="display:inline-flex;align-items:center;gap:6px;'+(baseStyle.includes('text-align:right')?'':'')+'">'
    + label + '<span style="color:'+arrowColor+';font-weight:'+(active?800:500)+';">'+arrow+'</span>'
    + '</span></th>';
}

// Sort comparator that handles nulls, strings, numbers, and owner-name lookup
function compareAccts(a, b, key){
  let av, bv;
  if (key === 'owner') {
    av = amById(a.am).name || ''; bv = amById(b.am).name || '';
  } else if (key === 'score') {
    av = a.score || 0; bv = b.score || 0;
  } else if (key === 'created') {
    av = a._sinceRaw ? Date.parse(a._sinceRaw) : 0;
    bv = b._sinceRaw ? Date.parse(b._sinceRaw) : 0;
  } else if (key === 'stage') {
    // Sort by funnel order, not alphabetically
    const order = { lead:0, mql:1, sql:2, demo:3, proposal:4, won:5, paid:6, lost:7 };
    av = order[a.stage] ?? 99; bv = order[b.stage] ?? 99;
  } else {
    av = (a[key] || '').toString().toLowerCase();
    bv = (b[key] || '').toString().toLowerCase();
  }
  if (av < bv) return -1;
  if (av > bv) return 1;
  return 0;
}

const PIPE_COLS = [

  { key:'paid',     label:'Collected', accent:'var(--ok)'         },
  { key:'lost',     label:'Lost',      accent:'var(--bad)'        },
];
function setPipeField(k, v){ state[k] = v; render(); }
let PIPE_DRAG_ID = null;
function pipeDragStart(e, id){
  PIPE_DRAG_ID = id;
  try { e.dataTransfer.setData('text/plain', String(id)); e.dataTransfer.effectAllowed = 'move'; } catch {}
  if (e.currentTarget && e.currentTarget.style) { e.currentTarget.style.opacity = '0.55'; }
}
function pipeDragEnd(e){
  PIPE_DRAG_ID = null;
  if (e.currentTarget && e.currentTarget.style) { e.currentTarget.style.opacity = ''; }
  document.querySelectorAll('.pipe-col-drop-hi').forEach(el => {
    el.classList.remove('pipe-col-drop-hi');
    el.style.background = '';
    el.style.outline = '';
  });
}
function pipeDragOver(e){
  e.preventDefault();
  try { e.dataTransfer.dropEffect = 'move'; } catch {}
  const col = e.currentTarget;
  if (!col.classList.contains('pipe-col-drop-hi')) {
    col.classList.add('pipe-col-drop-hi');
    col.style.background = 'var(--accent-soft)';
    col.style.outline = '2px dashed var(--accent-strong)';
    col.style.outlineOffset = '-2px';
  }
}
function pipeDragLeave(e){
  const col = e.currentTarget;
  if (col.contains(e.relatedTarget)) return;
  col.classList.remove('pipe-col-drop-hi');
  col.style.background = '';
  col.style.outline = '';
}
function pipeDrop(e, stageKey){
  e.preventDefault();
  const id = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || PIPE_DRAG_ID;
  const col = e.currentTarget;
  col.classList.remove('pipe-col-drop-hi');
  col.style.background = '';
  col.style.outline = '';
  if (!id) return;
  changeAccountStage(id, stageKey);
}
Object.assign(window, { pipeDragStart, pipeDragEnd, pipeDragOver, pipeDragLeave, pipeDrop });
function pipeRangeBounds(){
  const now = new Date();
  const yr = now.getFullYear();
  const s = state;
  const startOfQ = (q, y) => new Date(y, (q-1)*3, 1);
  const endOfQ   = (q, y) => new Date(y, q*3, 1);
  if (s.pipeRange === 'thisq') { const q = Math.floor(now.getMonth()/3)+1; return [startOfQ(q,yr), endOfQ(q,yr)]; }
  if (s.pipeRange === 'thisy') { return [new Date(yr,0,1), new Date(yr+1,0,1)]; }
  const m = /^q([1-4])(\d{2})$/.exec(s.pipeRange || '');
  if (m) { const q = +m[1], y = 2000 + +m[2]; return [startOfQ(q,y), endOfQ(q,y)]; }
  if (s.pipeRange === 'custom') {
    const f = s.pipeFrom ? new Date(s.pipeFrom) : null;
    const t = s.pipeTo   ? new Date(s.pipeTo)   : null;
    if (t) t.setDate(t.getDate() + 1);
    return [f, t];
  }
  return [null, null];
}
function pipeInRange(a){
  const [from, to] = pipeRangeBounds();
  if (!from && !to) return true;
  const iso = a._sinceRaw || a.since;
  if (!iso) return false;
  const d = new Date(iso);
  if (isNaN(d)) return false;
  if (from && d < from) return false;
  if (to && d >= to) return false;
  return true;
}

// =========================================================================
//   RENDER: NOTIFICATIONS
// =========================================================================
function renderNotifications(){
  const acctById = new Map((state.accounts || []).map(a => [a.id, a]));
  const rows = state.notifications || [];
  const KIND_ICON = { mention:'💬', task_assigned:'📌', task_due:'⏰', task_overdue:'⏰', renewal_due:'📅', renewal_overdue:'⚡', deal_won:'🏆', deal_lost:'✗', system:'ℹ️' };
  const KIND_V    = { mention:'info', task_assigned:'info', task_due:'warn', task_overdue:'bad', renewal_due:'warn', renewal_overdue:'bad', deal_won:'ok', deal_lost:'neutral', system:'neutral' };
  const timeAgo = (iso) => {
    if (!iso) return '';
    const t = Date.parse(iso); if (isNaN(t)) return '';
    const s = (Date.now() - t) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s/60) + 'm ago';
    if (s < 86400) return Math.round(s/3600) + 'h ago';
    if (s < 86400*7) return Math.round(s/86400) + 'd ago';
    return new Date(t).toLocaleDateString('en-US', { month:'short', day:'numeric' });
  };
  const items = rows.map(n => {
    const a = n.account_id ? acctById.get(n.account_id) : null;
    return {
      title: n.title || (n.kind ? n.kind.replace(/_/g,' ') : 'Notification'),
      sub: n.body || (a ? a.name : ''),
      tag: (n.kind || 'system').replace(/_/g,' '),
      time: timeAgo(n.created_at),
      unread: !n.read_at,
      icon: KIND_ICON[n.kind] || '🔔',
      v: KIND_V[n.kind] || 'neutral',
      acctId: n.account_id,
    };
  });
  const unreadCount = items.filter(n => n.unread).length;
  const iconWrap = (v) => 'width:36px;height:36px;border-radius:10px;background:'+({bad:'var(--bad-bg)',warn:'var(--warn-bg)',ok:'var(--ok-bg)',info:'var(--info-bg)',lime:'var(--accent-soft)'}[v]||'var(--surface-2)')+';display:grid;place-items:center;font-size:16px;flex-shrink:0;';
  const list = items.map(n =>
    '<div class="row-h" onclick="'+(n.acctId?('openDetail('+jsArg(n.acctId)+')'):'toast(\'Nothing to open on this notification\')')+'" style="display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:var(--surface);border-radius:12px;cursor:pointer;margin-bottom:4px;border:1px solid var(--border);">'
      + '<div style="'+iconWrap(n.v)+'">'+n.icon+'</div>'
      + '<div style="flex:1;min-width:0;">'
        + '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;">'+esc(n.title)+'</div>'
        + '<div style="font-size:13px;color:var(--text-2);font-weight:500;margin-bottom:5px;">'+esc(n.sub)+'</div>'
        + '<div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4);font-weight:700;">'+esc(n.tag)+' · '+esc(n.time)+'</div>'
      + '</div>'
      + (n.unread ? '<span style="width:8px;height:8px;border-radius:999px;background:var(--accent);flex-shrink:0;margin-top:6px;"></span>' : '')
    + '</div>').join('');
  return '<div style="padding:28px 32px 56px;max-width:860px;">'
    + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">'
      + '<div style="font-size:22px;font-weight:800;letter-spacing:-.025em;">Notifications</div>'
      + (unreadCount > 0 ? '<span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bad-bg);color:var(--bad);">'+unreadCount+' unread</span>' : '')
      + '<div style="flex:1;"></div>'
      + '<button onclick="toast(\'All notifications marked as read\')" style="display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--text-2);">Mark all read</button>'
    + '</div>'
    + (items.length
        ? '<div style="display:flex;flex-direction:column;gap:2px;">' + list + '</div>'
        : '<div style="padding:48px 20px;text-align:center;border:1.5px dashed var(--border-2);border-radius:14px;color:var(--text-3);font-size:13px;">No notifications yet.</div>')
  + '</div>';
}

function renderReports(){
  const acts = accts();
  const pipelineVal = acts.filter(a => ['mql','sql','demo','proposal'].includes(a.stage)).reduce((s,a)=>s+a.value,0);
  const paidVal = acts.filter(a => a.stage === 'paid').reduce((s,a)=>s+a.value,0);
  // Collection rate = collected ÷ (collected + invoiced) — % of closed deals that actually paid
  const collectRate = Math.round(acts.filter(a=>a.stage==='paid').length / Math.max(acts.filter(a=>['won','paid'].includes(a.stage)).length, 1) * 100);
  const paidCount = acts.filter(a=>a.paid==='Paid').length;

  const km = [
    { l:'Total revenue',  v: egp(paidVal),        sub:'Closed-won this period', delta:'+22%', good:true,  accent:true },
    { l:'Open pipeline',  v: egp(pipelineVal),   sub:'New business',            delta:'+14%', good:true },
    { l:'Collect rate',   v: collectRate + '%',  sub:'Collected ÷ invoiced',      delta:'+4pp', good:true },
    { l:'Active customers', v: '' + paidCount,   sub:'Paying employers',        delta:'+3',   good:true },
    { l:'Avg deal size',  v: egp(Math.round(wonVal / Math.max(acts.filter(a=>a.stage==='won').length, 1))), sub:'Won deals',      delta:'+8%',  good:true },

  const kmCards = km.map(k => '<div style="position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;box-shadow:var(--sh1);">'

    + '<div style="display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap;">'
      + '<span class="tnum" style="font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.05;">'+k.v+'</span>'

    + '<div style="font-size:11px;color:var(--text-3);font-weight:600;margin-top:3px;">'+k.sub+'</div>'
  + '</div>').join('');

  // Stage summary table
  const stageTable = ['mql','demo','proposal','won','lost'].map(sk => {

    const sum = rows.reduce((s,a)=>s+a.value,0);
    const avg = rows.length ? Math.round(sum/rows.length) : 0;
    return '<div style="display:grid;grid-template-columns:1.4fr 80px 140px 140px 140px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);">'
      + '<span style="'+chip(st.v)+'">'+st.label+'</span>'
      + '<span class="tnum" style="font-size:13px;font-weight:700;text-align:right;">'+rows.length+'</span>'
      + '<span class="tnum" style="font-size:13px;font-weight:700;text-align:right;color:var(--text);">'+egp(sum)+'</span>'
      + '<span class="tnum" style="font-size:12px;text-align:right;color:var(--text-2);">'+egp(avg)+'</span>'
      + '<span class="tnum" style="font-size:12px;text-align:right;color:var(--text-3);">~' + ({mql:5,demo:9,proposal:14,won:0,lost:0}[sk]) + 'd</span>'
    + '</div>';
  }).join('');

    + ['Stage','Count','Value','Avg deal','Avg time in stage'].map((l,i) => '<span style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);font-weight:800;'+(i>0?'text-align:right;':'')+'">'+l+'</span>').join('')
  + '</div>';

  // AM leaderboard mini

  + '</div>';

  return '<div class="sc" style="padding:20px 28px 80px;display:flex;flex-direction:column;gap:18px;">'
    + '<div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;">'
      + '<div><h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;">Reports</h1>'
        + '<div style="font-size:13px;color:var(--text-3);font-weight:500;margin-top:4px;">Cross-team performance — pipeline health, revenue, retention.</div>'
      + '</div><div style="flex:1;"></div>'
      + '<select style="height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);"><option>This Month</option><option>This Quarter</option><option>This Year</option></select>'
      + '<select style="height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);"><option>All AMs</option>'+AMS.map(a=>'<option>'+esc(a.name)+'</option>').join('')+'</select>'
      + '<button onclick="toast(\'Export PDF — coming Phase 5\')" style="display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--accent-strong);">📄 Export PDF</button>'
    + '</div>'
    + '<div><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><h2 style="margin:0;font-size:17px;font-weight:800;letter-spacing:-.015em;">Key metrics</h2><span style="font-size:11.5px;color:var(--text-3);font-weight:600;">Last 30 days</span></div>'
      + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">'+kmCards+'</div>'
    + '</div>'
    + '<div><h2 style="margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:-.015em;">Pipeline health</h2>'
      + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--sh1);">'
        + '<div style="padding:14px 18px 10px;border-bottom:1px solid var(--border);"><div style="font-size:13px;font-weight:800;">Stage summary</div><div style="font-size:11.5px;color:var(--text-3);font-weight:600;">Counts, value and time-in-stage.</div></div>'
        + stageHead + stageTable
      + '</div>'
    + '</div>'
    + '<div><h2 style="margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:-.015em;">Team leaderboard</h2>'
      + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--sh1);">'+amHead + amTable+'</div>'

function renderLogs(){
  let logs;
  if (LIVE_LOGS && LIVE_LOGS.length){
    const accById = new Map((accts()||[]).map(a => [a.id, a]));
    const now = Date.now();
    const timeAgoLog = (iso) => {
      if (!iso) return '';
      const d = Date.parse(iso); if (isNaN(d)) return '';
      const s = (now - d) / 1000;
      if (s < 60) return 'just now';
      if (s < 3600) return Math.round(s/60) + 'm ago';
      if (s < 86400) return Math.round(s/3600) + 'h ago';
      if (s < 86400*7) return Math.round(s/86400) + 'd ago';
      return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
    };
    logs = LIVE_LOGS.map(row => {
      const acct = accById.get(row.account_id);
      const author = LIVE_AMS?.find(x => x.id === row.author_id);
      const kind = row.type === 'stage' ? 'stage' : row.type === 'note' ? 'note' : row.type === 'task' ? 'task' : row.type === 'meeting' || row.type === 'call' || row.type === 'email' ? 'activity' : 'note';
      const body = row.text || row.title || (row.from_stage && row.to_stage ? '' : '(no content)');

        kind,
        acct: acct?.name || '(unknown account)',
        acctId: acct?.id || null,
        from: row.from_stage || null,

        user: author?.name || 'Unknown',
        when: timeAgoLog(row.created_at),

    });

    logs = [

function setUtmField(k, v){ state[k] = v; render(); }
function buildUtm(){
  const s = state;
  const base = (s.utmBase || 'https://recruitera.ai/').trim();
  const params = [];
  if (s.utmSource)   params.push('utm_source='+encodeURIComponent(s.utmSource));
  if (s.utmMedium)   params.push('utm_medium='+encodeURIComponent(s.utmMedium));
  if (s.utmCampaign) params.push('utm_campaign='+encodeURIComponent(s.utmCampaign));
  if (s.utmContent)  params.push('utm_content='+encodeURIComponent(s.utmContent));
  return params.length ? base + (base.includes('?')?'&':'?') + params.join('&') : base;
}
function copyUtm(){
  const url = buildUtm();
  navigator.clipboard.writeText(url).then(() => toast('Copied UTM link'));
}
function applyPreset(source, medium){ setState({ utmSource: source, utmMedium: medium }); }
Object.assign(window, { setUtmField, copyUtm, applyPreset });

        + (k.accent ? '<div style="position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);"></div>' : '')
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><div style="'+kpiIcon(k.v2)+'">'+k.icon+'</div><span style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:800;">'+k.l+'</span></div>'
        + '<div class="tnum" style="font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1;">'+k.v+'</div>'
        + '<div style="font-size:11px;color:var(--text-3);font-weight:600;margin-top:4px;">'+k.sub+'</div>'
      + '</div>').join('')
  + '</div>';

  // AM rows synthesized from AMS + owned accounts
  const rows = AMS.map(am => {
    const owned = acts.filter(a => a.am === am.id);
    const calls = 4 + Math.round(am.weight * 0.6);
    const emails = 6 + Math.round(am.weight * 0.9);
    const wa = 2 + Math.round(am.weight * 0.4);
    const deals = owned.filter(a => ['proposal','won'].includes(a.stage)).length;
    // Phase D: AM target is now collections (stage='paid'), not just Paid billing status
    const invoices = owned.filter(a => a.stage === 'paid').length;
    const invoiced_not_collected = owned.filter(a => a.stage === 'won').length;
    const gaps = owned.filter(a => a.last && a.last.includes('d ago') && parseInt(a.last) >= 4).length;
    const score = Math.min(100, Math.round(am.cap * 100));
    const status = score >= 70 ? { label:'Top Performer', v:'ok' } : score >= 40 ? { label:'Average', v:'warn' } : { label:'Needs Attention', v:'bad' };
    return { am, calls, emails, wa, deals, invoices, gaps, score, status, owned: owned.length };
  }).sort((a,b) => b.score - a.score);

  const cellStyle = (v, warn) => 'display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:24px;padding:0 8px;border-radius:6px;background:'+(v===0?'var(--surface-2)':warn?'var(--warn-bg)':'var(--surface-2)')+';color:'+(v===0?'var(--text-4)':warn?'var(--warn)':'var(--text)')+';font-size:12.5px;font-weight:700;border:1px solid var(--border);';

  const tableHead = '<div style="display:grid;grid-template-columns:2.2fr 80px 90px 100px 110px 100px 90px 180px 130px 110px;gap:10px;align-items:center;padding:14px 18px;min-width:1280px;background:var(--surface-2);border-bottom:1px solid var(--border);">'
    + ['Account Manager','Calls','Emails','WhatsApp','Deals moved','Collected','Gaps','Score','Status','Action'].map((l,i) => {
        const align = i===0 ? '' : i===9 ? 'text-align:right;' : 'text-align:center;';
        const color = l === 'Gaps' ? 'var(--bad)' : 'var(--text-2)';
        return '<div style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:'+color+';'+align+'">'+l+'</div>';
      }).join('')
  + '</div>';

  const rowsHtml = rows.map(r => {
    const barColor = r.score >= 70 ? 'var(--ok)' : r.score >= 40 ? 'var(--warn)' : 'var(--bad)';
    return '<div class="row-h" style="display:grid;grid-template-columns:2.2fr 80px 90px 100px 110px 100px 90px 180px 130px 110px;gap:10px;align-items:center;padding:14px 18px;min-width:1280px;border-bottom:1px solid var(--border);cursor:pointer;">'
      + '<div style="display:flex;align-items:center;gap:12px;min-width:0;">'
        + '<div style="'+avatar(r.am.initials,34,r.am.initials)+'">'+r.am.initials+'</div>'
        + '<div style="min-width:0;">'
          + '<div style="font-size:14px;font-weight:800;letter-spacing:-.01em;">'+esc(r.am.name)+'</div>'
          + '<div class="tnum" style="font-size:11.5px;color:var(--text-3);font-weight:600;">'+r.owned+' owned</div>'
        + '</div>'
      + '</div>'
      + '<div style="text-align:center;"><span class="tnum" style="'+cellStyle(r.calls)+'">'+r.calls+'</span></div>'
      + '<div style="text-align:center;"><span class="tnum" style="'+cellStyle(r.emails)+'">'+r.emails+'</span></div>'
      + '<div style="text-align:center;"><span class="tnum" style="'+cellStyle(r.wa)+'">'+r.wa+'</span></div>'
      + '<div style="text-align:center;"><span class="tnum" style="'+cellStyle(r.deals)+'">'+r.deals+'</span></div>'
      + '<div style="text-align:center;"><span class="tnum" style="'+cellStyle(r.invoices)+'">'+r.invoices+'</span></div>'
      + '<div style="text-align:center;"><span class="tnum" style="'+cellStyle(r.gaps, r.gaps>0)+'">'+r.gaps+'</span></div>'
      + '<div style="display:flex;align-items:center;gap:10px;">'
        + '<div style="flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);"><div style="height:100%;width:'+r.score+'%;background:'+barColor+';border-radius:999px;"></div></div>'
        + '<span class="tnum" style="font-size:13px;font-weight:800;width:30px;text-align:right;">'+r.score+'</span>'
      + '</div>'
      + '<div><span style="'+chip(r.status.v)+'">'+r.status.label+'</span></div>'
      + '<div style="text-align:right;"><span onclick="toast(\'Drill-down '+esc(r.am.name)+' — coming Phase 4\')" style="font-size:12.5px;color:var(--accent-ink);font-weight:700;cursor:pointer;text-decoration:underline;">View details</span></div>'
    + '</div>';
  }).join('');

  const table = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--sh1);">'
    + '<div class="sc" style="overflow-x:auto;">' + tableHead + rowsHtml + '</div>'
  + '</div>';

  const subtabs = '<div style="display:flex;gap:0;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;">'
    + ['Team Performance','All Activities','Targets','Leaderboard','Gaps'].map((l,i) => {
        const active = i === 0;
        return '<div style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;font-size:13px;font-weight:'+(active?800:600)+';color:'+(active?'var(--text)':'var(--text-3)')+';margin-bottom:-1px;border-bottom:2px solid '+(active?'var(--cg-900)':'transparent')+';cursor:pointer;">'+l+'</div>';
      }).join('')
  + '</div>';

  const filters = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;">'
    + '<span style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;">Filter</span>'
    + '<select style="height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);"><option>All AMs</option>'+AMS.map(a=>'<option>'+esc(a.name)+'</option>').join('')+'</select>'
    + '<select style="height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);"><option>This Week</option><option>Today</option><option>This Month</option></select>'
    + '<select style="height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);"><option>All status</option><option>Top Performer</option><option>Average</option><option>Needs Attention</option></select>'
    + '<div style="flex:1;"></div><span class="tnum" style="font-size:13px;color:var(--text-3);font-weight:700;">'+rows.length+' AMs shown</span>'
  + '</div>';

  return '<div class="sc" style="padding:20px 28px 56px;display:flex;flex-direction:column;gap:18px;">'
    + '<div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;">'
      + '<div><h1 style="margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em;">AM Performance</h1>'
        + '<div style="font-size:13px;color:var(--text-3);font-weight:500;margin-top:4px;">Team activity, scoring &amp; daily drill-down.</div>'
      + '</div><div style="flex:1;"></div>'
      + '<button onclick="toast(\'Export CSV — coming Phase 5\')" style="display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--accent-strong);">↓ Export CSV</button>'
    + '</div>'
    + subtabs + filters + kpiCards + table
  + '</div>';
}

// =========================================================================
//   RENDER: COMPANY PROFILE → ACTIVITY TAB (live activities timeline)
// =========================================================================
function renderActivityTimeline(a){
  const loaded = LIVE_ACTIVITIES_BY_ACCT.has(a.id);
  const acts = loaded ? (LIVE_ACTIVITIES_BY_ACCT.get(a.id) || []) : [];

  // Loading / empty states
  if (state.dataSource === 'live' && !loaded) {
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:600;">Loading activity…</div>'
    + '</div>';
  }
  if (acts.length === 0) {
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:inline-grid;place-items:center;color:var(--text-3);margin-bottom:14px;">'+svg('logs',20,1.5)+'</div>'
      + '<div style="font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;">No activity yet</div>'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:500;max-width:420px;margin:0 auto;">Notes, calls, meetings, stage changes and tasks will appear here as they happen on this account.</div>'
    + '</div>';
  }

  // Type presentation map
  const typeMeta = {
    note:    { label:'Note',          icon:'📝', bg:'var(--accent-soft)',   fg:'var(--accent-ink)' },
    call:    { label:'Call',          icon:'📞', bg:'var(--info-bg)',       fg:'var(--info)'       },
    email:   { label:'Email',         icon:'✉',  bg:'var(--surface-2)',     fg:'var(--text-2)'     },
    meeting: { label:'Meeting',       icon:'👥', bg:'var(--purple-100)',    fg:'var(--purple-700)' },
    task:    { label:'Task',          icon:'✓',  bg:'var(--warn-bg)',       fg:'var(--warn)'       },
    stage:   { label:'Stage change',  icon:'⇄',  bg:'var(--ok-bg)',         fg:'var(--ok)'         },
    file:    { label:'File',          icon:'📄', bg:'var(--surface-2)',     fg:'var(--text-2)'     },
  };

  const timeStr = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true });
  };
  const dayKey = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return 'Unknown';
    const today = new Date(); today.setHours(0,0,0,0);
    const t = new Date(d);   t.setHours(0,0,0,0);
    const diff = Math.round((today - t) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7)   return diff + ' days ago';
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year: (t.getFullYear() !== today.getFullYear()) ? 'numeric' : undefined });
  };

  // Sort newest first
  const sorted = acts.slice().sort((x,y) => Date.parse(y.created_at||0) - Date.parse(x.created_at||0));
  // Group by day bucket
  const groups = [];
  let currentKey = null;
  for (const act of sorted) {
    const k = dayKey(act.created_at);
    if (k !== currentKey) { groups.push({ day: k, items: [] }); currentKey = k; }
    groups[groups.length-1].items.push(act);
  }

  const renderBody = (act) => {
    const t = act.type;
    if (t === 'stage' && act.from_stage && act.to_stage) {
      const from = STAGE[act.from_stage] || { label: act.from_stage, v:'neutral' };
      const to   = STAGE[act.to_stage]   || { label: act.to_stage,   v:'neutral' };
      return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--text-2);font-weight:500;">'
        + 'Moved <span style="'+chip(from.v)+'">'+from.label+'</span>'
        + '<span style="color:var(--text-3);">→</span>'
        + '<span style="'+chip(to.v)+'">'+to.label+'</span>'
      + '</div>';
    }
    if (t === 'task') {
      const done = act.task_done;
      const due  = act.task_due_date ? new Date(act.task_due_date).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : null;
      return '<div>'
        + '<div style="font-size:13.5px;font-weight:700;color:'+(done?'var(--text-3)':'var(--text)')+';text-decoration:'+(done?'line-through':'none')+';line-height:1.4;">'+esc(act.title || act.text || '(untitled task)')+'</div>'
        + (due ? '<div style="font-size:11.5px;color:'+(done?'var(--text-4)':'var(--warn)')+';font-weight:700;margin-top:4px;">'+(done?'✓ Completed':'Due '+due)+'</div>' : '')
      + '</div>';
    }
    if (t === 'meeting') {
      const start = act.meeting_start_at ? new Date(act.meeting_start_at) : null;
      const startLabel = start ? start.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}) : '';
      return '<div>'
        + (act.title ? '<div style="font-size:13.5px;font-weight:700;line-height:1.4;">'+esc(act.title)+'</div>' : '')
        + (startLabel ? '<div style="font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:3px;">'+startLabel+(act.meeting_kind?' · '+esc(act.meeting_kind):'')+'</div>' : '')
        + (act.text ? '<div style="font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word;">'+esc(act.text)+'</div>' : '')
      + '</div>';
    }
    if (t === 'call') {
      const dir = act.call_direction ? act.call_direction : '';
      const dur = act.call_duration_minutes ? act.call_duration_minutes + 'm' : '';
      const meta = [dir, dur].filter(Boolean).join(' · ');
      return '<div>'
        + (act.title ? '<div style="font-size:13.5px;font-weight:700;line-height:1.4;">'+esc(act.title)+'</div>' : '')
        + (meta ? '<div style="font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:3px;text-transform:capitalize;">'+esc(meta)+'</div>' : '')
        + (act.text ? '<div style="font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word;">'+esc(act.text)+'</div>' : '')
      + '</div>';
    }
    // note / email / default
    return '<div>'
      + (act.title ? '<div style="font-size:13.5px;font-weight:700;line-height:1.4;">'+esc(act.title)+'</div>' : '')
      + (act.text ? '<div style="font-size:12.5px;color:var(--text-2);margin-top:'+(act.title?'6px':'0')+';line-height:1.55;white-space:pre-wrap;word-break:break-word;">'+esc(act.text)+'</div>' : '')
    + '</div>';
  };

  const renderItem = (act) => {
    const meta = typeMeta[act.type] || typeMeta.note;
    const author = LIVE_AMS?.find(x => x.id === act.author_id);
    const authorName = author ? author.name : 'System';
    const authorInits = author ? author.initials : '·';
    return '<div style="display:flex;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh1);">'
      + '<div style="width:36px;height:36px;border-radius:10px;background:'+meta.bg+';color:'+meta.fg+';display:grid;place-items:center;font-size:15px;flex-shrink:0;">'+meta.icon+'</div>'
      + '<div style="flex:1;min-width:0;">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;">'
          + '<span style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:'+meta.fg+';font-weight:800;">'+meta.label+'</span>'
          + '<span style="font-size:11.5px;color:var(--text-3);font-weight:600;">'+esc(authorName)+'</span>'
          + '<span style="font-size:11.5px;color:var(--text-4);font-weight:500;">·</span>'
          + '<span class="tnum" style="font-size:11.5px;color:var(--text-3);font-weight:600;">'+timeStr(act.created_at)+'</span>'
        + '</div>'
        + renderBody(act)
      + '</div>'
    + '</div>';
  };

  const totalCount = sorted.length;

  return '<div style="display:flex;flex-direction:column;gap:20px;">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;">'
      + '<h2 style="margin:0;font-size:17px;font-weight:800;letter-spacing:-.015em;">Activity timeline</h2>'
      + '<span class="tnum" style="font-size:12px;color:var(--text-3);font-weight:700;">'+totalCount+' event'+(totalCount>1?'s':'')+'</span>'
    + '</div>'
    + groups.map(g =>
        '<div style="display:flex;flex-direction:column;gap:10px;">'
          + '<div style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:800;padding:0 4px;">'+esc(g.day)+'</div>'
          + g.items.map(renderItem).join('')
        + '</div>'
      ).join('')
  + '</div>';
}

// =========================================================================
//   RENDER: COMPANY PROFILE → PLANS & CREDITS TAB
