// FX rates to EGP. Update the USD row when the CBE rate moves — everything else
// (Deal value in header, kanban ACV totals, dashboard KPIs) recomputes from
// contract_cycles.value × this table when the cycle is priced in a non-EGP
// currency. Missing currencies fall through to 1.0 (treated as EGP).
const FX_TO_EGP = { EGP: 1, USD: 49.43, EUR: 53.0, SAR: 13.15 };
function toEgp(value, currency){
  const n = Number(value) || 0;
  if (!n) return 0;
  const rate = FX_TO_EGP[(currency || 'EGP').toUpperCase()] || 1;
  return n * rate;
}
const SB_AUTH_KEY = 'sb-rtdrlpnfqjtwtsrwnifn-auth-token';

function getAccessToken(){
  try{
    const raw = localStorage.getItem(SB_AUTH_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    const session = parsed?.currentSession || parsed;
    const token = session?.access_token;
    if(!token) return null;
    let exp = session?.expires_at;
    if(!exp){ try{ exp = JSON.parse(atob(token.split('.')[1]))?.exp; }catch{} }
    if(!exp) return null;
    if(Date.now()/1000 >= exp - 60){ localStorage.removeItem(SB_AUTH_KEY); return null; }
    return token;
  }catch{ return null; }
}

function photoUrl(key){ const n = PHOTOS[key]; return n ? 'https://i.pravatar.cc/160?img=' + n : null; }
// Warm the browser image cache once per unique URL. render() re-creates the
// <img> element on every paint; without this warm-up the browser still hits
// its HTTP cache but flashes the placeholder before decode completes. A
// hidden persistent host (#img-cache) holds a reference to every URL we've
// ever asked for so the decoded bitmap stays warm.
const IMG_PRELOADED = new Set();
function preloadImage(url){
  if (!url || IMG_PRELOADED.has(url)) return;
  IMG_PRELOADED.add(url);
  let host = document.getElementById('img-cache');
  if (!host) {
    host = document.createElement('div');
    host.id = 'img-cache';
    host.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;';
    (document.body || document.documentElement).appendChild(host);
  }
  const img = new Image();
  img.decoding = 'async';
  img.loading = 'eager';
  img.src = url;
  host.appendChild(img);
}
function preloadPeoplePhotos(){
  if (!LIVE_AMS) return;
  for (const p of LIVE_AMS) if (p.avatar_url) preloadImage(p.avatar_url);
}
// Live photo lookup: LIVE_AMS profiles carry avatar_url from Supabase Storage.

function liveAvatarUrl(person){
  if (!person) return null;
  if (typeof person === 'string') {
    if (LIVE_AMS) {
      const p = LIVE_AMS.find(x => x.id === person || x.initials === person);
      if (p?.avatar_url) return p.avatar_url;
    }
    return null;
  }
  return person.avatar_url || null;
}

  return 'width:'+s+'px;height:'+s+'px;border-radius:999px;background:linear-gradient(135deg,var(--purple-700),#6C56D9);color:#fff;display:grid;place-items:center;font-weight:700;font-size:'+Math.round(s*0.38)+'px;flex-shrink:0;';

const LOGO_DOMAIN_CACHE = new Map();  // name(lower) -> domain string | null
const LOGO_DOMAIN_INFLIGHT = new Set();
function resolveDomainByName(name){
  const key = (name || '').trim().toLowerCase();
  if (!key || key.length < 3) return null;
  if (LOGO_DOMAIN_CACHE.has(key)) return LOGO_DOMAIN_CACHE.get(key);
  if (LOGO_DOMAIN_INFLIGHT.has(key)) return null;
  LOGO_DOMAIN_INFLIGHT.add(key);
  // Clearbit's public autocomplete — no auth, free, returns [{name,domain,logo}].
  fetch('https://autocomplete.clearbit.com/v1/companies/suggest?query=' + encodeURIComponent(name))

// Every top-level page has a slug used in the URL as ?view=<slug>. Same
// pattern as /crm (crm?view=forecast). Keeps back/forward working and
// makes every tab shareable.
const PAGE_TO_VIEW = {
  home:'dashboard', accounts:'companies', pipeline:'pipeline', renewal:'renewal',
  notifications:'notifications', tasks:'tasks', amperf:'amperf', reports:'reports',
  logs:'logs', users:'users', utm:'utm',

const VIEW_TO_PAGE = Object.fromEntries(Object.entries(PAGE_TO_VIEW).map(([k,v]) => [v,k]));
function pushPageUrl(page){
  try {
    const url = new URL(location.href);
    // Nav also drops ?detail= — you're leaving the profile.
    url.searchParams.delete('detail');
    const view = PAGE_TO_VIEW[page];
    if (view) url.searchParams.set('view', view);
    else url.searchParams.delete('view');
    history.pushState({ page, detailId: null }, '', url.pathname + (url.search ? url.search : ''));
  } catch {}
}
function go(page){

window.addEventListener('popstate', () => {
  // Rebuild state from whatever the URL currently says. History entries can be
  // stale (missing state, mid-migration), so ?view= and ?detail= win.
  try {
    const qs = new URLSearchParams(location.search);
    const view = qs.get('view');

async function loadDetailsForAccount(accountId){

async function submitCycle(){
  const s = state;
  const f = s.cycleForm || {};
  if (!f.plan_tier || !f.started_at || !f.ends_at) {
    setState({ cycleModalError: 'Plan tier, term start, and term end are required' });
    return;
  }
  const token = getAccessToken();
  if (!token) { toast('Login required to save cycle'); return; }
  state.cycleModalStatus = 'submitting';
  render();
  const headers = {
    apikey: SB_KEY,
    Authorization: 'Bearer ' + token,
    'Content-Type': 'application/json',
    Prefer: 'return=representation',
  };
  const payload = {
    account_id:   s.cycleModalAccountId,
    plan_tier:    f.plan_tier,
    value:        f.value ? Number(f.value) : null,
    currency:     f.currency || 'EGP',
    started_at:   f.started_at,
    ends_at:      f.ends_at,
    status:       f.status,
    auto_renew:   !!f.auto_renew,
    payment_type: f.payment_type || null,
    notes:        f.notes || null,
  };
  try {
    let res;
    if (s.cycleModalMode === 'edit' && f.id) {
      res = await fetch(SB_URL + '/rest/v1/contract_cycles?id=eq.' + encodeURIComponent(f.id), {
        method: 'PATCH', headers, body: JSON.stringify(payload),
      });
    } else {
      // New cycle: pick the next cycle_number for this account
      const existing = LIVE_DETAILS_BY_ACCT.get(s.cycleModalAccountId)?.cycles || [];
      const maxN = existing.reduce((m,c) => Math.max(m, c.cycle_number || 0), 0);
      payload.cycle_number = maxN + 1;
      res = await fetch(SB_URL + '/rest/v1/contract_cycles', {
        method: 'POST', headers, body: JSON.stringify(payload),
      });
    }
    if (!res.ok) {
      const t = await res.text();
      throw new Error('Supabase ' + res.status + ': ' + t.slice(0, 180));
    }
    // If this modal was opened by a stage → won intercept, patch the account
    // stage + deal_value in the same round-trip so the pipeline reflects it.
    if (s.cycleModalStageAfter) {
      const dv = f.deal_value_egp ? Number(f.deal_value_egp) : (payload.value ? toEgp(payload.value, payload.currency) : null);
      const body = { stage: s.cycleModalStageAfter };
      if (dv != null && !isNaN(dv)) body.deal_value = dv;
      const patchRes = await fetch(SB_URL + '/rest/v1/accounts?id=eq.' + encodeURIComponent(s.cycleModalAccountId), {
        method: 'PATCH',
        headers: Object.assign({}, headers, { Prefer:'return=minimal' }),
        body: JSON.stringify(body),
      });
      if (!patchRes.ok) throw new Error('Stage/deal-value save ' + patchRes.status);
    }
    // Refresh cycles for this account so the tab reflects the write
    LIVE_DETAILS_BY_ACCT.delete(s.cycleModalAccountId);
    LIVE_CYCLES_BY_ACCT?.delete?.(s.cycleModalAccountId);
    await loadDetailsForAccount(s.cycleModalAccountId);
    await refreshAccountRow(s.cycleModalAccountId);
    const wasWonFlow = s.cycleModalStageAfter === 'won';
    state.cycleModalOpen = false;
    state.cycleModalStageAfter = null;
    state.cycleModalStatus = 'done';
    render();
    toast(wasWonFlow ? 'Deal won · cycle added' : (s.cycleModalMode === 'edit' ? 'Cycle updated' : 'Cycle added'));
  } catch (e) {
    console.error('[CRM v2] cycle save failed:', e);
    state.cycleModalStatus = 'error';
    state.cycleModalError = String(e.message || e);
    render();
  }
}

async function _writeStage(accountId, newStage, extra){

  const prev = acct.stage;
  const prevReason = acct._lostReason;
  const prevDetail = acct._lostDetail;
  acct.stage = newStage;
  if (extra && 'lost_reason' in extra) acct._lostReason = extra.lost_reason;
  if (extra && 'lost_detail' in extra) acct._lostDetail = extra.lost_detail;
  render();
  const token = getAccessToken();
  if (!token) { acct.stage = prev; acct._lostReason = prevReason; acct._lostDetail = prevDetail; render(); toast('Login required'); return; }
  try {
    const res = await fetch(SB_URL + '/rest/v1/accounts?id=eq.' + encodeURIComponent(accountId), {
      method: 'PATCH',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type':'application/json', Prefer:'return=minimal' },
      body: JSON.stringify(Object.assign({ stage: newStage }, extra || {})),
    });
    if (!res.ok) throw new Error('Stage ' + res.status);
    toast(newStage === 'lost' ? ('Lost · ' + (extra && extra.lost_reason || 'reason set')) : ('Stage → ' + (STAGE[newStage] && STAGE[newStage].label || newStage)));
  } catch (e) {

function setComposerText(v){
  state.composerText = v;
  const el = document.getElementById('composer-textarea');
  const caret = el ? el.selectionStart : v.length;
  const upTo = v.slice(0, caret);
  const m = upTo.match(/@([A-Za-z0-9_.\-]*)$/);
  if (m) {
    state.composerMention = { open: true, query: m[1].toLowerCase(), anchor: caret - m[1].length - 1 };
  } else if (state.composerMention && state.composerMention.open) {
    state.composerMention = { open: false, query: '', anchor: 0 };
  }
  render();
  setTimeout(() => { const t = document.getElementById('composer-textarea'); if (t) { t.focus(); t.setSelectionRange(caret, caret); } }, 0);
}
function insertMention(name){
  const el = document.getElementById('composer-textarea');
  const v = state.composerText || '';
  const anchor = state.composerMention?.anchor ?? v.length;
  const caret = el ? el.selectionStart : v.length;
  const before = v.slice(0, anchor);
  const after  = v.slice(caret);
  const token = '@' + name.replace(/\s+/g, '') + ' ';
  const next = before + token + after;
  state.composerText = next;
  state.composerMention = { open: false, query: '', anchor: 0 };
  render();
  const newCaret = (before + token).length;
  setTimeout(() => { const t = document.getElementById('composer-textarea'); if (t) { t.focus(); t.setSelectionRange(newCaret, newCaret); } }, 0);
}
async function submitComposerNote(accountId){
  const text = (state.composerText || '').trim();
  if (!text) { toast('Write something first'); return; }
  const kind = state.composerKind || 'call';
  const typeMap = { call:'call', email:'email', whatsapp:'note' };
  const activityType = typeMap[kind] || 'note';
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  const mentions = Array.from(new Set((text.match(/@([A-Za-z0-9_.\-]+)/g) || []).map(x => x.slice(1))));
  const body = {
    account_id: accountId,
    type: activityType,
    text,
    mentions,
  };
  if (kind === 'whatsapp') body.email_subject = 'WhatsApp';
  try {
    const res = await fetch(SB_URL + '/rest/v1/activities', {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type':'application/json', Prefer:'return=representation' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Activity ' + res.status + ': ' + (await res.text()).slice(0,140));
    state.composerText = '';
    state.composerMention = { open: false, query: '', anchor: 0 };
    LIVE_ACTIVITIES_BY_ACCT.delete(accountId);
    await loadDetailsForAccount(accountId);
    render();
    toast('Note added');
  } catch (e) {
    toast('Note failed: ' + (e.message || e));
  }
}
Object.assign(window, { setComposerKind, setComposerText, insertMention, submitComposerNote });

async function addAccountTag(accountId){
  const label = (prompt('Tag label') || '').trim();
  if (!label) return;
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type':'application/json' };
  try {
    const findRes = await fetch(SB_URL + '/rest/v1/tags?select=id,label,color&label=eq.' + encodeURIComponent(label) + '&limit=1', { headers });
    let tag = findRes.ok ? (await findRes.json())[0] : null;
    if (!tag) {
      const insRes = await fetch(SB_URL + '/rest/v1/tags', {
        method: 'POST',
        headers: Object.assign({}, headers, { Prefer:'return=representation' }),
        body: JSON.stringify({ label, color: '#6b7280', is_preset: false }),
      });
      if (!insRes.ok) throw new Error('Tag ' + insRes.status);
      tag = (await insRes.json())[0];
    }
    const linkRes = await fetch(SB_URL + '/rest/v1/account_tags', {
      method: 'POST',
      headers: Object.assign({}, headers, { Prefer:'resolution=ignore-duplicates' }),
      body: JSON.stringify({ account_id: accountId, tag_id: tag.id }),
    });
    if (!linkRes.ok && linkRes.status !== 409) throw new Error('Link ' + linkRes.status);
    LIVE_DETAILS_BY_ACCT.delete(accountId);
    await loadDetailsForAccount(accountId);
    render();
    toast('Tag added');
  } catch (e) { toast('Tag failed: ' + (e.message || e)); }
}
async function removeAccountTag(accountId, tagId){
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    const res = await fetch(SB_URL + '/rest/v1/account_tags?account_id=eq.' + encodeURIComponent(accountId) + '&tag_id=eq.' + encodeURIComponent(tagId), {
      method: 'DELETE',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token },

    LIVE_DETAILS_BY_ACCT.delete(accountId);
    await loadDetailsForAccount(accountId);
    render();
  } catch (e) { toast('Untag failed: ' + (e.message || e)); }
}

async function deleteAccount(accountId){

  const label = a.name || 'this account';
  const ok = confirm('Delete "' + label + '"?\n\nThis permanently removes the account plus any linked contacts, activities, cycles, tags and documents. This cannot be undone.');

async function deleteCycle(accountId, cycleId){
  if (!cycleId) { toast('Cycle id missing'); return; }
  if (!confirm('Delete this contract cycle?\n\nRenewal bucket and deal-value fallbacks recompute from the remaining cycles.')) return;
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }

    LIVE_DETAILS_BY_ACCT.delete(accountId);
    LIVE_CYCLES_BY_ACCT?.delete?.(accountId);
    await loadDetailsForAccount(accountId);
    await refreshAccountRow(accountId);
    render();
    toast('Cycle deleted');
  } catch (e) { toast('Delete failed: ' + (e.message || e)); }
}
// Re-fetch a single account row + its cycles, then re-run mapAcctFromSupabase
// so downstream fields (ren bucket, end, value, plan) recompute in place.
// Used after any cycle mutation so the Renewal Pipeline doesn't cling to
// stale bucket assignments.
async function refreshAccountRow(accountId){
  const token = getAccessToken();
  if (!token) return;
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  try {
    const [rawArr, cycArr] = await Promise.all([
      fetch(SB_URL + '/rest/v1/accounts?select=*&id=eq.' + encodeURIComponent(accountId), { headers }).then(r => r.ok ? r.json() : []),
      fetch(SB_URL + '/rest/v1/contract_cycles?select=account_id,status,plan_tier,value,currency,ends_at,cycle_number&account_id=eq.' + encodeURIComponent(accountId) + '&order=cycle_number.desc', { headers }).then(r => r.ok ? r.json() : []),
    ]);
    if (LIVE_CYCLES_BY_ACCT) {
      LIVE_CYCLES_BY_ACCT.delete(accountId);
      const top = cycArr && cycArr[0];
      if (top) LIVE_CYCLES_BY_ACCT.set(accountId, { plan: top.plan_tier, value: top.value, currency: top.currency || 'EGP', ends_at: top.ends_at, status: top.status });
    }
    if (rawArr && rawArr[0]) {
      const list = state.accounts || [];
      const idx = list.findIndex(x => x.id === accountId);
      const mapped = mapAcctFromSupabase(rawArr[0], idx >= 0 ? idx : 0);
      if (idx >= 0) list[idx] = mapped; else list.push(mapped);
    }
  } catch (e) { console.warn('[CRM v2] refreshAccountRow failed:', e.message); }
}
Object.assign(window, { deleteCycle });

// ---------- DOCUMENT UPLOAD / DOWNLOAD / DELETE ----------
async function triggerDocUpload(accountId){
  // Uses a hidden file input approach: create → click → wait for change → upload
  const input = document.createElement('input');
  input.type = 'file';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    document.body.removeChild(input);
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { toast('File too large — 25 MB max'); return; }
    const token = getAccessToken();
    if (!token) { toast('Login required'); return; }
    const safe = file.name.replace(/[^\w.\-]+/g, '_');
    const docId = (crypto.randomUUID && crypto.randomUUID()) || ('d_' + Math.random().toString(36).slice(2));
    const path = accountId + '/' + docId + '-' + safe;
    toast('Uploading ' + file.name + '…');
    try {
      // 1. Upload the file to storage
      const up = await fetch(SB_URL + '/storage/v1/object/account-docs/' + encodeURI(path), {
        method: 'POST',
        headers: {
          apikey: SB_KEY,
          Authorization: 'Bearer ' + token,
          'Content-Type': file.type || 'application/octet-stream',
          'x-upsert': 'false',
        },
        body: file,
      });
      if (!up.ok) throw new Error('Storage ' + up.status + ': ' + (await up.text()).slice(0, 180));
      // 2. Insert metadata row
      const ins = await fetch(SB_URL + '/rest/v1/account_documents', {
        method: 'POST',
        headers: {
          apikey: SB_KEY,
          Authorization: 'Bearer ' + token,
          'Content-Type': 'application/json',
          Prefer: 'return=representation',
        },
        body: JSON.stringify({
          id: docId,
          account_id: accountId,
          storage_path: path,
          file_name: file.name,
          mime_type: file.type || null,
          size_bytes: file.size,
        }),
      });
      if (!ins.ok) {
        // Metadata failed — clean up the orphan storage object
        await fetch(SB_URL + '/storage/v1/object/account-docs/' + encodeURI(path), {
          method: 'DELETE',
          headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token },
        });
        throw new Error('Metadata ' + ins.status + ': ' + (await ins.text()).slice(0, 180));
      }
      LIVE_DETAILS_BY_ACCT.delete(accountId);
      await loadDetailsForAccount(accountId);
      render();
      toast('Uploaded ' + file.name);
    } catch (e) {
      console.error('[CRM v2] upload failed:', e);
      toast('Upload failed: ' + (e.message || e));
    }
  });
  input.click();
}
async function downloadDocument(storagePath, filename){
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    // Sign a short-lived URL then open it
    const sig = await fetch(SB_URL + '/storage/v1/object/sign/account-docs/' + encodeURI(storagePath), {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ expiresIn: 60 }),
    });
    if (!sig.ok) throw new Error('Sign ' + sig.status);
    const { signedURL } = await sig.json();
    const url = signedURL.startsWith('http') ? signedURL : (SB_URL + '/storage/v1' + signedURL);
    // Open in a new tab; the browser downloads based on Content-Disposition
    window.open(url, '_blank');
  } catch (e) {
    toast('Download failed: ' + (e.message || e));
  }
}
async function deleteDocument(docId, storagePath, accountId){
  if (!confirm('Archive this document? It will be hidden from the list.')) return;
  const token = getAccessToken();
  if (!token) { toast('Login required'); return; }
  try {
    // Soft-archive (matches how /crm handles it — keeps the file for audit)
    const res = await fetch(SB_URL + '/rest/v1/account_documents?id=eq.' + encodeURIComponent(docId), {
      method: 'PATCH',
      headers: {

        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal',
      },
      body: JSON.stringify({ is_archived: true }),

    if (!res.ok) throw new Error('Supabase ' + res.status);
    LIVE_DETAILS_BY_ACCT.delete(accountId);

  } catch (e) {
    toast('Archive failed: ' + (e.message || e));
  }
}

// ---------- MERGE MODAL ----------
function openMergeModal(seedId){
  // Snapshot the current dupe map so the modal stays consistent even if state changes
  const dupeMap = buildDupeMap(accts().filter(a => !isJunkAccount(a)));
  const entry = dupeMap.get(seedId);
  if (!entry) { toast('No duplicates found for this row'); return; }
  const partnerIds = [seedId, ...entry.partners];
  // Default keeper = the account most likely to be canonical:
  //   1. Highest ICP score wins
  //   2. Tiebreak on "furthest along in funnel" (won > proposal > demo > sql > mql > lead > lost)
  const funnelWeight = { paid:7, won:6, proposal:5, demo:4, sql:3, mql:2, lead:1, lost:0 };
  const rows = partnerIds.map(id => accts().find(a => a.id === id)).filter(Boolean);
  rows.sort((a,b) => (b.score||0) - (a.score||0) || (funnelWeight[b.stage]||0) - (funnelWeight[a.stage]||0));
  setState({
    mergeOpen: true,
    mergeIds: partnerIds,
    mergeKeeper: rows[0]?.id || seedId,
    mergeReasons: Array.from(entry.reasons),
    mergeStatus: 'idle',
    mergeError: null,
  });
}
function closeMergeModal(){ setState({ mergeOpen: false, mergeStatus: 'idle', mergeError: null }); }
function setMergeKeeper(id){ setState({ mergeKeeper: id }); }
async function submitMerge(){
  const s = state;
  if (!s.mergeKeeper || !s.mergeIds || s.mergeIds.length < 2) return;
  const token = getAccessToken();
  if (!token) { toast('Login required to merge — no auth token'); return; }
  const loserIds = s.mergeIds.filter(id => id !== s.mergeKeeper);
  state.mergeStatus = 'submitting';
  render();
  // merge_accounts takes ONE loser per call → loop, short-circuit on failure.
  // Prefer merge_accounts over manual_merge_accounts because the latter has a
  // broken k.email reference AND hard-deletes losers instead of soft-merging.
  const headers = {
    apikey: SB_KEY,
    Authorization: 'Bearer ' + token,
    'Content-Type': 'application/json',
  };
  try {
    let done = 0;
    for (const loserId of loserIds) {
      const res = await fetch(SB_URL + '/rest/v1/rpc/merge_accounts', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          _primary_id: s.mergeKeeper,
          _duplicate_id: loserId,
          _reason: 'crm-v2 dupe review',
        }),
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error('Supabase ' + res.status + ' after ' + done + '/' + loserIds.length + ' merged: ' + t.slice(0, 180));
      }
      done++;
    }
    // Refetch accounts + contacts so losers vanish and merged data surfaces
    // on the keeper without a page reload.
    const [accounts] = await Promise.all([
      fetchAccountsLive(token),
      fetchContactsLive(token).catch(() => {}),
    ]);
    state.accounts = accounts;
    state.mergeOpen = false;
    state.mergeStatus = 'done';
    render();
    toast('Merged ' + done + ' duplicate' + (done > 1 ? 's' : '') + ' — reversible via unmerge_account');
  } catch (e) {
    console.error('[CRM v2] merge failed:', e);
    state.mergeStatus = 'error';
    state.mergeError = String(e.message || e);
    render();
  }
}
Object.assign(window, { openMergeModal, closeMergeModal, setMergeKeeper, submitMerge });

// ---------- SPARKLINE ----------
function sparkBars(seed, useAccent){
  const out = []; let s = seed;
  for (let i = 0; i < 11; i++) {
    s = (s * 9301 + 49297) % 233280;
    const v = 30 + (s / 233280) * 65;
    out.push('<div style="width:4px;border-radius:2px;height:'+v.toFixed(0)+'%;background:'+(useAccent ? 'var(--accent)' : 'var(--cg-300)')+';"></div>');
  }
  return '<div style="display:flex;align-items:flex-end;gap:2px;height:28px;">' + out.join('') + '</div>';
}

// ---------- CHART (rolling revenue) ----------
function chartPaths(){
  const pts = [28,32,30,36,40,38,46,44,52,50,58,62];
  const net = pts.map(v => v - 6);
  const W=720,H=220,pl=36,pr=16,pt=16,pb=20;
  const iw=W-pl-pr, ih=H-pt-pb, max=70, min=14;
  const x = i => pl + (i/(pts.length-1))*iw;
  const y = v => pt + ih - ((v-min)/(max-min))*ih;
  const line = arr => arr.map((v,i) => (i?'L':'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const area = line(pts) + ' L ' + x(pts.length-1).toFixed(1) + ',' + (pt+ih).toFixed(1) + ' L ' + pl + ',' + (pt+ih).toFixed(1) + ' Z';
  return { gross: line(pts), net: line(net), area, W, H };
}

function renderDashboard(){
  const acts = accts();
  const meObj = me();
  // Owner filter. Defaults to the signed-in user. Admins can switch to any
  // roster member or the whole team via the picker.
  if (state.dashboardOwnerId === undefined) state.dashboardOwnerId = meObj.id;
  // Warm the current-month targets cache so the banner has data to display.
  if (state.targets == null && !state._targetsLoading) { state._targetsLoading = true; loadTargetsLive(); }
  const ownerId = state.dashboardOwnerId;
  const scoped = ownerId === 'all' ? acts : acts.filter(a => a.am === ownerId);

  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthEnd = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const monthEndT = monthEnd.getTime();
  const daysLeft = Math.max(0, Math.ceil((monthEndT - now.getTime()) / 86400000));
  const monthLabel = now.toLocaleDateString('en-US', { month:'long', year:'numeric' });

  // Won-this-month = accounts owned by owner whose _sinceRaw (paid_since /
  // created_at proxy) falls in the calendar month AND stage is won or paid.
  const wonThisMonth = scoped.filter(a => {
    if (!['won','paid'].includes(a.stage)) return false;
    const t = a._sinceRaw ? Date.parse(a._sinceRaw) : NaN;
    return !isNaN(t) && t >= monthStart.getTime() && t <= monthEndT + 86400000;
  }).reduce((s,a) => s + (a.value || 0), 0);

  const pipelineVal = scoped.filter(a => ['mql','sql','demo','proposal'].includes(a.stage)).reduce((s,a) => s+(a.value||0), 0);
  const paidVal = scoped.filter(a => a.stage === 'paid').reduce((s,a) => s+(a.value||0), 0);
  const paidCount = scoped.filter(a => a.paid === 'Paid').length;
  const propCount = scoped.filter(a => a.stage === 'proposal').length;
  const renewalsAtRisk = scoped.filter(a => a.ren === 'd30' || a.ren === 'overdue').length;
  const renewalsAtRiskVal = scoped.filter(a => a.ren === 'd30' || a.ren === 'overdue').reduce((s,a) => s+(a.value||0), 0);
  const closesBook = scoped.filter(a => ['won','paid','lost'].includes(a.stage)).length;
  const winRate = closesBook > 0 ? Math.round(scoped.filter(a => ['won','paid'].includes(a.stage)).length / closesBook * 100) : 0;

  // Look up the target for the current owner + current month from state.targets
  // (populated by loadTargetsLive). If no row exists yet, target is 0 — the
  // banner surfaces that as 'No target set' instead of faking a number.
  const targetRow = (state.targets || []).find(t =>
    t.owner_id === ownerId && t.period_kind === 'month' && t.period_start === monthStart.toISOString().slice(0,10)
  );
  const targetAmount   = ownerId === 'all'
    ? (state.targets || []).filter(t => t.period_kind === 'month' && t.period_start === monthStart.toISOString().slice(0,10)).reduce((s,t) => s + (t.amount_egp || 0), 0)
    : (targetRow ? targetRow.amount_egp : 0);
  const wonAmount = ownerId === 'all'
    ? acts.filter(a => ['won','paid'].includes(a.stage)).filter(a => {
        const t = a._sinceRaw ? Date.parse(a._sinceRaw) : NaN;
        return !isNaN(t) && t >= monthStart.getTime() && t <= monthEndT + 86400000;
      }).reduce((s,a) => s + (a.value || 0), 0)
    : wonThisMonth;
  const remaining = Math.max(0, targetAmount - wonAmount);
  const attainPctNum = targetAmount > 0 ? Math.round(wonAmount / targetAmount * 100) : 0;
  const target = {
    target: targetAmount ? egp(targetAmount) : '—',
    invoiced: egp(wonAmount),
    remaining: targetAmount ? egp(remaining) : '—',
    attainPct: targetAmount ? attainPctNum + '%' : 'No target',
  };

  // Owner picker — shown on the right side of the target banner.
  const roster = (LIVE_AMS && LIVE_AMS.length) ? LIVE_AMS : [];
  const displayOwner = ownerId === 'all' ? { name:'Whole team', initials:'ALL', email:'' } : (roster.find(x => x.id === ownerId) || meObj);
  const ownerPicker = '<select onchange="setDashboardOwner(this.value)" title="Filter dashboard by owner" style="height:32px;padding:0 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text);outline:0;cursor:pointer;">'
    + '<option value="all"'+(ownerId==='all'?' selected':'')+'>Whole team</option>'
    + roster.map(p => '<option value="'+esc(p.id)+'"'+(p.id===ownerId?' selected':'')+'>'+esc(p.name||p.email||'')+'</option>').join('')
  + '</select>';
  const barPct = Math.min(100, attainPctNum);
  const barColor = attainPctNum >= 100 ? '#22C55E' : attainPctNum >= 70 ? '#22C55E' : attainPctNum >= 40 ? 'var(--warn)' : 'var(--bad)';
  const targetBanner =

      + '<span class="tnum" style="'+chip(targetAmount?(attainPctNum>=70?'ok':attainPctNum>=40?'warn':'bad'):'neutral')+'">'+target.attainPct+(targetAmount?' attained':'')+'</span>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 2fr;gap:28px;align-items:center;">'
      + '<div>'
        + '<div style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">Target</div>'
        + '<div class="tnum" style="font-size:30px;font-weight:900;letter-spacing:-.03em;color:var(--text);">'+target.target+'</div>'

      + '</div>'
      + '<div>'
        + '<div style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">Won</div>'
        + '<div class="tnum" style="font-size:30px;font-weight:900;letter-spacing:-.03em;color:#22C55E;">'+target.invoiced+'</div>'
        + '<div style="font-size:11.5px;color:var(--text-3);font-weight:500;margin-top:4px;">'+(ownerId==='all'?'team':'own book')+' · this month</div>'

      + '<div>'
        + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">'
          + '<div style="flex:1;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative;display:flex;">'
            + '<div style="height:100%;width:'+barPct+'%;background:'+barColor+';"></div>'
          + '</div>'
          + '<span class="tnum" style="font-size:16px;font-weight:800;color:'+barColor+';">'+(targetAmount?attainPctNum+'%':'—')+'</span>'

          + '<div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border-2);"></div><span style="font-size:11.5px;color:var(--text-3);font-weight:600;">Remaining '+target.remaining+'</span></div>'
        + '</div>'
      + '</div>'
    + '</div>'
  + '</div>';

  // My companies — mirrors the top-of-page owner filter. Whole-team view
  // shows the newest rows in the book so admins get a live pulse.

  const myCoCount = scoped.length;
  const myCoBlock =
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh1);overflow:hidden;">'

      + '<span onclick="go(\'accounts\')" style="font-size:13px;color:var(--accent-ink);font-weight:700;cursor:pointer;">View all</span>'

// Junk detector — placeholder / dev rows that shouldn't clutter the CRM.
// Currently matches 69 "untitled" rows + a handful of "test" leftovers in prod.
const JUNK_NAMES = new Set(['untitled','test','tests','asdf','none','n/a','na','-','.']);
function isJunkAccount(a){
  const n = String(a.name || '').trim().toLowerCase().replace(/\s+/g,' ');
  if (!n) return true;
  if (JUNK_NAMES.has(n)) return true;
  if (n.length <= 1) return true;
  return false;
}

// Normalize helpers for duplicate matching
function normName(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g,' '); }
function normDomain(s){
  return String(s || '').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');
}
function normPhone(s){
  const digits = String(s || '').replace(/\D+/g,'');
  // Keep last 9-10 digits so "+201001234567" and "01001234567" match
  return digits.length > 10 ? digits.slice(-10) : digits;
}
function emailDomain(s){
  const m = String(s || '').toLowerCase().match(/@([^\s@]+)$/);
  return m ? m[1] : '';
}
// Domains that are junk-signal — matching by them would falsely link
// unrelated accounts. Excluded from the domain + email-domain indexes.
const GENERIC_DOMAINS = new Set([
  'gmail.com','yahoo.com','hotmail.com','outlook.com','icloud.com','live.com','aol.com','mail.com',
  'protonmail.com','yandex.com','msn.com','me.com',
]);

// Build multi-key duplicate detector. Returns:
//   Map<accountId, { reasons: Set<'name'|'domain'|'phone'|'email'>, partners: Set<accountId> }>
// A row is a duplicate if it shares AT LEAST ONE key with another row.
function buildDupeMap(rows){
  const contactOf = (a) => LIVE_CONTACTS_BY_ACCT?.get(a.id) || {};
  const byKey = { name: new Map(), domain: new Map(), phone: new Map(), email: new Map() };
  const add = (bucket, key, id) => {
    if (!key) return;
    if (!byKey[bucket].has(key)) byKey[bucket].set(key, []);
    byKey[bucket].get(key).push(id);
  };
  for (const a of rows) {
    const c = contactOf(a);
    add('name',   normName(a.name), a.id);
    const dom = normDomain(a.domain);
    if (dom && !GENERIC_DOMAINS.has(dom)) add('domain', dom, a.id);
    add('phone',  normPhone(c.phone), a.id);
    const ed = emailDomain(c.email);
    if (ed && !GENERIC_DOMAINS.has(ed)) add('email', ed, a.id);
  }
  const out = new Map();
  for (const [bucket, m] of Object.entries(byKey)) {
    for (const ids of m.values()) {
      if (ids.length < 2) continue;
      for (const id of ids) {
        if (!out.has(id)) out.set(id, { reasons: new Set(), partners: new Set() });
        const entry = out.get(id);
        entry.reasons.add(bucket);
        for (const other of ids) if (other !== id) entry.partners.add(other);
      }
    }
  }
  return out;
}

// Back-compat helper: name-only count for junk detector display
function buildDupeIndex(rows){
  const m = new Map();
  for (const a of rows) {
    const key = normName(a.name);
    if (!key) continue;
    m.set(key, (m.get(key) || 0) + 1);
  }
  return m;
}

function filteredAccounts(){
  const s = state;
  let rows = accts().slice();
  // Hide junk unless the user explicitly opts in via the "Show junk" toggle
  if (!s.acctShowJunk) rows = rows.filter(a => !isJunkAccount(a));
  // Duplicates-only filter (opt-in) — now checks name/domain/phone/email
  if (s.acctDupesOnly) {
    const dm = buildDupeMap(rows);
    rows = rows.filter(a => dm.has(a.id));
  }
  // tab
  if (s.acctTab === 'leads')    rows = rows.filter(a => a.stage === 'lead');
  else if (s.acctTab === 'pipeline') rows = rows.filter(a => ['mql','sql','demo','proposal'].includes(a.stage));
  // Paid = collection happened (stage='paid'). This is what AM Performance targets.
  else if (s.acctTab === 'paid')     rows = rows.filter(a => a.stage === 'paid');
  // Trial = still on an active trial
  else if (s.acctTab === 'trial')    rows = rows.filter(a => a.paid === 'Free Trial' && a.act === 'Active');
  // Expired = trials that ran out without converting
  else if (s.acctTab === 'expired')  rows = rows.filter(a => a.paid === 'Free Trial' && a.act === 'Expired');
  // Churned = collected before, but activation expired (paid stage + expired activation)
  else if (s.acctTab === 'churned')  rows = rows.filter(a => a.stage === 'paid' && a.act === 'Expired');
  // Won = invoiced but not yet collected — the finance team's queue
  else if (s.acctTab === 'won')      rows = rows.filter(a => a.stage === 'won');
  // filters
  if (s.acctStage  !== 'all') rows = rows.filter(a => a.stage === s.acctStage);
  if (s.acctSource !== 'all') rows = rows.filter(a => a.source === s.acctSource);
  if (s.acctStatus !== 'all') rows = rows.filter(a => s.acctStatus === 'Expired' ? a.act === 'Expired' : a.paid === s.acctStatus);
  if (s.acctIcp    !== 'all') rows = rows.filter(a => s.acctIcp === 'hi' ? a.score >= 80 : s.acctIcp === 'mid' ? (a.score >= 60 && a.score < 80) : a.score < 60);
  if (s.acctOwner  !== 'all') rows = rows.filter(a => a.am === s.acctOwner);
  if (s.acctTrial  !== 'all') rows = rows.filter(a => s.acctTrial === 'on' ? (a.paid === 'Free Trial' && a.act === 'Active') : s.acctTrial === 'expired' ? a.act === 'Expired' : !a.act);
  if (s.acctPlan   !== 'all') rows = rows.filter(a => a.plan === s.acctPlan);
  const q = (s.acctSearch || '').trim().toLowerCase();
  if (q) {
    // Multi-field search: company name, domain, contact name, email, phone.
    // Phone normalized to digits only so '+20 100', '01001234567', and
    // '201001234567' all match the same underlying number.
    const qDigits = q.replace(/\D+/g, '');
    rows = rows.filter(a => {
      if (a.name && a.name.toLowerCase().includes(q))     return true;
      if (a.domain && a.domain.toLowerCase().includes(q)) return true;
      const c = synthContact(a);
      if (c.name  && c.name.toLowerCase().includes(q))    return true;
      if (c.email && c.email.toLowerCase().includes(q))   return true;
      if (qDigits && c.phone) {
        const phoneDigits = String(c.phone).replace(/\D+/g, '');
        if (phoneDigits.includes(qDigits)) return true;
      }
      return false;
    });
  }
  // Apply sort last so filters compose predictably
  const sort = s.acctSort || { key: 'created', dir: 'desc' };
  rows.sort((a, b) => compareAccts(a, b, sort.key) * (sort.dir === 'asc' ? 1 : -1));
  return rows;
}

function synthContact(a){
  // Prefer live contact from Supabase if available
  if (LIVE_CONTACTS_BY_ACCT){
    const live = LIVE_CONTACTS_BY_ACCT.get(a.id);
    if (live && (live.name || live.email || live.phone)){
      return { name: live.name || '—', email: live.email || '—', phone: live.phone || '—', title: live.title || '' };
    }
  }
  // Fallback #1 for live accounts: raw_data Bubble-legacy contact fields.
  // Covers accounts created between backfill runs whose contact info is only
  // in accounts.raw_data.
  if (a._rawContact){
    return {
      name:  a._rawContact.name  || '—',
      email: a._rawContact.email || '—',
      phone: a._rawContact.phone || '—',
      title: '',
    };
  }
  // Fallback: deterministic mock. Only meaningful for the 17 numeric-id seed rows.
  if (typeof a.id !== 'number') return { name:'—', email:'—', phone:'—', title:'' };
  const first = ['Ahmed','Mona','Sara','Karim','Nada','Yasmin','Hossam','Tarek','Rania','Omar','Heba','Nour'][a.id % 12];
  const last  = ['Adel','Nabil','Galal','Salem','Farid','Reda','Ali','Hassan','Ibrahim','Kamal','Zaki','Amin'][(a.id * 3) % 12];
  const email = (first + '.' + last).toLowerCase() + '@' + a.domain;
  const phone = '+20 10' + String(1000 + (a.id * 137) % 8999) + ' ' + String(1000 + (a.id * 977) % 8999);
  return { name: first + ' ' + last, email, phone, title:'' };
}

function setAcctSort(key){

  const s = state.acctSort || {};
  if (s.key === key) {
    setState({ acctSort: { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } });

    const defaultDesc = ['score','created'].includes(key);
    setState({ acctSort: { key, dir: defaultDesc ? 'desc' : 'asc' } });
  }
}

// Header renderer for sortable columns (Companies table)
function sortHead(key, label, baseStyle, extraStyle){
  const s = state.acctSort || { key: 'created', dir: 'desc' };
  const active = s.key === key;
  const arrow = active ? (s.dir === 'asc' ? '↑' : '↓') : '↕';

    + '</span></th>';

// Sort comparator that handles nulls, strings, numbers, and owner-name lookup
function compareAccts(a, b, key){
  let av, bv;
  if (key === 'owner') {
    av = amById(a.am).name || ''; bv = amById(b.am).name || '';
  } else if (key === 'score') {
    av = a.score || 0; bv = b.score || 0;
  } else if (key === 'created') {
    av = a._sinceRaw ? Date.parse(a._sinceRaw) : 0;
    bv = b._sinceRaw ? Date.parse(b._sinceRaw) : 0;
  } else if (key === 'stage') {
    // Sort by funnel order, not alphabetically
    const order = { lead:0, mql:1, sql:2, demo:3, proposal:4, won:5, paid:6, lost:7 };
    av = order[a.stage] ?? 99; bv = order[b.stage] ?? 99;
  } else {
    av = (a[key] || '').toString().toLowerCase();
    bv = (b[key] || '').toString().toLowerCase();
  }
  if (av < bv) return -1;
  if (av > bv) return 1;
  return 0;
}

// Phase D funnel: 7 columns. Won = invoiced (finance queue), Paid = collected
// (revenue recognized, AM performance target).
const PIPE_COLS = [
  { key:'mql',      label:'MQL',       accent:'var(--info)'       },
  { key:'sql',      label:'SQL',       accent:'var(--info)'       },
  { key:'demo',     label:'Demo',      accent:'var(--purple-700)' },
  { key:'proposal', label:'Proposal',  accent:'var(--warn)'       },
  { key:'won',      label:'Won',  accent:'var(--warn)'       },
  { key:'paid',     label:'Collected', accent:'var(--ok)'         },
  { key:'lost',     label:'Lost',      accent:'var(--bad)'        },
];
function setPipeField(k, v){ state[k] = v; render(); }
let PIPE_DRAG_ID = null;
function pipeDragStart(e, id){
  PIPE_DRAG_ID = id;
  try { e.dataTransfer.setData('text/plain', String(id)); e.dataTransfer.effectAllowed = 'move'; } catch {}
  if (e.currentTarget && e.currentTarget.style) { e.currentTarget.style.opacity = '0.55'; }
}
function pipeDragEnd(e){
  PIPE_DRAG_ID = null;
  if (e.currentTarget && e.currentTarget.style) { e.currentTarget.style.opacity = ''; }
  document.querySelectorAll('.pipe-col-drop-hi').forEach(el => {
    el.classList.remove('pipe-col-drop-hi');
    el.style.background = '';
    el.style.outline = '';
  });
}
function pipeDragOver(e){
  e.preventDefault();
  try { e.dataTransfer.dropEffect = 'move'; } catch {}
  const col = e.currentTarget;
  if (!col.classList.contains('pipe-col-drop-hi')) {
    col.classList.add('pipe-col-drop-hi');
    col.style.background = 'var(--accent-soft)';
    col.style.outline = '2px dashed var(--accent-strong)';
    col.style.outlineOffset = '-2px';
  }
}
function pipeDragLeave(e){
  const col = e.currentTarget;
  if (col.contains(e.relatedTarget)) return;
  col.classList.remove('pipe-col-drop-hi');
  col.style.background = '';
  col.style.outline = '';
}
function pipeDrop(e, stageKey){
  e.preventDefault();
  const id = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || PIPE_DRAG_ID;
  const col = e.currentTarget;
  col.classList.remove('pipe-col-drop-hi');
  col.style.background = '';
  col.style.outline = '';
  if (!id) return;
  changeAccountStage(id, stageKey);
}
Object.assign(window, { pipeDragStart, pipeDragEnd, pipeDragOver, pipeDragLeave, pipeDrop });
function pipeRangeBounds(){
  const now = new Date();
  const yr = now.getFullYear();
  const s = state;
  const startOfQ = (q, y) => new Date(y, (q-1)*3, 1);
  const endOfQ   = (q, y) => new Date(y, q*3, 1);
  if (s.pipeRange === 'thisq') { const q = Math.floor(now.getMonth()/3)+1; return [startOfQ(q,yr), endOfQ(q,yr)]; }
  if (s.pipeRange === 'thisy') { return [new Date(yr,0,1), new Date(yr+1,0,1)]; }
  const m = /^q([1-4])(\d{2})$/.exec(s.pipeRange || '');
  if (m) { const q = +m[1], y = 2000 + +m[2]; return [startOfQ(q,y), endOfQ(q,y)]; }
  if (s.pipeRange === 'custom') {
    const f = s.pipeFrom ? new Date(s.pipeFrom) : null;
    const t = s.pipeTo   ? new Date(s.pipeTo)   : null;
    if (t) t.setDate(t.getDate() + 1);
    return [f, t];
  }
  return [null, null];
}
function pipeInRange(a){
  const [from, to] = pipeRangeBounds();
  if (!from && !to) return true;
  const iso = a._sinceRaw || a.since;
  if (!iso) return false;
  const d = new Date(iso);
  if (isNaN(d)) return false;
  if (from && d < from) return false;
  if (to && d >= to) return false;
  return true;
}

          + '<button onclick="toast(\'Export CSV — coming Phase 3\')" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;">↓ Export</button>'
        + '</div>';
      })()
    + kpiCards
    + '<div class="sc" style="display:grid;grid-template-columns:repeat(7,minmax(320px,1fr));gap:14px;align-items:stretch;overflow-x:auto;">'
      + columns
    + '</div>'
  + '</div>';

// =========================================================================
//   RENDER: RENEWAL Kanban
// =========================================================================
const REN_COLS = [
  { key:'d90',      label:'90 days', dot:'var(--ok)'      },
  { key:'d60',      label:'60 days', dot:'var(--info)'    },
  { key:'d30',      label:'30 days', dot:'var(--warn)'    },
  { key:'overdue',  label:'Overdue', dot:'var(--bad)'     },
  { key:'renewed',  label:'Renewed', dot:'var(--accent)'  },
  { key:'churned',  label:'Churned', dot:'var(--text-4)'  },
];
function renderRenewal(){
  const withRen = accts().filter(a => a.ren);
  const daysChip = (renKey) => {
    const map = { d90:'ok', d60:'info', d30:'warn', overdue:'bad', renewed:'lime', churned:'neutral' };
    return chip(map[renKey] || 'neutral');
  };
  const columns = REN_COLS.map(col => {
    const cards = withRen.filter(a => a.ren === col.key);
    const cardHtml = cards.map(a => {
      const label = REN[a.ren] ? REN[a.ren].label : a.ren;
      return '<div class="row-h" onclick="openDetail('+jsArg(a.id)+')" style="background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;cursor:pointer;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:8px;">'
        + '<div style="font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(a.name)+'</div>'
        + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">'
          + '<span style="font-size:12px;color:var(--text-2);font-weight:600;">'+esc(a.plan)+'</span>'
          + '<span class="tnum" style="font-size:13px;font-weight:800;color:var(--text);">'+egp(a.value)+'</span>'
        + '</div>'
        + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--border);">'
          + '<span style="font-size:11px;color:var(--text-3);font-weight:600;">Ends '+esc(a.end||'—')+'</span>'
          + '<span style="'+daysChip(a.ren)+'">'+label+'</span>'
        + '</div>'
      + '</div>';
    }).join('');
    return '<div style="display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;overflow:hidden;min-height:520px;">'
      + '<div style="display:flex;align-items:center;gap:9px;padding:14px 16px 12px;background:var(--surface);">'
        + '<span style="width:10px;height:10px;border-radius:999px;background:'+col.dot+';flex-shrink:0;"></span>'
        + '<span style="font-size:14px;font-weight:800;letter-spacing:-.01em;">'+col.label+'</span>'
        + '<div style="flex:1;"></div>'
        + '<span class="tnum" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;">'+cards.length+'</span>'
      + '</div>'
      + '<div class="sc" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;">'
        + cardHtml
        + (cards.length === 0 ? '<div style="padding:30px 10px;text-align:center;color:var(--text-4);font-size:12.5px;font-weight:600;">No customers here</div>' : '')
      + '</div>'
    + '</div>';
  }).join('');
  return '<div style="padding:20px 28px 56px;display:flex;flex-direction:column;gap:18px;">'
    + '<div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;">'
      + '<div>'
        + '<h1 style="margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em;">Renewal Pipeline</h1>'
        + '<div style="font-size:13px;color:var(--text-3);font-weight:500;margin-top:4px;">Active contracts, bucketed by days remaining until renewal.</div>'
      + '</div>'
      + '<div style="flex:1;"></div>'
      + '<button onclick="toast(\'Renewals refreshed\')" style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;">↻ Refresh</button>'
    + '</div>'
    + '<div class="sc" style="display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;">' + columns + '</div>'
  + '</div>';
}

      const a = (state.accounts || []).find(x => x.id === t.acctId);

        + '<span style="font-size:14px;font-weight:800;">Urgent tasks</span>'

        + '<span style="width:8px;height:8px;border-radius:999px;background:var(--accent);"></span>'
        + '<span style="font-size:14px;font-weight:800;">Group tasks</span>'
        + '<span style="display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);">'+group.length+'</span>'
      + '</div>'
      + group.map(t => '<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">'
          + '<div style="'+check+'"></div>'
          + '<div style="flex:1;min-width:0;">'
            + '<div style="font-size:13.5px;font-weight:700;">'+esc(t.text)+'</div>'
            + '<div style="font-size:11.5px;color:var(--text-3);margin-top:2px;">'+esc(t.acct)+' · '+esc(t.am)+'</div>'
          + '</div>'
          + '<span style="display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);">Employer</span>'
        + '</div>').join('')
    + '</div>';

  const filters = ['All time','Today','This week','Next week','Later','Done'];
  const filterChips = filters.map((f, i) => '<div style="height:32px;padding:0 14px;display:inline-flex;align-items:center;border-radius:8px;font-size:13px;font-weight:'+(i===0?700:500)+';cursor:pointer;border:'+(i===0?'2px solid var(--cg-900)':'1px solid var(--border)')+';background:'+(i===0?'var(--cg-900)':'var(--surface)')+';color:'+(i===0?'#fff':'var(--text-2)')+';">'+f+'</div>').join('');

  const allRows = tasks.map(t => {

      + '<div style="display:flex;align-items:center;gap:0;padding:0 20px;border-bottom:1px solid var(--border);">'
        + '<div style="font-size:13px;font-weight:700;padding:14px 0;border-bottom:2px solid var(--cg-900);margin-right:20px;">All tasks '+tasks.length+'</div>'
        + '<div style="font-size:13px;font-weight:500;color:var(--text-3);padding:14px 0;margin-right:20px;cursor:pointer;">Overdue</div>'
        + '<div style="font-size:13px;font-weight:500;color:var(--text-3);padding:14px 0;cursor:pointer;">Past 3 days</div>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;">'+filterChips+'</div>'

            + '<th style="'+th+'">Company</th>'
            + '<th style="'+th+'">Type</th>'
            + '<th style="'+th+'">Description</th>'

  return '<div style="padding:28px 32px 56px;max-width:1300px;">'
