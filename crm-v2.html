  const monShort = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const timeAgo = (iso) => {
    if (!iso) return '';
    const d = Date.parse(iso); if (isNaN(d)) return '';
    const s = (Date.now() - d) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s/60) + 'm ago';
    if (s < 86400) return Math.round(s/3600) + 'h ago';
    if (s < 86400*7) return Math.round(s/86400) + 'd ago';
    if (s < 86400*30) return Math.round(s/86400/7) + 'w ago';
    return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric' });

    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--sh1);">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="1.9"><path d="M5 12a7 7 0 0 1 7-7"/><circle cx="12" cy="12" r="2"/><path d="M14 14l4 6M10 14l-4 6"/></svg>'
        + '<div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:700;">Attribution</div>'
      + '</div>'
      // Core identity — MEDIUM and CAMPAIGN prefer the most recent (last touch)
      // value from marketing_tracking, falling back to the account-level column.
      // This unifies the two attribution surfaces so we don't show the same
      // field twice with potentially different values.
      + attrRow('Source',    a.source,                                          { core: true })
      + attrRow('Medium',    tracking.last_medium   || a._medium,               { core: true })
      + attrRow('Campaign',  tracking.last_campaign || a._campaign,             { core: true })
      + attrRow('Joined at', a.since,                                           { core: true })
      // UTM section — collapses if all 4 fields empty
      + attrSection('UTM Parameters', [
          ['utm_source',   utm.source],
          ['utm_medium',   utm.medium],
          ['utm_campaign', utm.campaign],
          ['utm_content',  utm.content],
        ])
      // Landing / referrer / CTA section
      + attrSection('Landing', [
          ['Referrer',      a._referrerUrl,  { link: true }],
          ['Landing page',  a._landingPage,  { link: true }],
          ['CTA clicked',   a._ctaClicked],
        ])
      // Recruitera-specific marketing signals
      + attrSection('Recruitera Channels', [
          ['Marketing channel', a._wpMarketingChan],
          ['Rec challenge',     a._wpRecChallenge],
        ])
      // Marketing tracking (first + last touch, device, lang, cta, landing page).
      // Whole block hides when nothing populated, so accounts without tracking
      // stay compact.
      + (function(){
          const t = tracking;
          const hasFirst = t.first_source || t.first_medium || t.first_date;
          // Lang dropped per design decision — not signal-bearing enough to
          // justify column space.
          const metaCells = [
            ['Days to convert', t.days_to_convert],
            ['Device',          t.device_type],
            ['CTA',             t.cta_clicked],
          ].filter(([, v]) => v != null && v !== '');
          const hasLanding = t.first_landing_page;
          if (!hasFirst && metaCells.length === 0 && !hasLanding) return '';

          const touchCount = t.touch_count;
          const touchDot = (v) => v ? '<span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text);"><span style="width:8px;height:8px;border-radius:999px;background:var(--info);"></span>'+esc(v)+'</span>' : '';
          const meta = (label, value) => '<div><div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:5px;">'+label+'</div><div class="tnum" style="font-size:13px;font-weight:700;color:var(--text);">'+esc(value)+'</div></div>';
          // Auto-fit grid: 3 → 3 cols, 2 → 2 cols, 1 → 1 col. Keeps the block
          // balanced when some meta fields are missing instead of leaving
          // ghost cells.
          const metaCols = Math.max(metaCells.length, 1);

          return '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">'
            + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'
              + '<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:800;">Marketing tracking</div>'
              + (touchCount ? '<span style="font-size:10.5px;font-weight:700;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:2px 9px;border-radius:999px;">'+touchCount+' touch'+(touchCount>1?'es':'')+'</span>' : '')
            + '</div>'
            + (hasFirst ? '<div style="padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;">'
                + '<div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:6px;">First touch</div>'
                + '<div style="margin-bottom:3px;">'+touchDot(t.first_source)+'</div>'
                + (t.first_medium ? '<div style="font-size:12px;color:var(--text-2);font-weight:600;">'+esc(t.first_medium)+(t.first_campaign?' · '+esc(t.first_campaign):'')+'</div>' : '')
                + (t.first_date ? '<div class="tnum" style="font-size:11.5px;color:var(--text-3);margin-top:3px;">'+formatShortDate(t.first_date)+'</div>' : '')
              + '</div>' : '')
            + (metaCells.length ? '<div style="display:grid;grid-template-columns:repeat('+metaCols+',1fr);gap:14px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;">'
                + metaCells.map(([l,v]) => meta(l, v)).join('')
              + '</div>' : '')
            + (hasLanding ? '<div style="padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;">'
                + '<div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:6px;">First landing page</div>'
                + '<a href="'+esc(t.first_landing_page)+'" target="_blank" style="font-size:12px;color:var(--accent-ink);font-weight:700;word-break:break-all;text-decoration:none;line-height:1.4;">'+esc(t.first_landing_page)+'</a>'
              + '</div>' : '')
          + '</div>';
        })()
    + '</div>';

  const tasksCard =
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--sh1);">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;">'
        + '<div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:800;">Tasks</div>'
        + (acctDoneCount > 0
          ? '<a onclick="toast(\'Done tasks — coming soon\')" style="font-size:12px;font-weight:700;color:var(--accent-ink);cursor:pointer;text-decoration:underline;">View '+acctDoneCount+' done →</a>'
          : '')
      + '</div>'
      + '<div class="tnum" style="font-size:16px;font-weight:800;margin-bottom:12px;">'+acctTasks.length+' open</div>'
      + '<div style="display:flex;gap:6px;margin-bottom:12px;">'
        + '<input placeholder="Quick task…" style="flex:1;height:34px;border:1px solid var(--border-2);border-radius:7px;padding:0 10px;font-family:inherit;font-size:12.5px;background:var(--surface);color:var(--text);outline:0;">'
        + '<select style="height:34px;border:1px solid var(--border-2);border-radius:7px;padding:0 6px;font-family:inherit;font-size:12.5px;font-weight:700;background:var(--surface);color:var(--text);outline:0;cursor:pointer;">'
          + '<option>Quick</option><option>Follow up</option><option>Call</option><option>Meeting</option><option>Check plan</option>'
        + '</select>'
      + '</div>'
      + '<div class="sc" style="display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto;padding-right:4px;">'
        + (acctTasks.length === 0
          ? '<div style="padding:20px 12px;text-align:center;font-size:12.5px;color:var(--text-4);font-weight:600;border:1px dashed var(--border-2);border-radius:9px;">'
              + (state.dataSource === 'live' && !LIVE_ACTIVITIES_BY_ACCT.has(a.id)
                ? 'Loading tasks…'
                : 'No open tasks')
            + '</div>'
          : acctTasks.map(t => {
              const isOverdue = t.dateLabel === 'Overdue';
              const isToday   = t.dateLabel === 'Due today';
              const dateColor = isOverdue ? 'var(--bad)' : isToday ? 'var(--warn)' : 'var(--text-3)';
              return '<div style="display:flex;align-items:flex-start;gap:9px;padding:9px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;">'
                + '<div style="width:14px;height:14px;border:1.5px solid var(--border-2);border-radius:3px;flex-shrink:0;margin-top:2px;cursor:pointer;background:var(--surface);"></div>'
                + '<div style="flex:1;min-width:0;">'
                  + '<div style="font-size:12px;color:var(--text);line-height:1.45;">'+esc(t.text)+'</div>'
                  + '<div style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;">'
                    + '<span style="font-size:10.5px;font-weight:700;color:'+dateColor+';">'+esc(t.dateLabel)+'</span>'
                    + (t.by ? '<span style="font-size:10.5px;color:var(--text-3);">'+esc(t.by)+'</span>' : '')
                  + '</div>'
                + '</div>'
              + '</div>';
            }).join(''))
      + '</div>'
    + '</div>';

  const overviewBody =
    '<div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;">'
      + '<div style="display:flex;flex-direction:column;gap:16px;">' + contactCard + notesCard + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:16px;">' + ownersCard + proposalCard + tasksCard + attributionCard + '</div>'
    + '</div>';

  // --- tab bodies (non-overview: placeholder) ---
  const otherTabBody = (label) =>
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:56px 32px;box-shadow:var(--sh1);text-align:center;">'
      + '<div style="width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:inline-grid;place-items:center;color:var(--text-3);margin-bottom:14px;">'+svg('logs',20,1.5)+'</div>'
      + '<div style="font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--text);margin-bottom:6px;">'+esc(label)+'</div>'
      + '<div style="font-size:13px;color:var(--text-3);font-weight:500;max-width:460px;margin:0 auto;">This tab lands after we wire live Supabase data — Activity pulls from the <code style="font-family:monospace;background:var(--surface-2);padding:1px 5px;border-radius:4px;">activities</code> table, Jobs &amp; usage from the employer sync, Invoices from <code style="font-family:monospace;background:var(--surface-2);padding:1px 5px;border-radius:4px;">contract_cycles</code>. Deferred until backend is connected.</div>'
    + '</div>';

  let tabBody;
  if      (state.detailTab === 'overview')  tabBody = overviewBody;
  else if (state.detailTab === 'activity')  tabBody = renderActivityTimeline(a);
  else if (state.detailTab === 'plans')     tabBody = renderPlansTab(a);
  else if (state.detailTab === 'contacts')  tabBody = renderContactsTab(a);
  else if (state.detailTab === 'documents') tabBody = renderDocumentsTab(a);
  else {
    tabBody = otherTabBody('Coming soon');
  }

  return '<div style="padding:20px 28px 56px;max-width:1400px;">' + crumb + headerCard + tabsBar + tabBody + '</div>';
}

// =========================================================================
//   RENDER: CYCLE EDITOR MODAL
// =========================================================================
function renderCycleModal(){
  if (!state.cycleModalOpen) return '';
  const f = state.cycleForm || {};
  const isEdit = state.cycleModalMode === 'edit';
  const busy = state.cycleModalStatus === 'submitting';
  const err  = state.cycleModalStatus === 'error' ? state.cycleModalError : null;

  const fieldStyle = 'width:100%;height:38px;padding:0 12px;border:1px solid var(--border-2);border-radius:8px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--text);outline:0;box-sizing:border-box;';
  const labelStyle = 'font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:800;margin-bottom:5px;';
  const input = (key, type, placeholder) => '<input type="'+(type||'text')+'" value="'+esc(f[key]||'')+'" oninput="setCycleField(\''+key+'\', this.value)" placeholder="'+esc(placeholder||'')+'" style="'+fieldStyle+'">';
  const select = (key, options) =>
    '<select onchange="setCycleField(\''+key+'\', this.value)" style="'+fieldStyle+'">'
    + options.map(o => '<option value="'+esc(o.v)+'"'+(f[key]===o.v?' selected':'')+'>'+esc(o.l)+'</option>').join('')
    + '</select>';

  const planOpts = ['','Basic','Pro','Enterprise'].map(v => ({ v, l: v || '— pick a plan —' }));
  const statusOpts = ['active','renewed','churned','overdue','collected','pending'].map(v => ({ v, l: v.charAt(0).toUpperCase()+v.slice(1) }));
  const paymentOpts = ['','one-time','monthly','quarterly','annual','custom'].map(v => ({ v, l: v || '—' }));

  const field = (label, control) => '<div><div style="'+labelStyle+'">'+label+'</div>'+control+'</div>';

  const dealBlock = state.cycleModalStageAfter === 'won'
    ? '<div style="margin-bottom:16px;padding:14px 16px;border:1px solid var(--accent-strong);background:var(--accent-soft);border-radius:10px;">'
        + '<div style="'+labelStyle+';color:var(--accent-ink);">Deal value (EGP) *</div>'
        + '<input type="number" min="0" step="1" value="'+esc(f.deal_value_egp||'')+'" oninput="setCycleField(\'deal_value_egp\', this.value)" placeholder="e.g. 120000" style="'+fieldStyle+'">'
        + '<div style="font-size:11px;color:var(--text-3);margin-top:6px;">Saved to <code style="font-family:monospace;background:var(--surface);padding:1px 5px;border-radius:4px;">accounts.deal_value</code>. Leave blank to auto-fill from the cycle amount below (USD/EUR converted via FX table).</div>'
      + '</div>'
    : '';
  const body =
    dealBlock
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">'
      + field('Plan tier *',   select('plan_tier', planOpts))
      + field('Status',        select('status', statusOpts))
      + field('Term start *',  input('started_at', 'date'))
      + field('Term end *',    input('ends_at',   'date'))
      + field('Amount',        input('value',    'number', '72000'))
      + field('Currency',      select('currency', [{v:'EGP',l:'EGP'},{v:'USD',l:'USD'},{v:'EUR',l:'EUR'},{v:'SAR',l:'SAR'}]))
      + field('Payment type',  select('payment_type', paymentOpts))
      + field('Auto renew',    '<label style="display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);cursor:pointer;"><input type="checkbox"'+(f.auto_renew?' checked':'')+' onchange="setCycleField(\'auto_renew\', this.checked)" style="width:16px;height:16px;accent-color:var(--accent);"><span style="font-size:13px;font-weight:600;color:var(--text-2);">Renew automatically</span></label>')
    + '</div>'
    + '<div style="margin-top:14px;"><div style="'+labelStyle+'">Notes</div>'
      + '<textarea rows="3" oninput="setCycleField(\'notes\', this.value)" placeholder="Discount rationale, renewal terms, discussion notes…" style="width:100%;padding:10px 12px;border:1px solid var(--border-2);border-radius:8px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--text);outline:0;resize:vertical;line-height:1.45;box-sizing:border-box;">'+esc(f.notes||'')+'</textarea>'
    + '</div>';

  return '<div onclick="closeCycleModal()" style="position:fixed;inset:0;background:rgba(45,56,68,.55);display:grid;place-items:center;z-index:300;padding:24px;">'
    + '<div onclick="event.stopPropagation()" style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh3);width:100%;max-width:720px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;">'
      // header
      + '<div style="padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;">'
        + '<div>'
          + '<h2 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;">'+(state.cycleModalStageAfter==='won'?'Mark as Deal Won':(isEdit?'Edit cycle':'Add new cycle'))+'</h2>'
          + '<div style="font-size:12px;color:var(--text-3);margin-top:3px;">'+(state.cycleModalStageAfter==='won'?'Sets the deal value and creates the first contract cycle.':'Writes to <code style="font-family:monospace;background:var(--surface-2);padding:1px 5px;border-radius:4px;">contract_cycles</code> table')+'</div>'
        + '</div>'
        + '<button onclick="closeCycleModal()" style="width:32px;height:32px;border-radius:8px;color:var(--text-3);cursor:pointer;font-size:20px;">×</button>'
      + '</div>'
      // body
      + '<div class="sc" style="padding:20px 24px;overflow-y:auto;flex:1;">'
        + (err ? '<div style="padding:10px 14px;background:var(--bad-bg);border:1px solid var(--bad);border-radius:8px;font-size:12px;color:var(--bad);font-weight:600;margin-bottom:12px;">✗ '+esc(err)+'</div>' : '')
        + body
      + '</div>'
      // footer
      + '<div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface-2);">'
        + '<div style="font-size:12px;color:var(--text-3);font-weight:500;flex:1;">'+(isEdit?'Changes apply immediately on save.':'A new cycle_number will be assigned automatically.')+'</div>'
        + '<button onclick="closeCycleModal()" '+(busy?'disabled':'')+' style="height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);cursor:'+(busy?'not-allowed':'pointer')+';">Cancel</button>'
        + '<button onclick="submitCycle()" '+(busy?'disabled':'')+' style="height:36px;padding:0 18px;border-radius:8px;border:1px solid var(--accent-strong);background:'+(busy?'var(--surface-2)':'var(--accent)')+';font-size:13px;font-weight:700;color:'+(busy?'var(--text-3)':'var(--on-accent)')+';cursor:'+(busy?'wait':'pointer')+';">'+(busy?'Saving…':(state.cycleModalStageAfter==='won'?'Mark Won':(isEdit?'Save changes':'Add cycle')))+'</button>'
      + '</div>'
    + '</div>'
  + '</div>';
}

        + '<button onclick="submitContact()" '+(busy?'disabled':'')+' style="height:36px;padding:0 18px;border-radius:8px;border:1px solid var(--accent-strong);background:'+(busy?'var(--surface-2)':'var(--accent)')+';font-size:13px;font-weight:700;color:'+(busy?'var(--text-3)':'var(--on-accent)')+';cursor:'+(busy?'wait':'pointer')+';">'+(busy?'Saving…':(isEdit?'Save changes':'Add contact'))+'</button>'
      + '</div>'
    + '</div>'
  + '</div>';
}

// =========================================================================
//   RENDER: MERGE MODAL
// =========================================================================
function renderMergeModal(){
  if (!state.mergeOpen) return '';
  const ids = state.mergeIds || [];
  const rows = ids.map(id => accts().find(a => a.id === id)).filter(Boolean);
  const keeper = state.mergeKeeper;
  const reasons = state.mergeReasons || [];
  const busy = state.mergeStatus === 'submitting';

function render(){
  // Preserve focused input's id + selection so typing in filter fields doesn't
  // lose focus after each keystroke (render() replaces innerHTML wholesale).
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
    focusId = active.id;
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch {}
  }
  // Preserve main-scroll position across the innerHTML swap so clicks on
  // interactive controls deep in the profile don't jerk back to top.
  const _scrollHost = document.getElementById('main-scroll');
  const _scrollTop = _scrollHost ? _scrollHost.scrollTop : 0;
  const col = state.sidebarCollapsed;
  let mainContent;
  if (state.detailId) {
    mainContent = renderDetail();
  } else if (state.page === 'home') {
    mainContent = renderDashboard();
  } else if (state.page === 'accounts') {
    mainContent = renderCompanies();
  } else if (state.page === 'pipeline') {
    mainContent = renderPipeline();
  } else if (state.page === 'renewal') {
    mainContent = renderRenewal();
  } else if (state.page === 'tasks') {
    mainContent = renderTasks();
  } else if (state.page === 'notifications') {
    mainContent = renderNotifications();
  } else if (state.page === 'reports') {
    mainContent = renderReports();
  } else if (state.page === 'logs') {
    mainContent = renderLogs();
  } else if (state.page === 'users') {
    mainContent = renderUsers();
  } else if (state.page === 'utm') {
    mainContent = renderUtm();
  } else if (state.page === 'amperf') {
    mainContent = renderAmperf();
  } else {
    mainContent = renderPlaceholder(state.page);
  }
  document.getElementById('app').innerHTML =
    '<div style="display:grid;grid-template-columns:'+(col?'56px':'232px')+' 1fr;height:100vh;overflow:hidden;background:var(--bg);">'
      + renderSidebar()
      + '<div style="display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;">'
        + renderTopbar()
        + '<div id="main-scroll" class="sc" style="flex:1;overflow-y:auto;min-height:0;">'
          + mainContent
        + '</div>'
      + '</div>'
    + '</div>'
    + renderCycleModal()
    + renderContactModal()
    + renderMergeModal()
    + renderLostModal()
    + renderTargetModal()
    + renderToast();
  // Restore focus + cursor to the same input the user was typing in.
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
      el.focus();
      try { if (selStart != null) el.setSelectionRange(selStart, selEnd ?? selStart); } catch {}
    }
  }
  // Restore main-scroll position.
  if (_scrollTop) {
    const nextHost = document.getElementById('main-scroll');
    if (nextHost) nextHost.scrollTop = _scrollTop;
  }
}

// Cache: live AMs from Supabase profiles (populated once at boot).
let LIVE_AMS = null;
let LIVE_CONTACTS_BY_ACCT = null;   // Map<accountId, {name, email, phone, title}>
let LIVE_CYCLES_BY_ACCT = null;     // Map<accountId, {plan, value, ends_at, status}>
let LIVE_TRACKING_BY_ACCT = null;   // Map<accountId, {first_source, first_campaign, ...}>
let LIVE_ACTIVITIES_BY_ACCT = new Map(); // Map<accountId, activities[]>
let LIVE_DETAILS_BY_ACCT = new Map();    // Map<accountId, { cycles, contacts, files }>
let LIVE_LOGS = null;               // Global recent activities feed

function formatMonYr(iso){
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return '—';
  // "5 Jan 2026" — day + short month + year
  return d.getDate() + ' ' + d.toLocaleDateString('en-US', { month:'short', year:'numeric' });
}
function formatShortDate(iso){
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function mapAcctFromSupabase(a, idx){
  const rd = a.raw_data || {};
  const name = a.name || rd['Company Name'] || rd.company_name || rd.company_name_lowercase || '(unnamed)';
  const domain = a.domain || rd.domain || '';
  const paid = a.paid_status || (a.is_paid_customer ? 'Paid' : 'Not Paid');
  const act  = a.activation_status || (a.trial_status === 'active' ? 'Active' : null);
  const stage = a.stage || (a.is_disqualified ? 'lost' : 'lead');
  const source = a.source || rd.Source || '';
  const region = a.region || rd.region || a.location || '';
  const industry = a.industry || rd.industry || '';
  // deal_value wins; then proposal_amount; then the active contract cycle's amount
  // (converted to EGP if the cycle is priced in USD/EUR/SAR — see FX_TO_EGP).
  // Swedish Group EG had a 72k cycle but no accounts.deal_value → header showed
  // '—'. Cycle fallback keeps the stat band honest.
  const cycValRaw = LIVE_CYCLES_BY_ACCT?.get(a.id);
  const cycValEgp = cycValRaw ? toEgp(cycValRaw.value, cycValRaw.currency) : 0;
  const value = Number(a.deal_value || a.proposal_amount || cycValEgp || 0) || 0;
  const score = Number(a.recruitera_score || 0);
  const tier  = (a.recruitera_tier || '').toLowerCase() || (score >= 80 ? 'hot' : score >= 60 ? 'warm' : 'cool');
  // Plan shows for anyone who's actually paying (or was paying) — Won,
  // "Paid", or "Without Charge". Leads/MQL/SQL/Demo/Proposal don't get a
  // plan even if a stale is_paid_customer=true flag exists.
  const cycle = LIVE_CYCLES_BY_ACCT?.get(a.id);
  const eligibleForPlan = stage === 'won'
                        || paid === 'Paid'
                        || paid === 'Without Charge';
  const planFromData = cycle?.plan || rd.plan || rd.Plan || '';
  const plan  = eligibleForPlan ? (planFromData || '—') : '—';
  // Renewal end date still uses the cycle end for the bucket calc regardless
  const cycleEnds = cycle?.ends_at || null;
  // Close/end date — for renewal bucketing prefer contract end; else deal_close_date; else close_date
  const rawEnd = cycleEnds || a.deal_close_date || a.close_date || null;
  const end = formatShortDate(rawEnd);
  // The renewal pipeline is ONLY for accounts that became real paying
  // customers — i.e. rows with a contract_cycle. Lost deals and expired
  // trials never enter it. This keeps the Churned column from filling up
  // with sales-side "Lost" deals.
  let ren = null;
  if (cycle && cycleEnds) {
    const d = Date.parse(cycleEnds);
    if (!isNaN(d)) {
      const days = (d - Date.now()) / (1000*60*60*24);
      const wasPaid = paid === 'Paid' || paid === 'Without Charge';
      if (cycle.status === 'churned') ren = 'churned';
      else if (cycle.status === 'renewed') ren = 'renewed';
      else if (days < 0) {
        // Cycle ended without a renewal record: churn if they've dropped
        // off (activation expired / paid flag cleared). Still-paying
        // customers past the end date go to Overdue for follow-up.
        if (!wasPaid || act === 'Expired') ren = 'churned';
        else ren = 'overdue';
      }
      else if (days <= 30) ren = 'd30';
      else if (days <= 60) ren = 'd60';
      else if (days <= 90) ren = 'd90';
      // >90 days → not in the renewal pipeline yet
    }
  }
  // Owner resolution priority:
  //   1. owner_id (authoritative FK to profiles.id — used by RLS)
  //   2. am_mail → live profile lookup by email
  //   3. am_mail → mock roster by first name (dev / logged-out preview)
  //   4. Cycle through mock roster by index so at least SOMETHING renders
  const amMail = (a.am_mail || '').toLowerCase().trim();
  let am = null;
  if (LIVE_AMS && a.owner_id) {
    const owned = LIVE_AMS.find(x => x.id === a.owner_id);
    if (owned) am = owned.id;
  }
  if (!am && LIVE_AMS && amMail) {
    const found = LIVE_AMS.find(x => x.email && x.email.toLowerCase() === amMail);
    if (found) am = found.id;
  }
  if (!am && amMail) {
    const first = amMail.split('@')[0].split('.')[0];
    const match = AMS.find(x => x.name.split(' ')[0].toLowerCase() === first);
    if (match) am = match.id;
  }
  if (!am) am = AMS[idx % AMS.length].id;
  const sinceRaw = a.bubble_created_at || a.paid_since || a.created_at;
  const since = formatMonYr(sinceRaw);
  return {
    id: a.id,
    name, domain, am, stage, paid, act,
    plan,
    used: 0, total: 0, jobs: 0, views: 0, applies: 0,   // deferred — no source table yet
    last: a.updated_at ? formatShortDate(a.updated_at) : '—',
    source, region, industry, value, score, tier,
    ren, end, since,
    _sinceRaw: sinceRaw,     // ISO date used for the Created column sort
    // Extras for Company Profile
    _bant: {
      budget:    a.bant_budget_yes,
      authority: a.bant_authority_yes,
      need:      a.bant_need_yes,
      timing:    a.bant_timing_yes,
    },
    _isDisqualified: a.is_disqualified,
    _disqReason: a.disq_reason,
    _lostReason: a.lost_reason,
    _lostDetail: a.lost_detail,
    _rcMail: a.rc_mail,
    _amMail: a.am_mail,
    logo_url: a.logo_url || null,
    // Bubble-legacy contact fallback: some accounts have Contact_* in raw_data
    // but no contacts row yet (backfill gap for new accounts). UI reads this
    // when LIVE_CONTACTS_BY_ACCT / loadDetailsForAccount return empty.
    _rawContact: (function(){
      const rd = a.raw_data || {};
      const name  = (rd['Contact_Name']  || '').trim();
      const email = (rd['Contact_Email'] || '').trim();
      const phone = (rd['Contact_Mobile']|| '').trim();
      if (!name && !email && !phone) return null;
      return { name, email, phone };
    })(),
    _cycleValue: cycle?.value,
    _cycleCurrency: cycle?.currency,
    _tracking: LIVE_TRACKING_BY_ACCT?.get(a.id),
    // Attribution fields from accounts row (populated on the trial signup form)
    _utm: {
      source:      a.utm_source,
      medium:      a.utm_medium,
      campaign:    a.utm_campaign,
      content:     a.utm_content,
    },
    _referrerUrl:      a.referrer_url,
    _landingPage:      a.landing_page,
    _ctaClicked:       a.cta_clicked,
    _wpMarketingChan:  a.wp_marketing_channel,
    _wpRecChallenge:   a.wp_rec_challenge,
    _firstTouch:       a.first_touch,
    _campaign:         a.campaign,
    _medium:           a.medium,
  };
}

async function fetchAllPages(token, path, opts){
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  const rows = [];
  let offset = 0;
  const pageSize = 1000;
  // Default cap 10 pages (10k rows) — enough for the whole book on any table.
  // Was 3 before, which silently dropped later contacts/cycles/tracking rows.
  const maxPages = (opts && opts.maxPages) || 10;
  for (let page = 0; page < maxPages; page++) {
    const glue = path.includes('?') ? '&' : '?';
    const url = SB_URL + path + glue + 'limit=' + pageSize + '&offset=' + offset;
    const res = await fetch(url, { headers });
    if (!res.ok) throw new Error('Supabase ' + res.status + ': ' + (await res.text()).slice(0,120));
    const batch = await res.json();
    if (!batch || batch.length === 0) break;
    rows.push(...batch);
    if (batch.length < pageSize) break;
    offset += pageSize;
  }
  return rows;
}

async function fetchContactsLive(token, accountIds){
  // RLS on contacts silently truncates BOTH unfiltered SELECT * AND
  // account_id=in.(...) queries to ~91 rows in prod (empirical). Only per-
  // account eq.<uuid> lookups (the pattern crm.html uses) reliably return
  // the row set. Fire one query per account, capped at CONCURRENCY parallel
  // in-flight requests so we don't hammer the server or hit rate limits.
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  const map = new Map();
  if (!accountIds || accountIds.length === 0) { LIVE_CONTACTS_BY_ACCT = map; return; }
  const CONCURRENCY = 20;
  let cursor = 0;
  let totalRows = 0;
  let failed = 0;

  async function worker(){
    while (cursor < accountIds.length) {
      const idx = cursor++;
      const aid = accountIds[idx];
      const url = SB_URL + '/rest/v1/contacts?select=id,account_id,full_name,job_title,email,phone,is_primary,notes'
                + '&account_id=eq.' + aid
                + '&order=is_primary.desc.nullslast,created_at.asc';
      try {
        const res = await fetch(url, { headers });
        if (!res.ok) { failed++; continue; }
        const rows = await res.json();
        if (!rows || rows.length === 0) continue;
        totalRows += rows.length;
        for (const c of rows) {
          let entry = map.get(aid);
          if (!entry) { entry = { name:'', title:'', email:'', phone:'', _primary:null }; map.set(aid, entry); }
          if (!entry.name  && c.full_name) entry.name  = c.full_name;
          if (!entry.title && c.job_title) entry.title = c.job_title;
          if (!entry.email && c.email)     entry.email = c.email;
          if (!entry.phone && c.phone)     entry.phone = c.phone;
          if (!entry._primary) entry._primary = c;
        }
      } catch (e) { failed++; }
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, () => worker()));

  LIVE_CONTACTS_BY_ACCT = map;
  console.log('[CRM v2] contacts fetched: ' + totalRows + ' rows → ' + map.size + ' accounts (per-account eq. mode; '
    + failed + ' failed). Alumil sample:',
    map.get('08ad87b0-a900-4c0c-baa0-5e8a9eb537b2') || 'MISSING');
}

async function fetchCyclesLive(token, accountIds){
  // Same RLS shape as contacts — bulk read is truncated. Per-account eq. is
  // the only pattern that reliably returns rows.
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  const map = new Map();
  if (!accountIds || accountIds.length === 0) { LIVE_CYCLES_BY_ACCT = map; return; }
  const CONCURRENCY = 20;
  let cursor = 0, totalRows = 0, failed = 0;
  async function worker(){
    while (cursor < accountIds.length) {
      const aid = accountIds[cursor++];
      const url = SB_URL + '/rest/v1/contract_cycles?select=account_id,status,plan_tier,value,currency,ends_at,cycle_number&account_id=eq.' + aid + '&order=cycle_number.desc';
      try {
        const res = await fetch(url, { headers });
        if (!res.ok) { failed++; continue; }
        const rows = await res.json();
        if (!rows || rows.length === 0) continue;
        // Take the highest cycle_number (already sorted desc)
        const c = rows[0];
        totalRows += rows.length;
        map.set(aid, {
          plan: c.plan_tier || '—',
          value: Number(c.value || 0),
          currency: c.currency || 'EGP',
          ends_at: c.ends_at,
          status: c.status,
        });
      } catch { failed++; }
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, () => worker()));
  LIVE_CYCLES_BY_ACCT = map;
  console.log('[CRM v2] cycles fetched: ' + totalRows + ' rows → ' + map.size + ' accounts (per-account eq.; ' + failed + ' failed)');
}

async function fetchTrackingLive(token){

  // signup_language / cta_clicked in the first pass — that's why the Days to

  const rows = await fetchAllPages(token, '/rest/v1/marketing_tracking?select=account_id,first_source,first_medium,first_campaign,first_landing_page,first_date,last_source,last_medium,last_campaign,last_date,device_type,signup_language,cta_clicked,days_to_convert,touch_count');

}

async function fetchAccountsRawLive(token){
  // Raw rows only — the caller maps them after joins (contacts / cycles /
  // tracking) are populated so mapAcctFromSupabase has real data to attach.
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  const rows = [];
  let offset = 0;
  const pageSize = 1000;
  for (let page = 0; page < 3; page++) {
    const url = SB_URL + '/rest/v1/accounts?select=*&order=created_at.asc&limit=' + pageSize + '&offset=' + offset + '&merged_into=is.null';
    const res = await fetch(url, { headers });
    if (!res.ok) throw new Error('Supabase ' + res.status + ': ' + (await res.text()).slice(0,120));
    const batch = await res.json();
    if (!batch || batch.length === 0) break;
    rows.push(...batch);
    if (batch.length < pageSize) break;
    offset += pageSize;
  }
  return rows;
}

// Back-compat wrapper — merge modal calls fetchAccountsLive to refresh the list.
async function fetchAccountsLive(token){
  const raw = await fetchAccountsRawLive(token);
  return raw.map(mapAcctFromSupabase);
}

async function loadActivitiesForAccount(accountId){
  if (LIVE_ACTIVITIES_BY_ACCT.has(accountId)) return; // cached
  const token = getAccessToken();
  if (!token) return;
  try {
    const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
    const url = SB_URL + '/rest/v1/activities?select=id,type,text,title,author_id,created_at,meeting_start_at,meeting_end_at,meeting_kind,call_direction,call_duration_minutes,from_stage,to_stage,task_due_date,task_done,priority&account_id=eq.' + encodeURIComponent(accountId) + '&is_archived=is.false&order=created_at.desc&limit=100';
    const res = await fetch(url, { headers });
    if (!res.ok) return;
    const rows = await res.json();
    LIVE_ACTIVITIES_BY_ACCT.set(accountId, rows);
    if (state.detailId === accountId) render();
  } catch(e){ console.warn('[CRM v2] activities load failed:', e.message); }
}

async function fetchLogsFeedLive(token){
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  const url = SB_URL + '/rest/v1/activities?select=id,account_id,type,text,title,author_id,created_at,from_stage,to_stage&is_archived=is.false&order=created_at.desc&limit=100';
  const res = await fetch(url, { headers });
  if (!res.ok) return;
  LIVE_LOGS = await res.json();
}

async function fetchNotificationsLive(token){
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  const url = SB_URL + '/rest/v1/notifications?select=id,kind,account_id,activity_id,title,body,read_at,created_at&order=created_at.desc&limit=100';
  const res = await fetch(url, { headers });
  if (!res.ok) return [];
  return res.json();
}
async function fetchTasksLive(token){
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + token };
  // activities table: type='task', not archived, task_done=false, limit 100
  const url = SB_URL + '/rest/v1/activities?select=id,account_id,title,text,type,task_due_date,task_done,author_id&type=eq.task&task_done=is.false&is_archived=is.false&order=task_due_date.asc.nullslast&limit=100';
  const res = await fetch(url, { headers });
  if (!res.ok) return [];
  const rows = await res.json();
  const accountsById = new Map((state.accounts || []).map(a => [a.id, a]));
  return rows.map(r => {
    const acct = accountsById.get(r.account_id);
    const dueLabel = r.task_due_date
      ? (() => {
          const d = new Date(r.task_due_date);
          const today = new Date(); today.setHours(0,0,0,0);
          const t = new Date(d); t.setHours(0,0,0,0);
          const diff = (t - today) / (1000*60*60*24);
          if (diff === 0) return 'Today';
          if (diff === 1) return 'Tomorrow';
          if (diff < 0) return 'Overdue';
          return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
        })()
      : '—';
    return {
      id: r.id,
      title: r.title || r.text || '(untitled task)',
      account: acct ? acct.name : '(account)',
      acctId: r.account_id,
      due: dueLabel,
      prio: dueLabel === 'Today' || dueLabel === 'Overdue' ? 'high' : 'med',
      type: 'task',
      done: !!r.task_done,
      am: acct ? acct.am : 'na',
    };
  });
}

async function bootLiveData(){
  const token = getAccessToken();
  if (!token) {
    // No mock preview — CRM must be logged in against Supabase.
    console.log('[CRM v2] no auth token → redirecting to /login');
    location.replace('/login');
    return;
  }
  state.dataStatus = 'loading';
  render();
  try {
    // Kick off every independent fetch immediately so nothing waits for anything
    // it doesn't structurally depend on. Only cycles/contacts/tracking need the
    // account id list, so those start after accounts resolve.
    const profilesP = fetchProfilesLive(token).catch(e => console.warn('[CRM v2] profiles:', e.message));
    const tasksP    = fetchTasksLive(token).then(t => { state.tasks = t; if (state.dataStatus === 'ready') render(); }).catch(e => { console.warn('[CRM v2] tasks:', e.message); state.tasks = []; });
    const notifP    = fetchNotificationsLive(token).then(n => { state.notifications = n; if (state.dataStatus === 'ready') render(); }).catch(e => { console.warn('[CRM v2] notifications:', e.message); state.notifications = []; });
    const logsP     = fetchLogsFeedLive(token).then(() => { if (state.page === 'logs') render(); }).catch(e => console.warn('[CRM v2] logs:', e.message));

    const accountRawRows = await fetchAccountsRawLive(token);
    // Show the dashboard as soon as we have raw accounts — joins can trickle in.
    state.accounts = accountRawRows.map(mapAcctFromSupabase);
    state.dataSource = 'live';
    state.dataStatus = 'ready';
    render();
    // Deep-link hydration: if we booted with ?detail=<uuid> the boot block set
    // state.detailId before accounts existed. Kick off the per-account joins
    // now so activities / cycles / contacts appear on the profile.
    if (state.detailId) {
      loadActivitiesForAccount(state.detailId);
      loadDetailsForAccount(state.detailId);
    }

    // Now fire the ID-scoped join fetches in parallel. Each re-maps accounts
    // + re-renders when it lands so the UI progressively hydrates.
    const accountIds = accountRawRows.map(r => r.id);
    const remap = () => { state.accounts = accountRawRows.map(mapAcctFromSupabase); render(); };
    await Promise.all([
      fetchContactsLive(token, accountIds).then(remap).catch(e => console.warn('[CRM v2] contacts:', e.message)),
      fetchCyclesLive(token, accountIds).then(remap).catch(e => console.warn('[CRM v2] cycles:', e.message)),
      fetchTrackingLive(token).then(remap).catch(e => console.warn('[CRM v2] tracking:', e.message)),
      profilesP, tasksP, notifP,
    ]);
    console.log('[CRM v2] live · ' + state.accounts.length + ' accounts · '
      + (LIVE_CONTACTS_BY_ACCT?.size||0) + ' contacts · '
      + (LIVE_CYCLES_BY_ACCT?.size||0) + ' cycles · '
      + (LIVE_TRACKING_BY_ACCT?.size||0) + ' tracking · '
      + (LIVE_AMS?.length||0) + ' profiles');
  } catch(e) {
    console.error('[CRM v2] live fetch failed:', e);
    state.dataStatus = 'error';
    state.dataError = String(e.message || e);
    render();
  }
}

// ---------- BOOT ----------
// Gate everything on auth. If there's no valid session, bootLiveData()
// redirects to /login and we never paint the shell.
if (!getAccessToken()) {
  document.body.innerHTML = '<div style="height:100vh;display:grid;place-items:center;font-family:inherit;color:#667;font-size:14px;">Redirecting to login…</div>';
  location.replace('/login');
} else {
  // Deep-link support: /crm-v2?view=<slug> jumps to that page,
  // /crm-v2?detail=<uuid> jumps to that account profile. Both survive
  // reload / share / new-tab, matching how /crm works.
  try {
    const qs = new URLSearchParams(location.search);
    const hs = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    const view = qs.get('view') || hs.get('view');
    if (view && VIEW_TO_PAGE[view]) state.page = VIEW_TO_PAGE[view];
    const deep = qs.get('detail') || hs.get('detail');
    if (deep) { state.detailId = deep; state.page = 'accounts'; }
  } catch {}
  render();
  bootLiveData();
  console.log('[CRM v2] mounted · role='+state.role+' · page='+state.page);
}
</script>
