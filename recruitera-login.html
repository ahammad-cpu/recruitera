<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recruitera CRM — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --lime-700: #CCED59; --lime-800: #B5D44A;
  --bg: #0D1117; --surface: #161B22; --surface-2: #21262D;
  --border: #30363D; --text: #F0F6FC; --text-2: #C9D1D9;
  --text-3: #8B949E; --ok: #2F8F5C; --bad: #B83A3A;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Montserrat', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; align-items: center;
  justify-content: center; padding: 24px;
  background: radial-gradient(circle at 20% 30%, rgba(204,237,89,0.05) 0%, transparent 50%),
              radial-gradient(circle at 80% 70%, rgba(57,35,150,0.08) 0%, transparent 50%), var(--bg);
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; max-width: 420px; width: 100%; box-shadow: 0 24px 80px rgba(0,0,0,0.4); }
.logo { width: 56px; height: 56px; background: var(--lime-700); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #1A2230; margin: 0 auto 24px; }
h1 { font-size: 24px; font-weight: 800; text-align: center; letter-spacing: -0.02em; margin: 0 0 8px; }
.subtitle { font-size: 13.5px; color: var(--text-3); text-align: center; margin: 0 0 32px; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); }
input { height: 46px; padding: 0 14px; background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit; width: 100%; }
input:focus { outline: none; border-color: var(--lime-700); box-shadow: 0 0 0 3px rgba(204,237,89,0.15); }
button { width: 100%; height: 46px; background: var(--lime-700); color: #1A2230; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; margin-top: 8px; transition: all 130ms; }
button:hover:not(:disabled) { background: var(--lime-800); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.status { margin-top: 20px; padding: 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; display: none; }
.status.success { background: rgba(47,143,92,0.15); border: 1px solid var(--ok); color: #5EBE85; display: block; }
.status.error { background: rgba(184,58,58,0.15); border: 1px solid var(--bad); color: #E27272; display: block; }
.footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--text-3); }
.toggle-btn { background: none; border: none; color: var(--text-3); font-size: 12px; cursor: pointer; font-family: inherit; text-decoration: underline; width: auto; height: auto; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">R</div>
  <h1>Sign in to Recruitera</h1>
  <p class="subtitle" id="subtitle">Enter your email — we'll send you a magic link.<br>No password needed.</p>
  <div class="field">
    <label for="email">Email address</label>
    <input type="email" id="email" required autocomplete="email" autofocus placeholder="you@company.com" value="a.hammad@icareer.ai"/>
  </div>
  <div class="field" id="pw-field" style="display:none;">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="Your password"/>
  </div>
  <button id="btn-submit" onclick="handleSubmit()">Send magic link</button>
  <div style="text-align:center;margin-top:10px;">
    <button class="toggle-btn" onclick="toggleMode()">Sign in with password instead</button>
  </div>
  <div id="status" class="status"></div>
  <div class="footer">
    Already signed in? <a href="./recruitera-crm-v7.html" style="color:var(--lime-700);font-weight:700;">Open CRM →</a>
  </div>
</div>
<script>
const SB_URL = 'https://rtdrlpnfqjtwtsrwnifn.supabase.co';
const SB_KEY = 'sb_publishable_jqOHcIOvPYsEWnSKQjjEWQ_vWsxCVwr';
const STORAGE_KEY = 'sb-rtdrlpnfqjtwtsrwnifn-auth-token';
let usePassword = false;

// Check if already signed in
(async () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const session = parsed?.currentSession || parsed;
      if (session?.access_token) {
        const exp = session.expires_at || session.user?.exp;
        if (!exp || Date.now()/1000 < exp - 60) {
          showStatus('success', 'Already signed in! <a href="./recruitera-crm-v7.html" style="color:inherit;font-weight:700;">Open CRM →</a>');
          return;
        }
      }
    }
  } catch(e) {}
  // Handle magic link hash
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    const params = new URLSearchParams(hash.substring(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    if (access_token) {
      try {
        const payload = JSON.parse(atob(access_token.split('.')[1]));
        const session = { access_token, refresh_token, expires_at: payload.exp, user: { id: payload.sub, email: payload.email } };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        window.location.href = './recruitera-crm-v7.html';
      } catch(e) { showStatus('error', 'Magic link error: ' + e.message); }
    }
  }
})();

function toggleMode() {
  usePassword = !usePassword;
  document.getElementById('pw-field').style.display = usePassword ? '' : 'none';
  document.getElementById('subtitle').innerHTML = usePassword
    ? 'Sign in with your email and password.'
    : 'Enter your email — we'll send you a magic link.<br>No password needed.';
  document.getElementById('btn-submit').textContent = usePassword ? 'Sign in' : 'Send magic link';
  document.querySelector('.toggle-btn').textContent = usePassword ? 'Use magic link instead' : 'Sign in with password instead';
}

async function handleSubmit() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn-submit');
  if (!email) return;
  btn.disabled = true; btn.textContent = 'Loading...';

  if (usePassword) {
    const password = document.getElementById('password').value;
    if (!password) { showStatus('error', 'Enter your password'); btn.disabled=false; btn.textContent='Sign in'; return; }
    try {
      const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.access_token) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        showStatus('success', '✅ Signed in! Redirecting...');
        setTimeout(() => window.location.href = './recruitera-crm-v7.html', 800);
      } else {
        showStatus('error', data.error_description || data.msg || 'Sign in failed');
        btn.disabled=false; btn.textContent='Sign in';
      }
    } catch(e) { showStatus('error', e.message); btn.disabled=false; btn.textContent='Sign in'; }
  } else {
    try {
      const redirectTo = window.location.origin + window.location.pathname.replace('recruitera-login.html','recruitera-crm-v7.html');
      const res = await fetch(`${SB_URL}/auth/v1/magiclink`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
        body: JSON.stringify({ email, options: { emailRedirectTo: redirectTo } })
      });
      if (res.ok || res.status === 429) {
        const msg = res.status === 429 ? 'Email rate limit exceeded — use password instead' : `✅ Magic link sent to <strong>${email}</strong>. Check your inbox.`;
        showStatus(res.status === 429 ? 'error' : 'success', msg);
      } else {
        const d = await res.json();
        showStatus('error', d.message || 'Failed to send magic link');
      }
    } catch(e) { showStatus('error', e.message); }
    btn.disabled=false; btn.textContent='Send magic link';
  }
}

function showStatus(type, html) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.innerHTML = html;
}
</script>
</body>
</html>
