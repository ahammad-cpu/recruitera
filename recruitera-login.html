<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recruitera CRM — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
      colors: {
        brand: { DEFAULT: '#C8E60A', dark: '#B3CF09' },
        navy: { DEFAULT: '#2D3444', dark: '#1E2535', darker: '#121720' }
      }
    }
  }
}
</script>
<style>
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
.ui-input { width:100%; height:42px; padding:0 14px; background:#1E2535; border:1.5px solid #2D3444; border-radius:10px; color:#F0F4FC; font-size:14px; font-family:inherit; transition:all 130ms; }
.ui-input:focus { outline:none; border-color:#C8E60A; box-shadow:0 0 0 3px rgba(200,230,10,0.15); }
.ui-input::placeholder { color:#475569; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.card { animation: fadeIn 300ms ease; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6" style="background:#0A0E14;">
  
  <!-- Background decoration -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full opacity-5" style="background:#C8E60A;filter:blur(80px);"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full opacity-5" style="background:#4465F6;filter:blur(80px);"></div>
  </div>

  <div class="card w-full max-w-sm relative z-10">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-4" style="background:#C8E60A;">
        <svg viewBox="0 0 100 100" width="38" height="38" xmlns="http://www.w3.org/2000/svg">
          <path d="M28 78 L28 28 Q28 20 36 20 L52 20 Q70 20 70 38 Q70 52 56 54 Q60 54 65 62 L74 78 L62 78 L53 63 Q50 58 44 58 L40 58 L40 78 Z M40 48 L50 48 Q58 48 58 38 Q58 28 50 28 L40 28 Z" fill="#1E2535"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Sign in to Recruitera</h1>
      <p class="text-sm text-slate-400 mt-1.5 text-center" id="subtitle">Enter your email — we'll send you a magic link.<br>No password needed.</p>
    </div>

    <!-- Form -->
    <div class="flex flex-col gap-3">
      <div>
        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Email address</label>
        <input type="email" id="email" class="ui-input" autocomplete="email" autofocus placeholder="you@company.com" value="a.hammad@icareer.ai"/>
      </div>
      <div id="pw-field" style="display:none;">
        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Password</label>
        <input type="password" id="password" class="ui-input" autocomplete="current-password" placeholder="Your password"/>
      </div>
      <button id="btn-submit" onclick="handleSubmit()" class="w-full h-11 rounded-xl font-bold text-sm transition-all mt-1" style="background:#C8E60A;color:#1E2535;box-shadow:0 4px 16px rgba(200,230,10,0.25);" onmouseover="this.style.background='#B3CF09'" onmouseout="this.style.background='#C8E60A'">
        Send magic link
      </button>
    </div>

    <!-- Toggle mode -->
    <div class="text-center mt-4">
      <button onclick="toggleMode()" id="mode-toggle" class="text-xs text-slate-500 hover:text-slate-300 transition-colors underline underline-offset-2">
        Sign in with password instead
      </button>
    </div>

    <!-- Status -->
    <div id="status" class="mt-4 rounded-xl p-3.5 text-sm hidden"></div>

    <!-- Footer -->
    <div class="mt-6 pt-5 border-t border-white/5 text-center text-xs text-slate-600">
      Already signed in? <a href="./recruitera-crm-v7.html" class="font-bold transition-colors" style="color:#C8E60A;">Open CRM →</a>
    </div>
  </div>

<script>
const SB_URL = 'https://rtdrlpnfqjtwtsrwnifn.supabase.co';
const SB_KEY = 'sb_publishable_jqOHcIOvPYsEWnSKQjjEWQ_vWsxCVwr';
const STORAGE_KEY = 'sb-rtdrlpnfqjtwtsrwnifn-auth-token';
let usePassword = false;

// Check if already signed in
(async () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const session = parsed?.currentSession || parsed;
      if (session?.access_token) {
        const exp = session.expires_at || session.user?.exp;
        if (!exp || Date.now()/1000 < exp - 60) {
          showStatus('success', '✅ Already signed in! <a href="./recruitera-crm-v7.html" style="color:inherit;font-weight:700;text-decoration:underline;">Open CRM →</a>');
          return;
        }
      }
    }
  } catch(e) {}
  // Handle magic link hash
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    const params = new URLSearchParams(hash.substring(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    if (access_token) {
      try {
        const payload = JSON.parse(atob(access_token.split('.')[1]));
        const session = { access_token, refresh_token, expires_at: payload.exp, user: { id: payload.sub, email: payload.email } };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        window.location.href = './recruitera-crm-v7.html';
      } catch(e) { showStatus('error', 'Magic link error: ' + e.message); }
    }
  }
})();

function toggleMode() {
  usePassword = !usePassword;
  document.getElementById('pw-field').style.display = usePassword ? '' : 'none';
  document.getElementById('subtitle').innerHTML = usePassword
    ? 'Sign in with your email and password.'
    : "Enter your email — we'll send you a magic link.<br>No password needed.";
  document.getElementById('btn-submit').textContent = usePassword ? 'Sign in' : 'Send magic link';
  document.getElementById('mode-toggle').textContent = usePassword ? 'Use magic link instead' : 'Sign in with password instead';
}

async function handleSubmit() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn-submit');
  if (!email) return;
  btn.disabled = true;
  btn.textContent = 'Loading…';

  if (usePassword) {
    const password = document.getElementById('password').value;
    if (!password) { showStatus('error', 'Enter your password'); btn.disabled=false; btn.textContent='Sign in'; return; }
    try {
      const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.access_token) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        showStatus('success', '✅ Signed in! Redirecting…');
        setTimeout(() => window.location.href = './recruitera-crm-v7.html', 800);
      } else {
        showStatus('error', data.error_description || data.msg || 'Sign in failed');
        btn.disabled=false; btn.textContent='Sign in';
      }
    } catch(e) { showStatus('error', e.message); btn.disabled=false; btn.textContent='Sign in'; }
  } else {
    try {
      const redirectTo = window.location.origin + window.location.pathname.replace('recruitera-login.html','recruitera-crm-v7.html');
      const res = await fetch(`${SB_URL}/auth/v1/magiclink`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
        body: JSON.stringify({ email, options: { emailRedirectTo: redirectTo } })
      });
      if (res.status === 429) {
        showStatus('error', 'Email rate limit — use password instead or wait a few minutes.');
      } else if (res.ok) {
        showStatus('success', `✅ Magic link sent to <strong>${email}</strong>. Check your inbox.`);
      } else {
        const d = await res.json();
        showStatus('error', d.message || 'Failed to send magic link');
      }
    } catch(e) { showStatus('error', e.message); }
    btn.disabled=false; btn.textContent='Send magic link';
  }
}

function showStatus(type, html) {
  const el = document.getElementById('status');
  el.className = 'mt-4 rounded-xl p-3.5 text-sm';
  if (type === 'success') { el.style.background='rgba(200,230,10,0.1)'; el.style.border='1px solid rgba(200,230,10,0.3)'; el.style.color='#8AAD00'; }
  else { el.style.background='rgba(239,68,68,0.1)'; el.style.border='1px solid rgba(239,68,68,0.2)'; el.style.color='#EF4444'; }
  el.innerHTML = html;
  el.style.display = 'block';
}
</script>
</body>
</html>
