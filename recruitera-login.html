      <h1 class="text-2xl font-extrabold tracking-tight text-white">Sign in to Recruitera</h1>
      <p class="text-sm text-slate-400 mt-1.5 text-center" id="subtitle">Sign in with your email and password.</p>
    </div>

    <!-- Form -->
    <div class="flex flex-col gap-3">
      <div>
        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Email address</label>
        <input type="email" id="email" class="ui-input" autocomplete="email" autofocus placeholder="you@company.com"/>
      </div>
      <div id="pw-field">
        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Password</label>
        <input type="password" id="password" class="ui-input" autocomplete="current-password" placeholder="Your password"/>
      </div>
      <button id="btn-submit" onclick="handleSubmit()" class="w-full h-11 rounded-xl font-bold text-sm transition-all mt-1" style="background:#C8E60A;color:#1E2535;box-shadow:0 4px 16px rgba(200,230,10,0.25);" onmouseover="this.style.background='#B3CF09'" onmouseout="this.style.background='#C8E60A'">
        Sign in
      </button>
    </div>

    <!-- Toggle mode -->
    <div class="text-center mt-4">
      <button onclick="forgotPassword()" id="forgot-pw" class="text-xs text-slate-500 hover:text-slate-300 transition-colors underline underline-offset-2">
        Forgot password?
      </button>
    </div>

    <!-- Status -->
    <div id="status" class="mt-4 rounded-xl p-3.5 text-sm hidden"></div>

    <!-- Footer -->
    <div class="mt-6 pt-5 border-t border-white/5 text-center text-xs text-slate-600">
      Already signed in? <a href="./recruitera-crm-v7.html" class="font-bold transition-colors" style="color:#C8E60A;">Open CRM →</a>
    </div>
  </div>

<script>
const SB_URL = 'https://rtdrlpnfqjtwtsrwnifn.supabase.co';
const SB_KEY = 'sb_publishable_jqOHcIOvPYsEWnSKQjjEWQ_vWsxCVwr';
const STORAGE_KEY = 'sb-rtdrlpnfqjtwtsrwnifn-auth-token';
// Check if already signed in
(async () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const session = parsed?.currentSession || parsed;
      if (session?.access_token) {
        const exp = session.expires_at || session.user?.exp;
        if (!exp || Date.now()/1000 < exp - 60) {
          showStatus('success', '✅ Already signed in! <a href="./recruitera-crm-v7.html" style="color:inherit;font-weight:700;text-decoration:underline;">Open CRM →</a>');
          return;
        }
      }
    }
  } catch(e) {}
})();

async function handleSubmit() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-submit');
  if (!email) { showStatus('error', 'Enter your email'); return; }
  if (!password) { showStatus('error', 'Enter your password'); return; }
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!data.access_token) {
      showStatus('error', data.error_description || data.msg || 'Sign in failed');
      btn.disabled=false; btn.textContent='Sign in';
      return;
    }

    // Verify the user has a profile row before we let them in
    const profRes = await fetch(`${SB_URL}/rest/v1/profiles?id=eq.${data.user.id}&select=id,role&limit=1`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + data.access_token }
    });
    const prof = await profRes.json();
    if (!prof || !prof[0]) {
      // Not in profiles → reject sign-in
      alert('No such user. This email is not registered in the CRM. Please contact an administrator.');
      showStatus('error', 'This email is not registered in the CRM. Contact an administrator.');
      btn.disabled=false; btn.textContent='Sign in';
      return;
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    showStatus('success', '✅ Signed in! Redirecting…');
    setTimeout(() => window.location.href = './recruitera-crm-v7.html', 600);
  } catch(e) {
    showStatus('error', e.message);
    btn.disabled=false; btn.textContent='Sign in';
  }
}

async function forgotPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showStatus('error', 'Enter your email above first, then click "Forgot password?".'); return; }
  const link = document.getElementById('forgot-pw');
  const prev = link.textContent;
  link.disabled = true;
  link.textContent = 'Sending…';
  try {
    const redirectTo = window.location.origin + window.location.pathname; // back to this login page
    const res = await fetch(`${SB_URL}/auth/v1/recover`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ email, options: { emailRedirectTo: redirectTo } })
    });
    if (res.ok || res.status === 200) {
      // Supabase intentionally returns 200 even if the email doesn't exist (anti-enumeration)
      showStatus('success', `✅ If <strong>${email}</strong> is registered, a password reset link has been sent. Check your inbox.`);
    } else if (res.status === 429) {
      showStatus('error', 'Too many requests — wait a few minutes and try again.');
    } else {
      const d = await res.json().catch(()=>({}));
      showStatus('error', d.message || d.error_description || 'Could not send reset email.');
    }
  } catch(e) {
    showStatus('error', e.message);
  }
  link.disabled = false;
  link.textContent = prev;
}

function showStatus(type, html) {
  const el = document.getElementById('status');
  el.className = 'mt-4 rounded-xl p-3.5 text-sm';
  if (type === 'success') { el.style.background='rgba(200,230,10,0.1)'; el.style.border='1px solid rgba(200,230,10,0.3)'; el.style.color='#8AAD00'; }
  else { el.style.background='rgba(239,68,68,0.1)'; el.style.border='1px solid rgba(239,68,68,0.2)'; el.style.color='#EF4444'; }
  el.innerHTML = html;
  el.style.display = 'block';
}
</script>
