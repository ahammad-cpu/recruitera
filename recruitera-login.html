<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recruitera CRM — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --lime-700: #CCED59;
  --lime-800: #B5D44A;
  --cg-50: #EAEBEC;
  --cg-100: #D0D2D6;
  --cg-300: #9CA3AF;
  --cg-700: #4B5563;
  --cg-900: #2D3844;
  --bg: #0D1117;
  --surface: #161B22;
  --surface-2: #21262D;
  --border: #30363D;
  --text: #F0F6FC;
  --text-2: #C9D1D9;
  --text-3: #8B949E;
  --text-4: #6E7681;
  --ok: #2F8F5C;
  --bad: #B83A3A;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(circle at 20% 30%, rgba(204,237,89,0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(57,35,150,0.08) 0%, transparent 50%),
    var(--bg);
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 36px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,0.4);
}

.logo {
  width: 56px; height: 56px;
  background: var(--lime-700);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 800;
  color: #1A2230;
  margin: 0 auto 24px;
  letter-spacing: -0.02em;
}

h1 {
  font-size: 24px;
  font-weight: 800;
  text-align: center;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
}

.subtitle {
  font-size: 13.5px;
  color: var(--text-3);
  text-align: center;
  margin: 0 0 32px;
  line-height: 1.5;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-3);
}

input[type="email"] {
  height: 46px;
  padding: 0 14px;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color 130ms, box-shadow 130ms;
}
input[type="email"]:focus {
  outline: none;
  border-color: var(--lime-700);
  box-shadow: 0 0 0 3px rgba(204,237,89,0.15);
}

button {
  width: 100%;
  height: 46px;
  background: var(--lime-700);
  color: #1A2230;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 130ms;
  margin-top: 8px;
}
button:hover:not(:disabled) {
  background: var(--lime-800);
  transform: translateY(-1px);
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  display: none;
}
.status.success {
  background: rgba(47,143,92,0.15);
  border: 1px solid var(--ok);
  color: #5EBE85;
  display: block;
}
.status.error {
  background: rgba(184,58,58,0.15);
  border: 1px solid var(--bad);
  color: #E27272;
  display: block;
}

.footer {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 11px;
  color: var(--text-4);
  line-height: 1.6;
}
.footer code {
  background: var(--surface-2);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10.5px;
  color: var(--text-3);
}

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(26,34,48,0.3);
  border-top-color: #1A2230;
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">R</div>
    <h1>Sign in to Recruitera</h1>
    <p class="subtitle">Enter your email — we'll send you a magic link.<br>No password needed.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" required autocomplete="email" autofocus
               placeholder="you@company.com" value="a.hammad@icareer.ai"/>
      </div>
      <div class="field" id="password-field" style="display:none;">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Your password"/>
      </div>
      <button type="submit" id="btn-send">
        <span id="btn-text">Send magic link</span>
        <span id="btn-spin" class="spinner" style="display:none;"></span>
      </button>
    </form>
    <div style="text-align:center;margin-top:14px;">
      <button onclick="toggleMode()" style="background:none;border:none;color:var(--color-muted,#8B949E);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline;" id="mode-toggle">Sign in with password instead</button>
    </div>

    <div id="status" class="status"></div>

    <div class="footer">
      Already authenticated? <a href="./recruitera-crm-v7.html" style="color:var(--lime-700);text-decoration:none;font-weight:600;">Open the CRM →</a>
    </div>
  </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://rtdrlpnfqjtwtsrwnifn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jqOHcIOvPYsEWnSKQjjEWQ_vWsxCVwr';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const form     = document.getElementById('login-form');
const emailInp = document.getElementById('email');
const btn      = document.getElementById('btn-send');
const btnText  = document.getElementById('btn-text');
const btnSpin  = document.getElementById('btn-spin');
const status   = document.getElementById('status');

// If user is already signed in, redirect immediately
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    showStatus('success', `Already signed in as ${session.user.email}. Redirecting…`);
    setTimeout(() => window.location.href = './recruitera-crm-v7.html', 1500);
  }
})();

let usePassword = false;

window.toggleMode = () => {
  usePassword = !usePassword;
  const pwField = document.getElementById('password-field');
  const toggle = document.getElementById('mode-toggle');
  const btnTxt = document.getElementById('btn-text');
  if (usePassword) {
    pwField.style.display = '';
    toggle.textContent = 'Send magic link instead';
    btnTxt.textContent = 'Sign in';
  } else {
    pwField.style.display = 'none';
    toggle.textContent = 'Sign in with password instead';
    btnTxt.textContent = 'Send magic link';
  }
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = emailInp.value.trim();
  if (!email) return;

  btn.disabled = true;
  btnText.style.display = 'none';
  btnSpin.style.display = '';
  status.className = 'status';
  status.style.display = 'none';

  if (usePassword) {
    const password = document.getElementById('password').value;
    if (!password) { btn.disabled = false; btnText.style.display=''; btnSpin.style.display='none'; showStatus('error', 'Enter your password'); return; }
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btnText.style.display = '';
    btnSpin.style.display = 'none';
    if (error) {
      showStatus('error', error.message);
    } else {
      showStatus('success', '✅ Signed in! Redirecting...');
      setTimeout(() => window.location.href = './recruitera-crm-v7.html', 800);
    }
  } else {
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: window.location.origin + window.location.pathname.replace('recruitera-login.html', 'recruitera-crm-v7.html')
      }
    });
    btn.disabled = false;
    btnText.style.display = '';
    btnSpin.style.display = 'none';
    if (error) {
      showStatus('error', error.message);
    } else {
      showStatus('success', `✅ Magic link sent to <strong>${email}</strong>.<br>Check your inbox — link expires in 1 hour.`);
    }
  }
});

function showStatus(type, html) {
  status.className = `status ${type}`;
  status.innerHTML = html;
  status.style.display = 'block';
}
</script>
</body>
</html>
